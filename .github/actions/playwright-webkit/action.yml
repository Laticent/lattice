name: Playwright WebKit, without the package mirror
description: >
  Installs Playwright's WebKit and its system packages from GitHub's cache, keyed on the runner image's OS and the
  pinned Playwright version. Ubuntu's mirror is read only when the cache is empty (a Playwright upgrade, or a cache
  evicted after 7 days unused) or no longer fits a newer runner image, which install-deps.sh repairs with a warning.
  The WebKit nightly runs this on main every night, so a pull request finds the cache warm.
  Run it after `npm ci` in docs/ (it reads the Playwright version from docs/node_modules).
runs:
  using: composite
  steps:
    - name: Cache key
      id: key
      shell: bash
      # The image's OS, its CPU and the Playwright version pick the package set; the image VERSION (GitHub updates it
      # about weekly) is in the key too, so a new image saves an entry of its own. It falls back to the last image's
      # entry, and install-deps.sh repairs that from the mirror only if it does not fit.
      run: |
        echo "base=playwright-webkit-$ImageOS-$RUNNER_ARCH-$(node -p "require('./docs/node_modules/playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"
        echo "image=$ImageVersion" >> "$GITHUB_OUTPUT"
    - name: Restore WebKit and its packages
      id: cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/ms-playwright/webkit-*
          ~/playwright-webkit-debs
        key: ${{ steps.key.outputs.base }}-${{ steps.key.outputs.image }}
        restore-keys: ${{ steps.key.outputs.base }}-
    - name: Download WebKit's system packages (nothing restored only)
      shell: bash
      # A restored folder counts even when empty: the image it was built on lacked nothing, and the install step's check
      # repairs anything this image lacks. Only no folder at all (no entry for this OS, CPU and Playwright) downloads.
      run: |
        if [ -d "$HOME/playwright-webkit-debs" ]; then echo 'restored from the cache'; exit 0; fi
        bash "$GITHUB_ACTION_PATH/install-deps.sh" download "$HOME/playwright-webkit-debs"
    - name: Install WebKit's system packages
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/install-deps.sh" install "$HOME/playwright-webkit-debs"
    - name: Install Playwright WebKit (pinned to @playwright/test; a no-op on a cache hit)
      shell: bash
      working-directory: docs
      run: npx playwright install webkit
