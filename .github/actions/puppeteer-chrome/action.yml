name: Puppeteer's Chrome, installed or a red step
description: >
  Makes sure the Chrome that the pinned puppeteer launches is on disk, and fails this step by name when it cannot.
  `npm ci` already downloads it through puppeteer's postinstall, but that script catches a failed download, prints
  "ERROR: Failed to set up chrome" and exits 0, and npm hides a passing script's output. So a download that failed
  on a cold `~/.cache/puppeteer` left a green `npm ci` and no browser, and the job went red minutes later with
  "Could not find Chrome" in every rendering test (integration shard 4/4, run 43974960155: 41 failed, 186 canceled,
  while shards 1-3 on the same cache miss downloaded fine). `puppeteer browsers install chrome` exits 1 on a
  failure, finishes in about 0.5 s when the browser is already there, and repairs the folders a failed postinstall
  leaves behind. It tries the download three times: a retry of a network fetch, not of a test (HARD RULE #33).
  Run it after the root `npm ci`, in every job that restores `~/.cache/puppeteer`; the contract test
  test/unit/tools/puppeteer-chrome-step.test.js holds that.
runs:
  using: composite
  steps:
    - name: Install Chrome for puppeteer (three tries)
      shell: bash
      run: |
        for try in 1 2 3; do
          if npx --no-install puppeteer browsers install chrome; then exit 0; fi
          [ "$try" -lt 3 ] && { echo "::warning::Chrome download failed (try $try of 3); trying again in $((try * 10)) s"; sleep $((try * 10)); }
        done
        echo "::error::puppeteer could not download its Chrome in three tries. Every rendering step after this one would fail with 'Could not find Chrome'."
        exit 1
