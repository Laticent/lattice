name: Agent pack eval nightly

# Does the agent pack make a model write a good deck? tools/agent-pack-eval.mjs gives a model the
# agent kit's start.md, lets it read the kit files start.md links to (the retrieval arm: two turns),
# and judges every deck with lint:deck and a real render. It holds the ten fixed briefs and the pass bar.
# engineering/decisions/2026-11-17-agent-pack.md §4.5 and §4.10.
#
# Nightly: the retrieval arm, ten briefs, ONE model a night: Haiku 5.5 and DeepSeek V4.1 Flash
# alternate by day (`--model nightly`; the owner's call, desk session_015KSkL4AtPNjvKkBShG56Nu,
# 2026-11-27: "mix it up, not stack"). Dispatch runs anything else, e.g. the per-release Sonnet check
# (RELEASE.md) or a paired old-vs-new start.md comparison (old_ref).
#
# Spends OUR OpenRouter key (HARD RULE #24), so it is nightly + dispatch only, never on the PR
# path, and sanctioned in tools/check-ownership.js (SANCTIONED_OPENROUTER_WORKFLOWS). It FAILS
# when the secret is unset rather than skipping green (#1931). The tool stops hard at --max-usd
# (USD 0.25 a night), pricing each call's worst case at the model's dearest provider, and prints
# OpenRouter's own figure. Cost: about USD 0.02 to 0.06 a night on either model at the cheapest
# provider, which the request asks for first; priced 2026-11-27 from OpenRouter's live list for ten
# two-turn decks over the ~11.7k-token start.md. Replace it with R1's measured figure once that run reports.

on:
  schedule:
    - cron: '17 3 * * *' # daily 03:17 UTC, clear of the 04:xx nightlies
  workflow_dispatch:
    inputs:
      arm:
        description: 'start, small or retrieval. Empty = retrieval.'
        required: false
        default: ''
      model:
        description: 'An OpenRouter model id, or "nightly" (Haiku and DeepSeek by day). Empty = nightly.'
        required: false
        default: ''
      repeat:
        description: 'Runs per brief (seed = repeat index). Use temperature above 0 with more than 1.'
        required: false
        default: '1'
      temperature:
        description: 'Sampling temperature.'
        required: false
        default: '0'
      reasoning:
        description: 'Reasoning: auto (a 1,500-token budget for Anthropic, effort minimal for others), low, minimal, medium, high, or default (send none).'
        required: false
        default: 'auto'
      max_usd:
        description: 'Hard cap in USD; the run stops before a call could cross it.'
        required: false
        default: '0.25'
      old_ref:
        description: 'Paired mode: a git ref whose built start.md is the OLD arm (the new one is this checkout).'
        required: false
        default: ''
      probe:
        description: 'Only count prompt tokens (one max_tokens-1 call per start.md); no decks.'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# A manual dispatch gets a group of its own, so it never cancels another. GitHub keeps one PENDING
# run per group and drops older pending ones, so a shared group let one dispatch silently cancel
# the next (run 46064627987, 2026-11-27). Each dispatch spends up to its own max_usd. Scheduled
# nights share one group and never overlap.
concurrency:
  group: agent-pack-eval-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'nightly' }}
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-24.04
    timeout-minutes: 90 # a paired run (60 decks plus a second build) is estimated near an hour; a nightly ~15 min
    steps:
      - name: Require the OpenRouter key
        run: |
          if [ '${{ secrets.OPEN_ROUTER_KEY != '' }}' != 'true' ]; then
            echo "::error title=OPEN_ROUTER_KEY missing::the OPEN_ROUTER_KEY secret is not set; the agent pack eval did not run."
            echo "### Agent pack eval NOT RUN: OPEN_ROUTER_KEY is not set" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cache Puppeteer browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      # puppeteer's postinstall swallows a failed download and exits 0; this step fails by name instead.
      - uses: ./.github/actions/puppeteer-chrome
        timeout-minutes: 5 # a stalled download fails here, not at the job cap
      - name: Build the agent kit and the CLI
        run: npm run build
      # Paired mode: check the old ref out beside this one, build it with its own dependencies,
      # and keep only its start.md. The judge (lint:deck, the render) stays this checkout's.
      - uses: actions/checkout@v4
        if: ${{ inputs.old_ref != '' }}
        with:
          ref: ${{ inputs.old_ref }}
          path: old-tree
          persist-credentials: false
      - name: Build the old start.md
        if: ${{ inputs.old_ref != '' }}
        run: |
          set -euo pipefail
          (cd old-tree && npm ci && npm run build)
          cp old-tree/dist/agent-kit/start.md "$RUNNER_TEMP/old-start.md"
      - name: Run the eval
        env:
          OPEN_ROUTER_KEY: ${{ secrets.OPEN_ROUTER_KEY }}
          OPENROUTER_ALLOW_SPEND: '1'
          ARM: ${{ inputs.arm }}
          MODEL: ${{ inputs.model }}
          REPEAT: ${{ inputs.repeat }}
          TEMPERATURE: ${{ inputs.temperature }}
          REASONING: ${{ inputs.reasoning }}
          MAX_USD: ${{ inputs.max_usd }}
          OLD_REF: ${{ inputs.old_ref }}
          PROBE: ${{ inputs.probe }}
        # pipefail: without it the step takes tee's exit code, and a failed deck goes green.
        # A schedule run has no inputs, so every one falls back to the nightly default here.
        run: |
          set -euo pipefail
          args=(--out eval-out --arm "${ARM:-retrieval}" --model "${MODEL:-nightly}" --repeat "${REPEAT:-1}"
                --temperature "${TEMPERATURE:-0}" --reasoning "${REASONING:-auto}" --max-usd "${MAX_USD:-0.25}")
          if [ -n "${OLD_REF:-}" ]; then args+=(--old "$RUNNER_TEMP/old-start.md"); fi
          if [ "${PROBE:-false}" = 'true' ]; then args+=(--probe); fi
          node tools/agent-pack-eval.mjs "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload the decks, PDFs and summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-pack-eval
          path: eval-out/
          if-no-files-found: ignore
          retention-days: 14
