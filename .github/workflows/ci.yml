name: CI

on:
  pull_request:
    branches: [main]
  # The merge queue runs CI on the PR tentatively rebased onto current main
  # (plus any PRs ahead of it). THIS aggregate `ci` check is the required gate
  # the queue waits on, so it must fire on merge_group. See
  # engineering/decisions/2026-06-17-workflow-efficiency-review.md §F.
  merge_group:
  # NOTE: there is deliberately NO `push: [main]` trigger. Post-merge validation
  # of main comes from the merge_group run (the queue tests the exact tree it
  # then squashes) — re-running full CI on the post-squash push would be a third
  # redundant pipeline per merge. The docs-site DEPLOY runs on push:[main] in its
  # own workflow (docs.yml), so dropping it here costs no deploy coverage. Until
  # the queue is enabled in branch protection, the PR's own run + HARD RULE #16's
  # pre-merge CI re-confirm cover the merge.

# Cancel superseded runs on the same ref — rapid pushes to a PR no longer
# pile up full pipelines.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Change classifier ──────────────────────────────────────────────────
  # Splits a change into two independent tiers:
  #   code  — affects rendering or the test suite → unit + integration
  #   docs  — affects the docs site (Astro) → docs-build
  # An allowlist of roots, NOT "everything that isn't prose": a docs-site-only
  # change (docs/**) no longer drags the whole engine unit+integration
  # pipeline, and prose (README, design/, engineering/, *.md) runs only the
  # always-on lint. Decks count as code (they affect rendering) and live inside
  # the listed roots — examples/, plus the gallery/baseline .md under lib/ and
  # test/. An engine change (lib/, themes/, dist/, …) sets BOTH, because the
  # docs build also reads the engine (loadAll + staged dist/ + themes/).
  changes:
    runs-on: ubuntu-latest
    outputs:
      # On merge_group (the merge queue's combined-state run) run EVERYTHING:
      # it's the final pre-merge gate, so path-skipping is the wrong economy,
      # and paths-filter has no PR base to diff against there.
      code: ${{ steps.filter.outputs.code == 'true' || github.event_name == 'merge_group' }}
      docs: ${{ steps.filter.outputs.docs == 'true' || github.event_name == 'merge_group' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'merge_group'
        with:
          filters: |
            code:
              - 'lib/**'
              - 'tools/**'
              - 'test/**'
              - 'themes/**'
              # assets/fonts/** is a real build input (tools/build-css.js ASSET_FONTS,
              # tools/check-fonts.js) and was previously reached ONLY via 'dist/**':
              # a font change forced a dist/fonts + dist/*.css rebuild into the PR,
              # which matched. dist/ is no longer committed, so 'dist/**' can never
              # match again and a fonts-only change would have run no test tier at all.
              - 'assets/fonts/**'
              - 'examples/**'
              # Worked exemplar decks ship a committed .pdf each and ride the
              # integration render gate (test/integration/exemplars/); an
              # exemplars-only change must run the integration tier so the
              # render + committed-PDF-freshness gate fires on its primary trigger.
              - 'exemplars/**'
              # kit/Sample-Deck.md is the source of dist/marp-kit's deck AND the
              # fixture test/integration/export/marp-kit-render.test.js renders
              # through real marp-cli. Editing it must run the gate that renders
              # it — build:check would catch the resulting dist staleness, but
              # only after the render tier had been skipped.
              - 'kit/**'
              - 'lattice-emulator.js'
              - 'mermaid-v11.min.js'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
            docs:
              - 'docs/**'
              - 'assets/fonts/**' # same reason as `code` above — dist/** no longer matches
              - 'themes/**'
              - 'lib/**'
              # The exemplar decks are staged into the docs build; keep an
              # exemplars-only change re-running the docs job.
              - 'exemplars/**'
              - '.github/workflows/ci.yml'

  # ── Lint — ALWAYS runs (incl. docs-only) ───────────────────────────────
  # Node-agnostic and browser-free: source lint + author-facing deck lint.
  # PUPPETEER_SKIP_DOWNLOAD keeps `npm ci` from pulling ~150 MB of Chromium
  # that nothing here uses.
  lint:
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Lint decks
        # Author-facing footgun checks across every deck (--strict): both
        # errors (card-style inline-title, ordered-list bold) and warnings
        # (unknown _class tokens) fail.
        run: npm run lint:deck:all
      # ── Artifact freshness — ALWAYS runs, on EVERY PR ──────────────────────
      # build:check regenerates EVERY committed generated artifact (dist bundles,
      # spec docs, the capability + DECISION indexes, dist README) and byte-diffs.
      # ONE exception, deliberately: the decision index is checked for CONTENT rather
      # than bytes — every note has its own correct entry — because a byte-diff there
      # cannot be satisfied by two decision-doc PRs sharing the queue, and ejected one
      # of them (#1547, decisions/2026-08-10-decisions-index-merge-queue-race.md).
      # It lives in this ALWAYS-ON job, deliberately NOT behind the code/docs paths
      # filter, because some of its inputs match NEITHER filter — e.g. a new
      # engineering/decisions/*.md stales engineering/decisions/README.md, and
      # engineering/** is in no filter. Gating it let a stale generated file pass a
      # docs/prose-only PR's green checks and then FAIL in the merge queue (which
      # forces the full suite on merge_group), ejecting the PR *silently* — the exact
      # trap this closes. Render-free + deterministic (a pure byte-diff), so it's
      # cheap to always run and never false-positives. Root deps suffice (it built
      # fine in the old `unit` home with root-only `npm ci`).
      # See engineering/decisions/2026-07-22-freshness-gate-always-on.md.
      # BOOTSTRAP, and the order is the whole point. The ownership guard inside
      # build:check reads dist/ CSS to know which tokens are declared, and a
      # generated docs bundle for the style-sink check — but dist/ is built, not
      # committed, so a checkout has neither and the guard fails on the absence of
      # the files the build exists to produce.
      #
      # This generates ONLY the built-not-committed half. Running the FULL build
      # here would rewrite the committed artifacts too, and the freshness check
      # after it would then compare fresh against fresh and pass vacuously — a gate
      # that cannot fail. Generating only the uncommitted half gives the guard its
      # inputs while leaving the committed half exactly as checked out.
      - name: Bootstrap the built-not-committed artifacts (no render)
        run: npm run build:uncommitted

      - name: Artifact freshness gate (committed artifacts, no render)
        run: npm run build:check

  # ── Unit — code changes only ────────────────────────────────────────────
  # The engines claim is `>=22`. The FULL unit suite runs on 22; on 24 a
  # representative engine smoke subset (core/engine/parsing/
  # transformers) confirms cross-version compat without paying 2× the whole
  # suite — pure-JS Node-version risk is low and concentrated in the engine
  # paths. See engineering/decisions/2026-06-17-workflow-efficiency-review.md §D.
  # NOTE: the artifact-freshness gate (build:check) used to live here, gated on
  # `code`; it moved to the ALWAYS-ON `lint` job so a stale generated file can't
  # slip past a docs/prose-only PR and then eject it from the merge queue (see the
  # lint job + engineering/decisions/2026-07-22-freshness-gate-always-on.md).
  unit:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    name: unit (node ${{ matrix.node-version }})
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      # dist/ and the docs-site bundles are BUILT, not committed (.gitignore), so a
      # checkout does not have them and everything below that loads the engine
      # needs them on disk. ~16s, no browser.
      #
      # It must come AFTER the freshness gate in the `lint` job and nowhere before
      # one: building first makes every generated file on disk fresh, so a
      # `--check` after it passes vacuously and stops being a gate at all.
      - name: Build the generated bundles
        run: npm run build
      # Runs every generator's OWN --check against a tree that has just been fully
      # built. Note carefully what that does and does not buy, because the obvious
      # reading is wrong in both directions.
      #
      # WHAT IT ASKS, versus the `lint` job's build:check — they look alike and are
      # opposite-facing:
      #
      #   lint / build:check       "did you COMMIT the regenerated artifact?" A
      #     staleness question about the checkout, so it must run BEFORE any build
      #     or it passes vacuously. Runs --exclude-uncommitted, so it never looks
      #     at dist/ at all.
      #
      #   here / build:check:all   "does each generator still verify clean against
      #     a freshly built tree?" Answerable only after a build. This is the only
      #     gate in CI that looks at the 25 built-not-committed artifacts.
      #
      # WHAT IT DOES NOT CATCH, and this is deliberate, not a gap to close. The
      # step delegates to each generator's --check, and those semantics differ ON
      # PURPOSE (build.js's own note above the STEPS table): build-decisions-index
      # verifies that every note has exactly one correctly-formatted row, NOT that
      # the file equals a regeneration, so two decision-doc PRs can share the merge
      # queue without ejecting each other (#1547). Demonstrated consequences —
      # reversing that index's sort, or appending to an AUTHORED *.gallery.md
      # (build-component-docs checks those for existence only), both leave this
      # step green. Anything wanting a true byte-diff has to say so in its own
      # generator; do not "fix" it here, because rebuilding and git-diffing the
      # tree is exactly what re-opened #1547 once already.
      #
      # WHAT IT DOES CATCH, measured by mutation rather than assumed: a generator
      # whose writer drifts from its own --check. Making build-dist-readme.js
      # append a line to its output turns this step red and names dist/README.md;
      # making build-css.js write `freshMin` to OUTPUT does the same for
      # lattice.css. That is the coverage a unit test used to carry by comparing
      # dist/lattice.css against bundle() on whatever the developer last built —
      # vacuous in CI, and spuriously red locally after the rebase HARD RULE #16
      # requires before every push (#1783).
      #
      # COST: ~12s, of which ~7s re-runs the ownership guard and preflight gates
      # that `npm run build` above already ran (build.js runs them unconditionally
      # under --check; there is no flag to skip). ~5s is new verification. Doubled
      # by the node 22/24 matrix.
      - name: Generated artifacts match their generators (post-build, end-to-end)
        run: npm run build:check:all
      # REMOVED: the playground-bundle byte-diff gate. It asked "is the COMMITTED
      # bundle stale?" — a question with no meaning now that the bundle is built
      # rather than committed. The staleness it guarded against is gone at the
      # root: every job and the docs deploy build the bundle from current source.
      - name: Unit tests (full suite)
        if: matrix.node-version == 22
        run: npm test
      - name: Unit tests (engine + export smoke subset)
        if: matrix.node-version != 22
        # core/engine/parsing/transformers cover the render kernels;
        # export/ is added because PPTX/PDF export leans on Node stream/buffer/
        # zip/child-process APIs — the most Node-version-sensitive non-engine area.
        run: node --test 'test/unit/core/*.test.js' 'test/unit/engine/*.test.js' 'test/unit/parsing/*.test.js' 'test/unit/transformers/*.test.js' 'test/unit/export/*.test.js'

  # ── Integration — code changes only ────────────────────────────────────
  # The only tier that renders, so the only one that needs Chromium — cached
  # across runs (keyed on the lockfile, which moves when puppeteer bumps).
  # Runs once: the engine/Puppeteer render pipeline doesn't vary by Node.
  # The PR-blocking slice of the render tier: shared-kernel cross-path WIRING
  # (parity/), the export pipeline (export/), and the per-component computed-style
  # correctness gate (invariants/). The heavier fresh-render REGRESSION suites
  # (galleries, components, exemplars=45 decks, mermaid-smoke, screenshot) moved
  # OFF this critical path to integration-nightly.yml — their only catch is
  # "a render drifted / a committed artifact went stale", and the latter is
  # already backstopped at pre-commit (tools/build-staged-pdfs.js + the freshness
  # gates), so a next-morning catch on `main` is cheap to revert. Same gate-strategy
  # bias as perf-nightly / preview-e2e-nightly: keep blocking gates blocking, move
  # work later only where a later catch is cheap. See
  # engineering/decisions/2026-06-27-integration-nightly-split.md.
  # DEPENDS ON `changes` ONLY — deliberately NOT on `unit`. It used to wait for the
  # unit tier, which bought a fail-fast economy (don't spend 8 render-minutes when a
  # unit test is already red) and cost ~2m00 of CRITICAL PATH on every green run —
  # measured, and the single largest serial gap in the pipeline
  # (engineering/decisions/2026-08-18-inspection-oracle-catalog.md §3, lever B).
  # Green runs vastly outnumber red ones, the two tiers catch different things, and a
  # runner-minute is cheaper than a person waiting. The saved minutes on a red run are
  # the price; the aggregate `ci` gate below still requires BOTH, so nothing merges on
  # a red unit tier.
  integration:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    name: integration (node 22)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Cache Puppeteer browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install poppler-utils (pdfinfo) + color emoji font
        # fonts-noto-color-emoji: guarantees raw unicode emoji render in COLOR
        # in the headless-Chromium PDF renders (the owned paths emit emoji as
        # plain text, not twemoji <img>). The webfont @import in lattice.css is
        # a portable bonus, but Chromium honors an installed emoji font far more
        # reliably than an @font-face one. See engineering/gotchas.md.
        run: sudo apt-get update && sudo apt-get install -y poppler-utils fonts-noto-color-emoji
      - run: npm ci
      # dist/ and the docs-site bundles are BUILT, not committed (.gitignore), so a
      # checkout does not have them and everything below that loads the engine
      # needs them on disk. ~16s, no browser.
      #
      # It must come AFTER the freshness gate in the `lint` job and nowhere before
      # one: building first makes every generated file on disk fresh, so a
      # `--check` after it passes vacuously and stops being a gate at all.
      - name: Build the generated bundles
        run: npm run build
      - name: Integration tests (PR slice)
        run: npm run test:integration:pr
      - name: Upload Marp renders on failure
        # The marp-kit render gate exists because every defect it guards was
        # VISIBLE ON THE FIRST PAGE OF A PDF. A red run that leaves nothing to look
        # at throws that away — so its renders go to .scratch/marp-render/ (a stable
        # path, gitignored) and ride out as an artifact when the job fails.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: marp-renders
          path: .scratch/marp-render/
          if-no-files-found: ignore
          retention-days: 7

  # ── (Engine visual parity REMOVED — marp retired, P4 Step 3) ────────────────
  # The `engine-parity` job pixel-diffed every gallery slide through the owned
  # lattice-engine AND marp, with marp as the external oracle. That gate's job
  # was to catch engine↔marp drift DURING the migration; with marp retired the
  # owned engine is canonical, so "diverges from marp" is no longer meaningful.
  # Visual correctness is now the per-component SEMANTIC-INVARIANT suite (runs in
  # the `integration` job above, marp-free). See
  # engineering/decisions/2026-06-12-p4-regression-gate-retire-marp.md §0.

  # ── (Visual regression gate REMOVED — pivoted to component invariants) ──────
  # P4 originally wired `npm run regress` (fresh render == committed golden) in as
  # the CI visual gate. That pixel gate is RETIRED: across GitHub's heterogeneous
  # runners Skia's CPU-dispatched rasterization isn't bit-identical, so it flaked
  # ~0.4–2% on a *different* gallery each run — and post-marp a self-golden pixel
  # gate detects *change*, not *correctness*. It stays out of PR CI for both of
  # those reasons — but "LOCAL spot-check only", which this said until 2026-08-24,
  # was the whole defect behind #1730: the only tool that can see a stale golden ran
  # on no cadence, so nothing ever ran it. It now runs NIGHTLY and REPORT-ONLY in
  # `integration-nightly.yml`, where a cross-runner flake costs a line in a rolling
  # tracking issue instead of a red PR — which is also how the flake rate finally
  # gets MEASURED rather than assumed. The CI visual-correctness gate is still the
  # per-component SEMANTIC-INVARIANT suite (render via lib/engine → assert
  # computed-style / structure; deterministic + machine-independent). `golden-diff`
  # below stays — it diffs two committed PDFs on one runner, so it isn't flaky. See
  # engineering/decisions/2026-06-12-p4-regression-gate-retire-marp.md §0.

  # ── Golden before/after — post the intended visual change on the PR ────────
  # Informational, NON-gating (the integration tier's semantic-invariant suite is
  # the visual-correctness blocker). Diffs
  # THIS PR's committed goldens against the base branch, rasterizes only the slides
  # that VISUALLY changed (pixel-diff filters out PDF byte-churn from a rebuild),
  # and posts/updates a sticky PR comment ("N slides changed in {galleries}") with
  # the before │ after │ overlay montages embedded INLINE. Inline images need a
  # URL GitHub will serve, so the PNGs are hosted on the orphan `ci-drift-images`
  # branch (a pure image store, never merged) and the comment links raw URLs; the
  # full set also uploads as the `golden-diff-changes` artifact. No rendering → no
  # Chromium; just poppler + ImageMagick over the committed PDFs. See
  # tools/golden-diff.mjs.
  golden-diff:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push before/after PNGs to the orphan ci-drift-images branch
      pull-requests: write
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          # Base-branch history is needed to diff goldens, but their BYTES are not:
          # `git diff --name-only <base>` reads blob OIDs out of trees, and only the
          # handful of goldens that actually moved are ever materialized (`git show
          # <base>:<path>`). A full-blob clone of a repo that is 67% committed PDFs
          # therefore downloaded ~150 MB of history to look at a few files — measured
          # at 1m23 of checkout for a job whose own work took 1s
          # (engineering/decisions/2026-08-18-inspection-oracle-catalog.md §3, lever C).
          # `filter: blob:none` keeps every commit and tree and fetches a blob only when
          # something asks for it, which is exactly this job's access pattern.
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install poppler-utils + ImageMagick
        run: sudo apt-get update && sudo apt-get install -y poppler-utils imagemagick
      - name: Allow ImageMagick PDF coder (for the montage PDF)
        run: sudo sed -i 's/rights="none" pattern="PDF"/rights="read|write" pattern="PDF"/' /etc/ImageMagick-6/policy.xml || true
      - run: npm ci
      # dist/ and the docs-site bundles are BUILT, not committed (.gitignore), so a
      # checkout does not have them and everything below that loads the engine
      # needs them on disk. ~16s, no browser.
      #
      # It must come AFTER the freshness gate in the `lint` job and nowhere before
      # one: building first makes every generated file on disk fresh, so a
      # `--check` after it passes vacuously and stops being a gate at all.
      - name: Build the generated bundles
        run: npm run build
      - name: Compute golden before/after
        run: node tools/golden-diff.mjs --base ${{ github.event.pull_request.base.sha }}
      - name: Upload montage artifact
        uses: actions/upload-artifact@v4
        with:
          name: golden-diff-changes
          path: .scratch/golden-diff/changes.pdf
          if-no-files-found: ignore
      - name: Publish before/after PNGs to the image branch
        id: publish
        continue-on-error: true # non-gating: a push race must not red-X the job — the comment then falls back to table + artifact
        # Inline images in a PR comment must come from a URL GitHub will serve, so
        # the bot hosts them on the orphan `ci-drift-images` branch (a pure image
        # store, never merged) and the comment embeds raw.githubusercontent.com
        # URLs. Same-repo PRs only — a fork PR's GITHUB_TOKEN is read-only and
        # can't push; those fall back to the table + downloadable artifact.
        if: >-
          github.event.pull_request.head.repo.full_name == github.repository &&
          hashFiles('.scratch/golden-diff/montages/*.png') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          BRANCH=ci-drift-images
          DEST="pr-${PR}/${SHA}"
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          work="$(mktemp -d)"
          if git clone --quiet --depth 1 --branch "$BRANCH" --single-branch "$REMOTE" "$work" 2>/dev/null; then
            cd "$work"
          else
            cd "$work"; git init -q; git remote add origin "$REMOTE"; git checkout -q --orphan "$BRANCH"
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf "pr-${PR}" # keep only this PR's latest commit → bound branch growth
          mkdir -p "$DEST"
          cp "$GITHUB_WORKSPACE"/.scratch/golden-diff/montages/*.png "$DEST"/
          git add -A
          git commit -q -m "ci(golden-diff): #${PR} @ ${SHA:0:7} before/after montages" \
            || echo "no image delta (tree already matches branch tip)"
          # Same-branch races across concurrent PRs touch different pr-*/ subtrees,
          # so a rejected push just needs a merge of the other PR's commit + retry.
          # `published` is set ONLY after the push actually lands — so the comment
          # never embeds a raw URL that 404s (it falls back to table + artifact).
          for i in 1 2 3; do
            if git push -q origin "$BRANCH"; then
              echo "published=true" >> "$GITHUB_OUTPUT"
              echo "pushed $DEST ($(ls "$DEST" | wc -l) imgs)"
              exit 0
            fi
            git fetch -q origin "$BRANCH" && git merge -q --no-edit --allow-unrelated-histories origin/"$BRANCH" || true
            sleep $((i * 2))
          done
          echo "push failed after retries — comment falls back to table + artifact"
          exit 1
      - name: Post/update before/after comment
        continue-on-error: true # a read-only token (fork PR) must not fail the run
        uses: actions/github-script@v7
        env:
          PUBLISHED: ${{ steps.publish.outputs.published }}
        with:
          script: |
            const fs = require('fs');
            const dir = '.scratch/golden-diff';
            const report = JSON.parse(fs.readFileSync(`${dir}/report.json`, 'utf8'));
            const marker = '<!-- golden-diff -->';
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number, per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (!report.changed && !existing) return; // nothing to say, no prior comment

            let body = fs.readFileSync(`${dir}/summary.md`, 'utf8');

            // Embed the montages inline — only when the publish step actually pushed
            // them (same-repo PR); otherwise the table + artifact stand alone.
            const imgs = report.inlineMontages || [];
            if (process.env.PUBLISHED === 'true' && imgs.length) {
              const sha = context.payload.pull_request.head.sha;
              const baseUrl = `https://raw.githubusercontent.com/${context.payload.repository.full_name}/ci-drift-images/pr-${context.issue.number}/${sha}`;
              const blocks = imgs.map((m) =>
                `**\`${m.name}\` · ${m.mood} · slide ${m.page}** — before │ after │ overlay\n\n` +
                `![${m.name} ${m.mood} slide ${m.page}](${baseUrl}/${m.file})`
              ).join('\n\n');
              const more = report.inlineCapped
                ? `\n\n_…and ${report.montages.length - imgs.length} more changed slide(s) — see the **\`golden-diff-changes\`** artifact for the full set._`
                : '';
              const n = imgs.length, of = report.inlineCapped ? ` (of ${report.montages.length})` : '';
              body += `\n<details><summary>🖼️ before │ after │ overlay — ${n} slide${n === 1 ? '' : 's'}${of}</summary>\n\n${blocks}${more}\n\n</details>\n`;
            }

            body += '\n' + marker;
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }

  # ── Docs site build (+ overflow guard) — docs (or engine) changes only ──
  # The deploy workflow (docs.yml) only builds on push to main, so PRs got no
  # docs-build validation. This builds the Astro site (same `npm run build` the
  # deploy uses) so a docs/engine change that breaks the site fails the PR.
  #
  # The horizontal-overflow guard runs HERE, reusing this one build, instead of
  # in a separate workflow that rebuilt the whole Astro site a second time (the
  # old docs-overflow.yml). check-overflow.mjs serves the prebuilt docs/dist —
  # it doesn't rebuild — so it just needs a Chrome. It stays ADVISORY via
  # continue-on-error (not a merge blocker until promoted); a real overflow
  # still surfaces as a failed (red ✗) step in the job's log. See
  # engineering/decisions/2026-06-17-workflow-efficiency-review.md §D and
  # engineering/decisions/2026-06-15-docs-perf-gating-policy.md.
  docs-build:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1' # the build is render-free; overflow uses a system Chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            docs/package-lock.json
      # setup-chrome has no built-in cache and pulls a full Chrome each run; its
      # Linux install dir is ~/.cache/setup-chrome, so cache that — a hit lets
      # the action reuse the binary instead of downloading. Keyed loosely (the
      # overflow check just needs *a* Chrome to measure layout widths, not a
      # pinned version); bump the suffix to force a refresh.
      - name: Cache setup-chrome download
        uses: actions/cache@v4
        with:
          path: ~/.cache/setup-chrome
          key: setup-chrome-${{ runner.os }}-stable-v1
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      # The docs Vitest suite exercises root CJS (lib/core/read-along-vtt.js) that
      # `require('@workwel/cadenza')` — the npm-workspace package whose symlink
      # lives in ROOT node_modules. Install root deps so npm creates that link; the
      # docs `npm ci` below only populates docs/node_modules, which isn't on the
      # resolution path of a require() from lib/core.
      - name: Install root deps (for the @workwel/cadenza workspace link)
        run: npm ci
      # dist/ and the docs bundles are BUILT, not committed (.gitignore). The docs
      # site imports dist/docs/*.json and loads the playground bundles, and the
      # workspace libs' dist/ is what `tsc` typechecks against, so build before
      # either. ~16s, no browser.
      - name: Build the generated bundles
        run: npm run build
      - name: Install docs deps
        run: npm ci
        working-directory: docs
      - name: Typecheck docs (astro sync + tsc --noEmit)
        run: npm run typecheck
        working-directory: docs
      - name: Test docs React islands (Vitest + RTL)
        run: npm test
        working-directory: docs
      - name: Build docs site
        run: npm run build
        working-directory: docs
      # Responsive guard (advisory): no page may exceed its viewport width at
      # 390/700/820/1440 — a pannable page breaks on touch — and no row named in a
      # case's `noSelfOverflow` may exceed ITSELF, which is how a toolbar loses the
      # controls at its end without the page ever growing. Reuses the build above.
      - name: Horizontal-overflow guard (mobile/tablet/desktop)
        continue-on-error: true
        run: npm run check:overflow
        working-directory: docs
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}

  # ── Studio E2E smoke (ADVISORY) — fast selector-drift signal on the PR ──
  # The full Studio Playwright suite is nightly, OFF the PR gate — which is why a
  # shared-chrome change (accessible-name rename, a retired control) can pass every
  # gating tier and only break specs overnight (#780). This runs just the tiny
  # `@smoke` subset (shell paints · Inspector opens + writes front-matter · both
  # panels no-overflow) on the PR path, so that class of drift fails FAST instead
  # of next-morning-on-main.
  #
  # ADVISORY, deliberately: this job is ABSENT from the required `ci` gate's `needs`
  # (like `golden-diff`), so a red here reports but does NOT block merge or jam the
  # queue. Per the experience-gating framework
  # (engineering/decisions/2026-06-28-experience-gating-playwright.md §3) a browser
  # check becomes PR-BLOCKING only after an observed nightly green streak proves it
  # doesn't flap — never on hope. The `@smoke` specs are green in the nightly + local
  # runs, but promote to blocking (move this into `ci`'s `needs`) only once the streak
  # is on record. Tracked in #800;
  # engineering/decisions/2026-07-06-e2e-chrome-selector-contract.md § Decision (4).
  # `--retries=0` overrides the config's CI retry so a flake shows here, not hidden.
  studio-smoke:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            docs/package-lock.json
      # The Studio imports the boundary kernel from ROOT `lib/core/*.mjs`, which
      # imports `markdown-it` by bare specifier (#1271). Node resolves that upward
      # from lib/core, so it needs ROOT node_modules — the docs `npm ci` below only
      # populates docs/node_modules. Without this the preview server dies at startup
      # with ERR_MODULE_NOT_FOUND and every test fails on "webServer was not able to
      # start". Same reason `docs-build` installs root deps; see its note.
      - name: Install root deps (for lib/core's markdown-it import)
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1' # this job never renders; skip the ~150MB Chrome
      # dist/ and the docs bundles are BUILT, not committed (.gitignore); the Studio
      # loads them, so build before the preview server starts. ~16s, no browser.
      - name: Build the generated bundles
        run: npm run build
      - name: Install docs deps
        run: npm ci
        working-directory: docs
      - name: Install Playwright browser (pinned to @playwright/test)
        run: npx playwright install --with-deps chromium
        working-directory: docs
      # playwright.config.ts's webServer builds (without the slow showcase:check)
      # then previews the production site; test:e2e:smoke runs the desktop @smoke
      # subset against it.
      - name: Run Studio E2E @smoke subset
        run: npm run test:e2e:smoke -- --retries=0
        working-directory: docs
        env:
          CI: 'true'
      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: studio-smoke-${{ github.run_id }}
          path: |
            docs/playwright-report/**
            docs/test-results/**
          if-no-files-found: warn
          retention-days: 7

  # ── Single required check ──────────────────────────────────────────────
  # Set THIS as the only required status check in branch protection. It
  # passes when lint succeeds and the test tiers either passed or were
  # skipped (docs-only) — so conditional jobs never leave a PR stuck on a
  # "pending" required check.
  # NOTE: `golden-diff` and `studio-smoke` are intentionally ABSENT from needs/the
  # failure loop — both are advisory (see their job comments). They still run and
  # report; they just don't gate. Visual correctness gates via the semantic-invariant
  # suite in `integration`; `studio-smoke` promotes into `needs` only after a nightly
  # green streak (#800). Adding a job here makes it merge-BLOCKING — do it deliberately.
  ci:
    if: always()
    needs: [lint, unit, integration, docs-build]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # post the CI-green beacon comment that wakes a subscribed session
    steps:
      - name: Verify gate
        run: |
          echo "lint=${{ needs.lint.result }} unit=${{ needs.unit.result }} integration=${{ needs.integration.result }} docs-build=${{ needs.docs-build.result }}"
          # A tier result is acceptable when it's: success; skipped (a conditional
          # tier that didn't apply — e.g. docs-only skips unit/integration); or
          # cancelled. NOTE THE SPELLING: 'cancelled' is GitHub's own enum value
          # (check-run conclusion / needs.<job>.result), not house prose, so HARD
          # RULE #21 does not reach it — a US-English sweep here makes both
          # allowlists below dead and inverts their branches. 'cancelled' here is
          # a SUPERSEDED run — a force-push tripped
          # `concurrency: cancel-in-progress`, so a newer run on the new head SHA
          # carries the authoritative verdict. Painting the orphaned SHA red on a
          # supersession-cancel manufactured false-alarm webhooks during a merge
          # train (see engineering/decisions/2026-06-14-drift-watch-rebase-thrash.md).
          # Only a real failure/timeout stops the gate.
          for tier in "lint=${{ needs.lint.result }}" "unit=${{ needs.unit.result }}" \
                      "integration=${{ needs.integration.result }}" "docs-build=${{ needs.docs-build.result }}"; do
            case "${tier#*=}" in
              success|skipped|cancelled) ;;
              *) echo "::error::tier ${tier%%=*} did not pass (${tier#*=})"; exit 1 ;;
            esac
          done
          echo "CI gate passed."
      - name: CI-green beacon
        # Wake a subscribed Claude session the instant CI passes, so it reacts in
        # seconds instead of polling get_check_runs or waiting on the hourly check-in.
        # SUCCESS-ONLY by design: CI *failures* already arrive as webhook events, so
        # the beacon fills the one gap the integration doesn't forward — the green
        # transition. Runs only when the Verify gate above succeeded (`if: success()`)
        # and only on a real PR (merge_group has no PR to comment on).
        #
        # WHAT IT IS A CLAIM ABOUT, and why that is spelled out in the comment body
        # rather than left to the reader. It used to post "✅ **CI green**", which
        # reads as "everything on this PR is green" — and it is not. The Verify gate
        # above covers exactly four tiers of THIS workflow. It knows nothing about
        # CodeQL, which runs from GitHub's default code-scanning setup in a separate
        # workflow this one has no `needs` edge to. Observed twice on #1689: this
        # step posted "CI green" for c7f4a51 while CodeQL had FAILED with 4
        # high-severity alerts, and again for ef0248f with 2 still open. Both were
        # real (polynomial-regex findings in new test helpers) and were caught only
        # because a human was watching the individual check runs instead of the
        # beacon. A beacon that overstates its scope is a gate that manufactures
        # confidence — the same defect class as a check that cannot fail.
        #
        # So the beacon now (a) names the four tiers it actually covers, (b) says in
        # the body that it is not a merge signal, and (c) carries a SNAPSHOT of every
        # OTHER check run on the head SHA, leading with ⚠️ instead of ✅ when one of
        # them has failed. The snapshot is explicitly a reading taken at beacon time,
        # not a gate: CodeQL is a different workflow and may still be running, and
        # blocking on it would either race or need the polling this repo refuses
        # (HARD RULE #16). Reporting what was observed, and saying when it is
        # incomplete, is the honest version of that.
        #
        # CREATE-not-update (delete the prior beacon, then post a fresh one) — unlike
        # the golden-diff sticky which updateComment()s in place. Only a newly CREATED
        # issue_comment is forwarded as a wake event; an in-place edit is not, so an
        # update would leave the session asleep. The delete keeps the thread to one
        # beacon. continue-on-error so a fork PR's read-only token can never red the gate.
        if: success() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- ci-green-beacon -->';
            const headSha = context.payload.pull_request.head.sha;
            const sha = headSha.slice(0, 7);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // The tiers the Verify gate above actually decided. Everything else on
            // this SHA — CodeQL, the advisory jobs, other workflows — is OUTSIDE the
            // claim, which is the whole point of the snapshot below.
            const COVERED = new Set(['changes', 'ci', 'lint', 'unit', 'integration', 'docs-build']);
            const isCovered = (n) => COVERED.has(n) || /^(unit|integration) \(node \d+\)$/.test(n);

            let failed = [];
            let pending = [];
            let snapshotOk = true;
            try {
              const runs = await github.paginate(github.rest.checks.listForRef, {
                ...context.repo, ref: headSha, per_page: 100,
              });
              for (const r of runs) {
                if (isCovered(r.name)) continue;
                if (r.status !== 'completed') { pending.push(r.name); continue; }
                // A superseded-run conclusion counts as passing here for the same
                // reason the Verify gate above accepts it: a newer run on a newer
                // SHA carries the authority. This is a PASS allowlist rather than a
                // failure one on purpose — a conclusion GitHub adds later should
                // read as "worth naming", not as silently fine.
                if (!['success', 'skipped', 'neutral', 'cancelled'].includes(r.conclusion)) {
                  failed.push(`${r.name} (${r.conclusion})`);
                }
              }
            } catch (e) {
              // A read failure must not silently downgrade to "nothing else is wrong".
              snapshotOk = false;
              core.warning(`could not read other check runs for ${sha}: ${e.message}`);
            }

            const lead = failed.length ? '⚠️' : '✅';
            const uniq = (a) => [...new Set(a)].sort();
            const lines = [
              `${lead} **\`ci\` workflow green** for \`${sha}\` — lint · unit · integration · docs-build — [run](${runUrl})`,
              '',
            ];
            if (!snapshotOk) {
              lines.push('_Other checks on this commit could not be read — treat their state as UNKNOWN._');
            } else if (failed.length) {
              lines.push(`**Other checks on this commit are NOT green: ${uniq(failed).join(', ')}.**`);
            } else if (pending.length) {
              lines.push(`Other checks still running at this reading: ${uniq(pending).join(', ')}.`);
            } else {
              lines.push('Every other check on this commit had also concluded successfully at this reading.');
            }
            lines.push(
              '',
              '_This beacon reports the `ci` workflow plus a snapshot of other checks taken when it '
              + 'finished. It is **not** a merge signal, and it does not gate on CodeQL — code scanning '
              + 'runs in a separate workflow and can conclude after this. Check the PR\'s own check list '
              + 'before merging._',
              marker,
            );
            const body = lines.join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number, per_page: 100,
            });
            for (const c of comments) {
              if (c.body && c.body.includes(marker)) {
                await github.rest.issues.deleteComment({ ...context.repo, comment_id: c.id });
              }
            }
            await github.rest.issues.createComment({
              ...context.repo, issue_number: context.issue.number, body,
            });
