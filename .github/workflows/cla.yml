name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

# Least privilege for a third-party action holding a pull_request_target
# token: contents (commit signatures to the cla-signatures branch),
# pull-requests (the prompt/ack comment), statuses (the CLA check). No
# actions: write — the action doesn't need it, and this is the only
# third-party action in the repo with write perms.
permissions:
  contents: write
  pull-requests: write
  statuses: write

# One run per PR/issue at a time — the comment trigger is phrase-matched, so
# a comment burst must queue rather than race commits onto cla-signatures.
concurrency:
  group: cla-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA assistant
        # contains() (not ==) so a signer's stray punctuation still triggers a
        # run; the action itself does the tolerant signature matching.
        if: (github.event.comment.body == 'recheck' || contains(github.event.comment.body, 'I have read the CLA Document')) || github.event_name == 'pull_request_target'
        # SHA-pinned (= tag v2.6.1): the one write-capable third-party action
        # here must not be reachable through a mutable tag.
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/cla.json'
          path-to-document: 'https://github.com/slidewright/lattice/blob/main/CLA.md'
          branch: 'cla-signatures'
          # Enumerate exact bot logins — a bare '*[bot]' would exempt every
          # GitHub App anyone cares to register, an open CLA bypass.
          allowlist: 'saden1,dependabot[bot],github-actions[bot]'
          custom-notsigned-prcomment: >
            Thank you for your contribution! Before we can merge, we need you
            to sign the [SlideWright Contributor License Agreement](https://github.com/slidewright/lattice/blob/main/CLA.md).
            Please read it, then post the comment below on this pull request.
