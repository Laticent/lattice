name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/cla.json'
          path-to-document: 'https://github.com/SlideWright/lattice/blob/main/CLA.md'
          branch: 'cla-signatures'
          allowlist: 'saden1,*[bot]'
          custom-notsigned-prcomment: >
            Thank you for your contribution! Before we can merge, we need you
            to sign the [SlideWright Contributor License Agreement](https://github.com/SlideWright/lattice/blob/main/CLA.md).
            Please read it, then post the comment below on this pull request.
