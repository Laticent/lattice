name: Golden bless (nightly)

# The ONE writer of committed golden PDFs (engineering/decisions/2026-10-06-goldens-bot-blessed.md).
# Each night it checks every golden on `main` against a fresh render, re-blesses only the ones
# that drifted, and opens (or updates) one PR with them. CI's golden-diff job posts each
# changed golden's before/after on that PR, which is the regression gate a human can read.
#
# THE PR MERGES ITSELF (engineering/decisions/2026-11-16-blessing-invariants-attribution.md, rollout
# step 1, the owner's decision of 2026-11-16, superseding the 2026-10-07 four-rule hybrid). The bless is
# per golden, never all-or-nothing: a golden whose page was added, removed or resized, or that the check
# cannot vouch for, is HELD (left drifted on `main` and named in the digest); every other drifted golden
# is re-recorded, and the PR turns on auto-merge, so the merge queue lands it once `ci` is green, as
# sync-backlog.yml does. The digest comment shows what moved, worst first. It is read, never answered.
#
# Same shape as sync-backlog.yml, and for the same reasons, which that file explains in
# full: ONE branch force-pushed to `main` + 1 commit, ONE open PR; AUTOMATION_PAT from the
# `automation` environment (only `main` can read it), because a PR raised by GITHUB_TOKEN
# never gets `ci`; `persist-credentials: false`, or the push silently goes out as the bot.
on:
  schedule:
    - cron: '7 1 * * *' # 01:07 UTC; ~1.5 h of rendering, done before integration-nightly at 03:11
  workflow_dispatch:
    inputs:
      bless_held:
        description: 'Also re-record goldens the bless would hold (a page added, removed or resized that its source does not explain). The dispatch is the owner''s authorization.'
        type: boolean
        default: false

# Read-only for the built-in token: it only reads PRs for the retired rule 4, still scored for the record. Every write (the push,
# the PR, the comment) goes through AUTOMATION_PAT.
permissions:
  contents: read
  pull-requests: read

# Never cancel: a run killed between the push and the comment leaves a PR with no verdict.
concurrency:
  group: golden-bless
  cancel-in-progress: false

env:
  BLESS_BRANCH: chore/golden-bless

jobs:
  bless:
    # Pinned, not ubuntu-latest, and ci.yml's golden-diff job is pinned to the same image:
    # the bot blesses what PRs render, so a new OS image (its fonts, its poppler) must land
    # as a reviewed PR that moves both, not as one night where every golden drifts. The image
    # still takes GitHub's weekly patch updates within 24.04. integration-nightly.yml's
    # report-only `regress` arm also compares against the goldens and is NOT pinned.
    runs-on: ubuntu-24.04
    # A full check of ~350 goldens measured 78 min in the 4-core sandbox
    # (2026-08-18-inspection-oracle-catalog.md); GitHub's runners are not faster.
    timeout-minutes: 180
    environment: automation
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Full history (rule 4 walks the merges since the last bless) without every old
          # PDF's bytes: blobs arrive on demand, so only HEAD's are fetched.
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cache Puppeteer browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install poppler-utils + ImageMagick + color emoji font
        # The same set as ci.yml's golden-diff job, so the bot blesses what PRs render.
        uses: ./.github/actions/apt-cached
        with:
          packages: poppler-utils imagemagick fonts-noto-color-emoji
      - name: Allow ImageMagick PDF coder (for the drift montages)
        run: sudo sed -i 's/rights="none" pattern="PDF"/rights="read|write" pattern="PDF"/' /etc/ImageMagick-6/policy.xml || true
      - run: npm ci
      # puppeteer's postinstall swallows a failed download and exits 0; this step fails by name instead.
      - uses: ./.github/actions/puppeteer-chrome
        timeout-minutes: 5 # a stalled download fails here, not at the job cap
      # The docs landing page's showcase WebPs are cut from gallery PDFs with `sharp`, a
      # docs dependency, and docs-build fails when they go stale (#2598). ~16 s.
      - name: Install the docs dependencies (for the showcase WebPs)
        run: npm ci --prefix docs
      - name: Build the generated bundles
        run: npm run build

      - name: Check every golden, re-bless what drifted, hold what breaks the invariant
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # read-only: the retired rule 4, still scored, reads merged PRs' golden-diff comments
          GOLDEN_BLESS_HELD: ${{ github.event_name == 'workflow_dispatch' && inputs.bless_held && '1' || '' }}
          GOLDEN_BLESS_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # pipefail: without it the step takes `tee`'s exit code, and a crash goes green.
        run: |
          set -euo pipefail
          node tools/golden-bless.mjs | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the verdict and drift montages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-bless
          path: |
            .scratch/golden-bless/
          if-no-files-found: ignore

      - name: Open (or update) the bless PR, post the digest, and turn on auto-merge
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT }}
          REPO: ${{ github.repository }}
          # No repo hooks while the token is in the environment: `npm ci` installed
          # lefthook, and its hooks would run repo code with GH_TOKEN set (and receive the
          # push URL). The bot's commit holds only PDFs the step above produced and checked.
          LEFTHOOK: '0'
        run: |
          set -euo pipefail
          OPEN="$(gh pr list --head "$BLESS_BRANCH" --state open --json number,createdAt --jq '.[0] // empty')"

          # `git status`, not `git diff`: a golden rendered for the first time (a deck or
          # gallery merged without a PDF, goldens rollout step 3) is an UNTRACKED file, and
          # `git diff` cannot see it.
          if [ -z "$(git status --porcelain --untracked-files=all -- ':(icase)*.pdf')" ]; then
            HELD="$(jq -r '.held | length' .scratch/golden-bless/verdict.json 2>/dev/null || echo 0)"
            if [ "$HELD" -gt 0 ]; then
              echo "Nothing re-recorded: every golden that drifted is held ($HELD). See the digest below."
              cat .scratch/golden-bless/verdict.md
              WHY="tonight every golden that drifted on \`main\` is held (see the run's digest), so this PR's PDFs are out of date."
            else
              echo "No golden drifted or is missing. Nothing to bless."
              WHY="tonight no golden drifted on \`main\`, so this PR's PDFs are out of date."
            fi
            # An open bless PR from an earlier night now holds PDFs that no longer match
            # main. Merging it would bless them back in, so close it.
            if [ -n "$OPEN" ]; then
              gh pr close "$BLESS_BRANCH" --comment "Closed by the Golden bless workflow: $WHY"
            fi
            # A golden that could not be rendered or re-blessed, or a showcase WebP that could not
            # be refreshed (golden-bless.mjs writes failed.txt), turns the night red, after the
            # rest of the bless has landed.
            if [ -s .scratch/golden-bless/failed.txt ]; then
              echo "::error::golden-bless: $(wc -l < .scratch/golden-bless/failed.txt) golden(s) were held or could not be rendered or re-blessed; see the digest."
              cat .scratch/golden-bless/failed.txt
              exit 1
            fi
            exit 0
          fi

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::golden-bless: the AUTOMATION_PAT secret is not set. A PR opened with the built-in GITHUB_TOKEN never starts CI. See engineering/workflow.md § Automation vs. the main ruleset."
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # -A, not -u, for the same reason: new goldens and new showcase WebPs are untracked.
          # .gitignore keeps the gate's .regr-* renders out.
          git add -A -- ':(icase)*.pdf' docs/public/showcase docs/scripts/showcase-sources.json 'examples/*-gallery.md'
          # The title is load-bearing: tools/lib/golden-bless-verdict.mjs finds the last
          # merged bless by it, and starts rule 4's window at the commit it names.
          TITLE="chore(goldens): nightly bless of $(cat .scratch/golden-bless/rendered-from.txt)"
          git commit -q -m "$TITLE"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" \
            "HEAD:refs/heads/${BLESS_BRANCH}"

          # The body is set on BOTH paths: #3248 was opened under the dry run and kept saying "this PR never
          # merges itself" after #3235, because only a new PR got the new text.
          BODY='Generated by the **Golden bless** workflow: the goldens that drifted on `main` overnight, re-rendered, one golden at a time. A golden that added, removed or resized a page its slide count does not explain, or that the check could not vouch for, is held back and named in the digest comment. **This PR merges itself** through the queue once `ci` is green; nothing in it needs an answer. See `engineering/decisions/2026-11-16-blessing-invariants-attribution.md`.'
          if [ -z "$OPEN" ]; then
            gh pr create --base main --head "$BLESS_BRANCH" --title "$TITLE" --body "$BODY"
          else
            gh pr edit "$BLESS_BRANCH" --title "$TITLE" --body "$BODY"
            echo "bless PR already open; the force-push updated it in place."
            # A bless PR that sits for days is how the backlog mirror froze for three
            # weeks while every run looked green. Say so on the run.
            CREATED="$(echo "$OPEN" | jq -r .createdAt)"
            AGE_DAYS=$(( ( $(date +%s) - $(date -d "$CREATED" +%s) ) / 86400 ))
            if [ "$AGE_DAYS" -ge 2 ]; then
              echo "::warning::The golden bless PR has been open for ${AGE_DAYS} days although it merges itself. Its \`ci\` or the merge queue is stuck; look there."
            fi
          fi

          # One verdict comment, updated each night, found by its marker.
          PR_NUM="$(gh pr view "$BLESS_BRANCH" --json number --jq .number)"
          CID="$(gh api "repos/${REPO}/issues/${PR_NUM}/comments" --paginate \
            --jq '.[] | select(.body | contains("<!-- golden-bless-verdict -->")) | .id' | tail -1)"
          if [ -n "$CID" ]; then
            gh api -X PATCH "repos/${REPO}/issues/comments/${CID}" -F body=@.scratch/golden-bless/verdict.md >/dev/null
          else
            gh pr comment "$BLESS_BRANCH" --body-file .scratch/golden-bless/verdict.md
          fi

          # Merge itself (rollout step 1): with a merge queue, --auto queues the PR the moment `ci` is
          # green. Idempotent. Only when the bless re-recorded something and the tree is sound
          # (verdict.json's autoMerge); held goldens are already out of the commit.
          # With a merge queue, gh prints "! The merge strategy for main is set by the merge queue" and exits 0
          # either way, so the step reads the PR back: a bless that should merge itself and is not armed,
          # queued or merged turns the run red instead of sitting open unseen.
          if [ "$(jq -r .autoMerge .scratch/golden-bless/verdict.json)" = "true" ]; then
            gh pr merge "$BLESS_BRANCH" --auto --squash
            # Armed, queued or merged all count. GitHub CLEARS `auto_merge` once it queues the PR (measured on
            # #3259 2026-11-17: in the queue, `auto_merge: null`), so "queued" is read off the timeline: the
            # latest queue event is `added_to_merge_queue`. Only events after tonight's force-push count: a
            # PR queued last night and dropped by the push may not show `removed_from_merge_queue` yet, and
            # gh then skips arming it ("already queued to merge").
            ARMED="$(gh api "repos/${REPO}/pulls/${PR_NUM}" --jq '(.auto_merge != null) or .merged')"
            QUEUE_EVENT="$(gh api "repos/${REPO}/issues/${PR_NUM}/timeline?per_page=100" --paginate --slurp | jq -r '
              add | (map(select(.event == "head_ref_force_pushed") | .created_at) | max // "") as $push
              | map(select((.event == "added_to_merge_queue" or .event == "removed_from_merge_queue") and .created_at > $push) | .event)
              | last // ""')"
            if [ "$ARMED" != "true" ] && [ "$QUEUE_EVENT" != "added_to_merge_queue" ]; then
              echo "::error::golden-bless: auto-merge did not turn on for the bless PR; it will not merge itself."
              exit 1
            fi
          else
            # An earlier night may have armed it; tonight's content must not ride that.
            gh pr merge "$BLESS_BRANCH" --disable-auto || true
          fi

          # A golden that could not be rendered or re-blessed, or a showcase WebP that could not
          # be refreshed (golden-bless.mjs writes failed.txt), turns the night red, after the
          # rest of the bless has landed.
          if [ -s .scratch/golden-bless/failed.txt ]; then
            echo "::error::golden-bless: $(wc -l < .scratch/golden-bless/failed.txt) golden(s) were held or could not be rendered or re-blessed; see the digest."
            cat .scratch/golden-bless/failed.txt
            exit 1
          fi
