name: Integration nightly (render-regression tier)

# NIGHTLY render-regression tier on `main`. The PR `integration` job (ci.yml)
# keeps only the cross-path WIRING contracts (parity/), the export pipeline
# (export/), and the per-component computed-style correctness gate (invariants/).
# The heavier FRESH-RENDER suites live here:
#   - galleries/   gallery.md page count
#   - components/  per-component + per-bucket gallery page counts
#   - exemplars/   45 worked decks render + committed-PDF freshness
#   - mermaid/     mermaid-smoke render
#   - screenshot/  screenshot + svg-scaling
# Their only catch is "a render drifted / a committed artifact went stale", and
# the stale-artifact half is already backstopped at pre-commit
# (tools/build-staged-pdfs.js + the freshness gates), so a next-morning catch on
# `main` is cheap to revert. Per the repo gate strategy a slow render-regression
# watch belongs OFF the PR critical path — same as perf-nightly / preview-e2e-
# nightly. See engineering/decisions/2026-06-27-integration-nightly-split.md.
#
# On failure it opens / appends a single rolling tracking issue (found by a title
# marker, so it never spams), self-labeled at creation (a GITHUB_TOKEN-opened
# issue can't trip the triage gate — GitHub's workflow-recursion guard).

on:
  schedule:
    - cron: '11 3 * * *' # daily 03:11 UTC (before preview-e2e 04:23 + perf 05:37 + backlog 06:17)
  workflow_dispatch:

permissions:
  contents: read
  issues: write # open / append the rolling tracking issue

concurrency:
  group: integration-nightly
  cancel-in-progress: false

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cache Puppeteer browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install poppler-utils (pdfinfo) + ImageMagick + color emoji font
        # Mirror the PR integration job: pdfinfo for page counts, and an installed
        # color emoji font so headless-Chromium PDF renders emit emoji in color.
        # ImageMagick (`identify` / `compare` / `convert`) is what tools/pixel-check.js
        # shells out to, so the `regress` step below dies on its first page comparison
        # without it — same install ci.yml's golden-diff job does.
        run: sudo apt-get update && sudo apt-get install -y poppler-utils imagemagick fonts-noto-color-emoji
      - run: npm ci

      # The suite exits non-zero on a render regression. Capture the verdict into
      # an output and keep the job green so the report + issue steps always run and
      # the issue step keys off `failed` (not the step's own exit). Tee the TAP
      # output to a report file for the issue body.
      - name: Integration tests (nightly slice)
        id: run
        run: |
          set -uo pipefail
          REPORT="$GITHUB_WORKSPACE/integration-nightly-report.txt"
          if npm run --silent test:integration:nightly 2>&1 | tee "$REPORT"; then
            echo "failed=false" >> "$GITHUB_OUTPUT"
          else
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi

      # The adaptive-family checks, both of which need the Chromium this job already
      # has and are too slow for per-PR CI (five full emulator sweeps each):
      #
      #   check:family-tiers       does a reflow rule now CLIP? Renders one gallery
      #                            slide per family-reflowing component at every
      #                            @size against test/oracle/family-overflow.json.
      #   check:family-conformance does each rule DO anything? Renders every gallery
      #                            slide, reads the DOM with the family stamp on vs
      #                            off, against test/oracle/family-conformance.json.
      #
      # Two questions about the same reflow, and #1218 is why both are gates: it
      # shipped a square tier that was inert for its entire life with every other
      # check green, plus three rules that silently started clipping. A blessed
      # record that no scheduled job ever evaluates is an assertion that rots.
      - name: Adaptive family tiers + overflow oracle
        id: families
        run: |
          set -uo pipefail
          REPORT="$GITHUB_WORKSPACE/integration-nightly-report.txt"
          FAILED=false
          for GATE in check:family-tiers check:family-conformance; do
            {
              echo ''
              echo "--- $GATE ---"
            } >> "$REPORT"
            if ! npm run --silent "$GATE" 2>&1 | tee -a "$REPORT"; then
              FAILED=true
            fi
          done
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"

      # CONTRAST OF THE REAL EXPORTED PLAYER, in both scheme states, with every backdrop
      # sampled from rendered pixels rather than modeled from the ancestor chain. The two
      # cheaper contrast gates cannot answer this question:
      #   contrast-audit   scores a palette's own token matrix — 0.3s, no browser
      #   composed-contrast models the surfaces a component composes — 0.3s, no browser
      # Both read the SOURCE. Their blind spot is anything the export PIPELINE does to it:
      # a `light-dark()` pair collapsed to one arm, a selector re-meant by the minifier and
      # then deleted by the prune (#1645/#1642 — the CSS was correct in both cases and the
      # shipped artifact was not). That half is gated per-PR by the real-surface test in
      # test/integration/export/html-player.test.js, which is fast because it drives ONE
      # deck. This step is the CORPUS half: ~24s per deck (16s export, 8s audit) across
      # examples/, so it belongs here and nowhere faster.
      #
      # It compares against a BLESSED baseline and fails only on a finding that is NEW or
      # has got WORSE. The corpus's 283 known sub-AA runs are tracked in #1745, not
      # re-listed nightly — a report that repeats what is already filed is a report people
      # learn to skim.
      - name: Player contrast sweep (real export, both schemes, vs baseline)
        id: contrast
        run: |
          set -uo pipefail
          REPORT="$GITHUB_WORKSPACE/integration-nightly-report.txt"
          {
            echo ''
            echo '--- player contrast (vs test/oracle/player-contrast.json) ---'
          } >> "$REPORT"
          if npm run --silent contrast:player 2>&1 | tee -a "$REPORT"; then
            echo "failed=false" >> "$GITHUB_OUTPUT"
          else
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi

      # THE PALETTE MATRIX, RENDERED FOR REAL — the referee for the per-PR sweep.
      #
      # `test/integration/invariants/palette-sweep.test.js` gates all 32 palettes on every
      # PR by rendering the gallery ONCE and re-theming it in place. That is ~70x cheaper
      # than re-rendering the matrix and it is what makes the palette axis affordable at
      # all — but it buys the speed with an assumption: that overwriting the palette region
      # of the export shell's stylesheet paints what a real render would paint.
      #
      # That assumption has already been wrong once, silently. The sweep's first version
      # APPENDED its stylesheet instead of replacing in place, inverting the cascade for 30
      # of 126 tokens, and reported confident per-palette numbers that were wrong in both
      # directions — `onyx` 3 where the truth is 5 (two real `redline` runs MISSED),
      # `atelier` 19 where the truth is 16 (three invented). Nothing in CI could tell. It
      # was caught by a human reading the diff, and a human reading a diff is not a gate.
      #
      # So this step re-renders every palette natively and reconciles. It is the only thing
      # that can catch the fast path drifting back into measuring fiction, and it is also
      # where the runs the sweep DROPS get scored: Mermaid bakes its own stylesheet into the
      # SVG at render time, so no swap can move it, and those runs are only measurable here.
      # ~11-13s per palette warm, so ~6-7 minutes — off the PR critical path by design, same
      # as every other render-regression watch in this file.
      - name: Palette matrix referee (32 native renders vs the per-PR sweep)
        id: palette
        run: |
          set -uo pipefail
          REPORT="$GITHUB_WORKSPACE/integration-nightly-report.txt"
          {
            echo ''
            echo '--- palette matrix (native renders, all 32 palettes) ---'
          } >> "$REPORT"
          if npm run --silent contrast:palette-native 2>&1 | tee -a "$REPORT"; then
            echo "failed=false" >> "$GITHUB_OUTPUT"
          else
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi

      # The `code-line-clipped` budgets are five numbers MEASURED in a browser
      # (lib/authoring/lint-core.js CODE_LINE_BUDGET). Their guard re-measures
      # them against a real render — but it skips with no Chromium, and the PR
      # unit job is contractually render-free (PUPPETEER_SKIP_DOWNLOAD), so on
      # every PR the guard is inert while the rule it calibrates runs on all 255
      # decks. Here is where it actually executes. Without this step the table
      # rots the first time anyone retunes --sp-md or the type scale, and the
      # only signal is an authoring advisory quietly citing the wrong number.
      - name: Code-line width budgets (re-measure CODE_LINE_BUDGET)
        id: codewidth
        run: |
          set -uo pipefail
          REPORT="$GITHUB_WORKSPACE/integration-nightly-report.txt"
          {
            echo ''
            echo '--- code-line width budgets ---'
          } >> "$REPORT"
          if node --test test/unit/components/code-line-width.test.js 2>&1 | tee -a "$REPORT"; then
            echo "failed=false" >> "$GITHUB_OUTPUT"
          else
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi

      # COMMITTED-GOLDEN FRESHNESS — the cadence `2026-08-04-committed-pdf-freshness.md`
      # prescribed and nobody wired. `tools/regression-gate.mjs` renders every committed
      # deck fresh through the emulator and pixel-diffs it against its golden PDF, which
      # is the only thing in the repo that can see a stale golden.
      #
      # WHY IT IS NOT ALREADY COVERED. `build:galleries:check` is a pre-commit input-hash
      # guard that compares against HEAD and documents its own blind spot
      # (tools/lib/render-inputs.js:40): once both sides are at HEAD the pairing looks
      # sound whether or not anyone re-rendered. `golden-diff` only reads the goldens a PR
      # actually TOUCHES, so a golden nobody edits is watched by nothing at all. Between
      # them there is no watcher for "a shared change moved a deck nobody is editing" —
      # which is every palette, token and engine change in the repo. This step is it.
      #
      # BOTH SCOPES, and the measurement is the reason. `--scope decks` is what
      # `2026-08-04-committed-pdf-freshness.md:153` recommended; `2026-08-18-golden-corpus-
      # purpose-and-medium.md` §2.3 then documented the drift in GALLERIES instead, which
      # argued for the other one. A full run on `main` at 5ce794d settles it in a third
      # direction: **75/75 galleries green, 184 of 199 deck goldens drifted**, worst page
      # 64%. The gallery half is clean only because #1777 re-blessed it three days earlier
      # (closing #1730) — i.e. whichever scope you pick, you are betting on which half went
      # stale most recently, and that bet has now been wrong twice. Run both.
      #
      # RUNTIME, measured rather than estimated: **78 minutes** for both scopes on 4 cores,
      # against the gate header's ~45 min guess — and that run was 184-red, so it paid for
      # 184 before/after/overlay montages (225 MB into .scratch/) that a green run does not.
      # The job runs ~45-55 min today, so budget ~2h15m worst case. Well inside the 6h
      # per-job ceiling, and it is why this belongs nightly and could never go on a PR.
      #
      # TOLERANCE IS UNCHANGED — no `FAIL_FRACTION` was touched for this, and the 2026-08-04
      # note's "~3%" was NOT applied. That figure came from four `--scope decks` drifts of
      # 3.7-8.9%, and raising the floor to it would admit a great deal that is plainly
      # visible: §2.3's 17,044-pixel `quote` drift, across 7 of 9 slides, scored `worst
      # 0.26%`. A gate that cannot see that is not worth 78 minutes. If cross-runner noise
      # ever proves to need headroom, the shape is a measured per-scope constant like
      # `FAIL_FRACTION_MERMAID = 0.01`, justified by a runner-vs-runner comparison — not one
      # global loosening, and not a number carried over from a differently-scoped note.
      #
      # REPORT-ONLY — and the reason it was removed from CI (`ci.yml:278`), cross-runner
      # rasterization flakiness, HAS NOW BEEN MEASURED AND DID NOT REPRODUCE.
      #
      # Three runs of the same commit (`fd3176e`), two machine classes: this sandbox, the
      # SCHEDULED nightly (run 32688459462), and a fresh dispatch (run 32689182307). All
      # three reported **196 DRIFTED**, and the drifted SETS are byte-identical — 196/196
      # names, zero symmetric difference, same md5. Not "similar counts": the same set.
      # So the 196 are genuine staleness, and the ~0.4-2%-on-a-different-gallery-each-run
      # flake that retired this gate is, on this corpus and this pair of machine classes,
      # not present. §9.3 of `2026-08-18-golden-corpus-purpose-and-medium.md` listed
      # cross-host stability as unmeasured and said one CI run would settle it. It did.
      #
      # Also measured on the runner rather than estimated: the step takes **72m39s** there
      # (79m07s in the sandbox) and the whole job **2h04m39s**, well inside the 6h ceiling;
      # the job concludes SUCCESS with the gate red, which is the report-only contract
      # actually holding rather than merely intended; and the rolling issue APPENDED to
      # #1529 instead of opening a duplicate.
      #
      # It stays report-only anyway, and the evidence above is what a future case for
      # changing that should build on rather than replace. One corpus and one runner pair
      # is not every corpus and every runner pair, a green day here says nothing about a
      # `windows-latest` or an arm64 runner, and the gate is 72 minutes — which is a
      # nightly's budget, not a PR's. What HAS changed is that "we think it flakes" is no
      # longer the argument; anyone proposing to block on it now has a number to beat.
      # EXPECT IT RED until the corpus is re-blessed: the 196 are real. That re-bless is
      # deliberately NOT in this change — ~50 MB of binary churn that would bury the diff,
      # and it should follow observing the gate rather than precede it.
      - name: Committed-golden freshness (regress, report-only)
        id: regress
        run: |
          set -uo pipefail
          REPORT="$GITHUB_WORKSPACE/integration-nightly-report.txt"
          {
            echo ''
            echo '--- npm run regress (committed-golden freshness) ---'
          } >> "$REPORT"
          if npm run --silent regress 2>&1 | tee -a "$REPORT"; then
            echo "failed=false" >> "$GITHUB_OUTPUT"
          else
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi

      # WHY NOT A BARE TAIL. This used to be `tail -n 40`, which worked only while the
      # last gate in the report was also the noisiest thing in it. `check:family-conformance`
      # prints a 33-row table, a legend and a per-rule shortfall listing before its verdict,
      # so a `NEW CLIPS` line from the gate BEFORE it falls off the end — the one line a
      # reader needs, dropped by the reporter. So: grep the failure markers the gates
      # actually print and lead with those, then tail for context.
      #
      # `FAIL (want ` was added 2026-08-24 for the same class of loss, found the hard
      # way. `check-family-tiers` has TWO halves, and only the oracle half prints markers
      # this list knew. The probe half prints a TABLE, one row per @size, and says which
      # one broke in the row itself:
      #
      #   portrait  tall  tall  column  column  MISSING  MISSING  FAIL (want column/column/column/nowrap)
      #
      # None of the patterns above match that, so for fifteen nights (#1529, from
      # 2026-08-10) the rolling issue carried a bare `1 FAILURES` with the line that
      # explains it dropped — long enough that the failure was read as part of the
      # oracle half's clip findings rather than a distinct, and as it turned out
      # spurious, one. The lesson generalizes past this pattern: a gate that reports
      # per-row instead of per-marker is invisible here until someone adds its shape.
      - name: Job summary
        if: always()
        run: |
          {
            echo '### Integration nightly — render-regression tier'
            echo '```'
            grep -E 'NEW CLIPS|FIXED \(re-bless\)|roster +CHANGED|[0-9]+ FAILURES|[0-9]+ DRIFTED|FAIL \(want |difference\(s\) from|^not ok |^--- ' \
              "$GITHUB_WORKSPACE/integration-nightly-report.txt" || echo '(no failure markers)'
            echo '```'
            echo '<details><summary>Last 120 lines</summary>'
            echo ''
            echo '```'
            tail -n 120 "$GITHUB_WORKSPACE/integration-nightly-report.txt" || true
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-nightly-${{ github.run_id }}
          path: integration-nightly-report.txt
          if-no-files-found: warn
          retention-days: 14

      # On a failure, open or append a single rolling tracking issue (found by a
      # title marker). Self-labeled at creation with the four-axis taxonomy (a
      # GITHUB_TOKEN-opened issue can't trigger the triage gate). Skipped when green.
      - name: Open / append regression issue
        if: steps.run.outputs.failed == 'true' || steps.families.outputs.failed == 'true' || steps.codewidth.outputs.failed == 'true' || steps.contrast.outputs.failed == 'true' || steps.palette.outputs.failed == 'true' || steps.regress.outputs.failed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          MARKER='[integration-nightly]'
          BODY="$GITHUB_WORKSPACE/integration-nightly-body.md"
          {
            echo "The nightly render-regression tier failed on \`main@${{ github.sha }}\`."
            echo ""
            echo "What failed (full log in the run's artifact):"
            echo ""
            echo '```'
            grep -E 'NEW CLIPS|FIXED \(re-bless\)|roster +CHANGED|[0-9]+ FAILURES|[0-9]+ DRIFTED|FAIL \(want |difference\(s\) from|^not ok |^--- ' \
              "$GITHUB_WORKSPACE/integration-nightly-report.txt" || echo '(no failure markers — see the tail below)'
            echo '```'
            echo ""
            echo "<details><summary>Last 120 lines</summary>"
            echo ""
            echo '```'
            tail -n 120 "$GITHUB_WORKSPACE/integration-nightly-report.txt" || true
            echo '```'
            echo "</details>"
            echo ""
            echo "_Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}._"
          } > "$BODY"
          # Find the rolling issue by its title MARKER, client-side. `--search "in:title $MARKER"`
          # looks right and is not: GitHub tokenizes the query on the brackets and the hyphen,
          # so it degrades to the bare words and matches human-authored issues — `.[0]` then
          # takes someone else's issue and appends to it nightly while the rolling issue is
          # never found and never updated. studio-e2e-nightly.yml fixed this for itself and its
          # comment recorded that every sibling still carried the bug; this is that fix.
          # `startswith` on the marker rather than full-title equality, because
          # overflow-nightly.yml deliberately RETITLES its rolling issue as the condition
          # changes — across this family only the marker is stable.
          # THE STAND-DOWN STEP BELOW MUST USE THE IDENTICAL LOOKUP. Two different searches
          # would let this step append to one thread while that one closes another.
          # --limit is far above the open-issue count; gh paginates to reach it, and a limit the
          # backlog could outgrow would silently miss the issue and file a fresh duplicate nightly.
          ISSUE=$(gh issue list --state open --limit 1000 --json number,title,author \
            --jq "[.[] | select(.title | startswith(\"$MARKER \")) | select(.author.is_bot == true and (.author.login == \"app/github-actions\" or .author.login == \"github-actions\" or .author.login == \"github-actions[bot]\"))][0].number" || true)
          if [ -n "${ISSUE:-}" ] && [ "$ISSUE" != "null" ]; then
            gh issue comment "$ISSUE" --body-file "$BODY"
            echo "Appended to issue #$ISSUE"
          else
            gh issue create \
              --title "$MARKER render-regression tier failing on main" \
              --label "area:engine" --label "type:fix" \
              --label "priority:high" --label "status:backlog" \
              --body-file "$BODY"
          fi

      # STAND THE ALARM DOWN when the condition clears. A rolling issue that only ever
      # opens is a one-way ratchet: after its first firing it reads as "the flaky
      # nightly", and a real regression months later arrives as a comment on a thread
      # nobody reopens. Until an alarm can close itself, neither its run color nor its
      # issue is falsifiable — and this family is report-only by contract, so the issue is
      # the ONLY signal there is.
      #
      # THE CONDITION IS `outcome == 'success' && output == 'false'`, NEVER `!= 'true'`.
      # `!= 'true'` IS TRUE FOR THE EMPTY STRING, and the output is empty in every state
      # where nothing was measured — a canceled job, a step timeout, an earlier step that
      # died first. Each of those would close the issue and comment "measured green",
      # reporting NOT MEASURED as health, which is this family's cardinal sin
      # (perf-nightly.yml records four separate instances of it). `outcome` is the step's
      # own result, so a step that never ran to a clean exit cannot be read as evidence.
      #
      # AND IT COMMENTS RATHER THAN CLOSING, because this tier is NOT scored against the
      # commit in front of it. It is scored against a COMMITTED BASELINE — `test/oracle/family-*.json`, `test/oracle/player-contrast.json`, and the committed golden PDFs —
      # and `npm run bless` / `contrast:player:bless` / `check:family-conformance:bless` rewrites that baseline to accept whatever is currently
      # failing. So a green night here means "the tree matches the baseline", which is a
      # different claim from "the finding is fixed", and the two are indistinguishable from
      # inside the run.
      #
      # THE RE-BLESS WOULD HAVE BEEN THE TRIGGER. That is not hypothetical: a first cut of
      # this step called the tier ABSOLUTE and closed on a measured green, which means the
      # very first time it fired would have been the night after somebody blessed the
      # baseline — posting "measured green, closing" about a bar that had just been lowered.
      # A lowered bar reported as a recovery is the same lie this change exists to remove,
      # wearing the opposite costume.
      #
      # Commenting is not a consolation prize. The ratchet was never really "it does not
      # close", it was "nothing ever argues the other side": a thread that only ever
      # accumulates failures reads as the flaky nightly. A comment naming the run and the
      # commit gives a human the counter-evidence and lets them make the call the run
      # cannot. Closing on a bless-aware condition — compare the baseline files' history
      # against the issue's own creation date — is the better answer and is deliberately
      # NOT attempted here: it needs full git history in a job that may be shallow, and a
      # `git log` that silently returns nothing would close on no evidence at all.
      #
      # ALL SIX ARMS, NAMED INDIVIDUALLY. The filing step ORs six outputs; standing down has
      # to AND the same six, because any one still red means the tier is still failing.
      # Spelling them out rather than negating the filing step's expression is deliberate: a
      # `!` around that OR is satisfied by six EMPTY strings, which is the no-measurement
      # state, not health.
      #
      # EXPECT THIS NOT TO FIRE FOR A WHILE, and that is the step working rather than
      # broken. The `regress` arm is knowingly red — 196 genuinely drifted goldens, with the
      # re-bless deliberately deferred (see that step's own comment) — so the rolling issue
      # stays open until the corpus is re-blessed. An alarm that stood down while a known
      # arm is red would be the same lie in the opposite direction.
      - name: Report a measured-green night on the rolling issue
        if: >-
          always() && github.ref == 'refs/heads/main'
          && steps.run.outcome == 'success' && steps.run.outputs.failed == 'false'
          && steps.families.outcome == 'success' && steps.families.outputs.failed == 'false'
          && steps.contrast.outcome == 'success' && steps.contrast.outputs.failed == 'false'
          && steps.palette.outcome == 'success' && steps.palette.outputs.failed == 'false'
          && steps.codewidth.outcome == 'success' && steps.codewidth.outputs.failed == 'false'
          && steps.regress.outcome == 'success' && steps.regress.outputs.failed == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          MARKER='[integration-nightly]'
          # The IDENTICAL lookup the filing step above uses — see its comment for why the
          # `in:title` search cannot be used and why this matches on the marker prefix.
          ISSUE=$(gh issue list --state open --limit 1000 --json number,title,author \
            --jq "[.[] | select(.title | startswith(\"$MARKER \")) | select(.author.is_bot == true and (.author.login == \"app/github-actions\" or .author.login == \"github-actions\" or .author.login == \"github-actions[bot]\"))][0].number" || true)
          [ -n "${ISSUE:-}" ] && [ "$ISSUE" != "null" ] || exit 0
          # Comment BEFORE closing, and name the run that proved it. A silent close leaves the
          # next reader unable to tell a recovered alarm from one somebody quietly triaged away.
          # Built with `--body-file`, not an inline multi-line `--body`: a continuation line has
          # to start at column 0 to avoid leading spaces in the issue text, and a column-0 line
          # ENDS the `run: |` block scalar — the workflow then parses as something else entirely.
          {
            echo "Measured green on \`main@${{ github.sha }}\`: every arm of the render-regression tier passed — integration slice, adaptive family tiers, player contrast, palette matrix, code-line budgets and committed-golden freshness."
            echo ""
            echo "**Left open deliberately.** Three of those arms score against committed baselines (\`test/oracle/*.json\`, the golden PDFs), and blessing a baseline turns them green without fixing anything. This run cannot tell a fix from a re-bless. Check which happened and close by hand; a recurrence appends here."
            echo ""
            echo "_Proved by run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}._"
          } > "$GITHUB_WORKSPACE/stand-down.md"
          gh issue comment "$ISSUE" --body-file "$GITHUB_WORKSPACE/stand-down.md" || true
