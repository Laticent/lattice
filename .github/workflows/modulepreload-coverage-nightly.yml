name: Modulepreload coverage nightly (docs)

# NIGHTLY advisory check: does every `client:only` app-shell island under
# docs/src/pages/ have a matching entry in scripts/inject-modulepreload.mjs's
# ENTRIES list? See scripts/check-modulepreload-coverage.mjs's header comment
# for the full rationale and engineering/decisions/2026-07-10-landing-perf-
# katex-defer.md §6 for the investigation this follows on from.
#
# Off the PR critical path on purpose: a missing entry is a missed
# optimization (the page still works, just slower to hydrate), not a broken
# build — inject-modulepreload.mjs's own end-to-end integrity check already
# fails the BUILD loudly if the mechanism itself breaks for an EXISTING
# entry; this nightly instead catches the case nothing else can: a NEW
# client:only island added without anyone remembering to wire it up. Same
# shape as perf-nightly.yml — opens/appends a single rolling tracking issue,
# self-labeled (a GITHUB_TOKEN-opened issue can't trigger the Issue triage
# gate's own labeling).

on:
  schedule:
    - cron: '7 5 * * *' # daily 05:07 UTC (between studio-e2e 04:41 and perf 05:37)
  workflow_dispatch:

permissions:
  contents: read
  issues: write # open / append the coverage tracking issue

concurrency:
  group: modulepreload-coverage-nightly
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install docs deps
        run: npm ci
        working-directory: docs

      - name: Check modulepreload ENTRIES coverage
        id: check
        run: |
          set -uo pipefail
          LOG="$GITHUB_WORKSPACE/modulepreload-check.log"
          if npm run check:modulepreload-coverage -- --md "$GITHUB_WORKSPACE/coverage-report.md" 2>&1 | tee "$LOG"; then
            echo "uncovered=false" >> "$GITHUB_OUTPUT"
          else
            echo "uncovered=true" >> "$GITHUB_OUTPUT"
          fi
          # HOW MANY ISLANDS THE SCAN ACTUALLY SAW. `uncovered=false` is also what an
          # EMPTY scan produces, and this job is one of the few allowed to CLOSE its
          # rolling issue — so without this it closes on a measurement that never
          # happened. `|| true` and the `:-0` default are deliberate: a parse that
          # finds nothing must report ZERO (the stand-down then declines), never an
          # empty string, and must not abort the step under `-e`.
          ISLANDS=$(grep -oE '^islands=[0-9]+' "$LOG" | tail -n 1 | cut -d= -f2 || true)
          echo "islands=${ISLANDS:-0}" >> "$GITHUB_OUTPUT"
        working-directory: docs

      - name: Job summary
        if: always()
        run: cat "$GITHUB_WORKSPACE/coverage-report.md" >> "$GITHUB_STEP_SUMMARY" || true

      # On a miss, open or append a single rolling tracking issue (found by a
      # title marker) — mirrors perf-nightly.yml's issue step exactly.
      - name: Open / append coverage issue
        if: steps.check.outputs.uncovered == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          MARKER='[modulepreload-coverage]'
          BODY="$GITHUB_WORKSPACE/coverage-report.md"
          {
            echo ""
            echo "_Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} · commit \`${{ github.sha }}\`._"
          } >> "$BODY"
          # Find the rolling issue by its title MARKER, client-side. `--search "in:title $MARKER"`
          # looks right and is not: GitHub tokenizes the query on the brackets and the hyphen,
          # so it degrades to the bare words and matches human-authored issues — `.[0]` then
          # takes someone else's issue and appends to it nightly while the rolling issue is
          # never found and never updated. studio-e2e-nightly.yml fixed this for itself and its
          # comment recorded that every sibling still carried the bug; this is that fix.
          # `startswith` on the marker rather than full-title equality, because
          # overflow-nightly.yml deliberately RETITLES its rolling issue as the condition
          # changes — across this family only the marker is stable.
          # THE STAND-DOWN STEP BELOW MUST USE THE IDENTICAL LOOKUP. Two different searches
          # would let this step append to one thread while that one closes another.
          # --limit is far above the open-issue count; gh paginates to reach it, and a limit the
          # backlog could outgrow would silently miss the issue and file a fresh duplicate nightly.
          ISSUE=$(gh issue list --state open --limit 1000 --json number,title,author \
            --jq "[.[] | select(.title | startswith(\"$MARKER \")) | select(.author.is_bot == true and (.author.login == \"app/github-actions\" or .author.login == \"github-actions\" or .author.login == \"github-actions[bot]\"))][0].number" || true)
          if [ -n "${ISSUE:-}" ] && [ "$ISSUE" != "null" ]; then
            gh issue comment "$ISSUE" --body-file "$BODY"
            echo "Appended to issue #$ISSUE"
          else
            gh issue create \
              --title "$MARKER new client:only island(s) missing modulepreload coverage" \
              --label "area:website" --label "type:infra" \
              --label "priority:medium" --label "status:backlog" \
              --body-file "$BODY"
          fi

      # STAND THE ALARM DOWN when the condition clears. A rolling issue that only ever
      # opens is a one-way ratchet: after its first firing it reads as "the flaky
      # nightly", and a real regression months later arrives as a comment on a thread
      # nobody reopens. Until an alarm can close itself, neither its run color nor its
      # issue is falsifiable — and this family is report-only by contract, so the issue is
      # the ONLY signal there is.
      #
      # THE CONDITION IS `outcome == 'success' && output == 'false'`, NEVER `!= 'true'`.
      # `!= 'true'` IS TRUE FOR THE EMPTY STRING, and the output is empty in every state
      # where nothing was measured — a canceled job, a step timeout, an earlier step that
      # died first. Each of those would close the issue and comment "measured green",
      # reporting NOT MEASURED as health, which is this family's cardinal sin
      # (perf-nightly.yml records four separate instances of it). `outcome` is the step's
      # own result, so a step that never ran to a clean exit cannot be read as evidence.
      #
      # AND UNLIKE perf-nightly, THIS ALARM MAY CLOSE OUTRIGHT. perf compares head against
      # a base ~24h old, so a green night there cannot tell "fixed" from "the base now
      # carries the regression too", and it may only close a harness-failure thread. This
      # check is ABSOLUTE — scored against this commit alone, with no historical arm — so
      # a measured green IS the evidence that the condition is gone. The thread closes; a
      # recurrence opens a fresh one.
      - name: Stand down the coverage issue when every island is covered
        if: always() && steps.check.outcome == 'success' && steps.check.outputs.uncovered == 'false' && steps.check.outputs.islands != '0' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          MARKER='[modulepreload-coverage]'
          # The IDENTICAL lookup the filing step above uses — see its comment for why the
          # `in:title` search cannot be used and why this matches on the marker prefix.
          ISSUE=$(gh issue list --state open --limit 1000 --json number,title,author \
            --jq "[.[] | select(.title | startswith(\"$MARKER \")) | select(.author.is_bot == true and (.author.login == \"app/github-actions\" or .author.login == \"github-actions\" or .author.login == \"github-actions[bot]\"))][0].number" || true)
          [ -n "${ISSUE:-}" ] && [ "$ISSUE" != "null" ] || exit 0
          # Comment BEFORE closing, and name the run that proved it. A silent close leaves the
          # next reader unable to tell a recovered alarm from one somebody quietly triaged away.
          # Built with `--body-file`, not an inline multi-line `--body`: a continuation line has
          # to start at column 0 to avoid leading spaces in the issue text, and a column-0 line
          # ENDS the `run: |` block scalar — the workflow then parses as something else entirely.
          {
            echo "Recovered: every \`client:only\` island under \`docs/src/pages/\` has a matching \`ENTRIES\` entry on \`main@${{ github.sha }}\`. Closing — a newly uncovered island opens a fresh thread."
            echo ""
            echo "_Proved by run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}._"
          } > "$GITHUB_WORKSPACE/stand-down.md"
          gh issue comment "$ISSUE" --body-file "$GITHUB_WORKSPACE/stand-down.md" || true
          gh issue close "$ISSUE" --reason completed || true
