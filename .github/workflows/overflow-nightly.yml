name: Overflow nightly (corpus clip ratchet)

# NIGHTLY, REPORT-ONLY watch on the one gate that can see a slide shipping cut off.
#
# `tools/check-overflow-corpus.js` renders every deck that ships — 279 of them —
# through the real emulator and reads the emulator's OWN "⚠ OVERFLOW — N slides"
# report, then compares the per-deck page lists against
# `test/integration/overflow-baseline.json`. It is a RATCHET: a deck that clips more
# pages than its baseline fails; a deck that clips fewer is a win you bank with
# `--bless`.
#
# WHY THIS FILE EXISTS. Until now the ratchet was wired to NO workflow and NO hook —
# it ran when somebody remembered. `2026-08-18-inspection-oracle-catalog.md` §5 lever F
# names it, alongside six other unscheduled gates, and gives the reason: a blessed
# baseline that nothing evaluates is an assertion that rots. That is not a general
# worry here, it is the specific one — `2026-08-24-overflow-oracle-was-inert.md` found
# the UNIVERSAL "slide does not overflow its frame" invariant comparing scrollHeight to
# clientHeight on an `overflow-y: hidden` section, so it could never fail for any of the
# 61 components. This corpus sweep is the ratchet that WOULD have caught the drift that
# oracle could not, and nothing was watching it either.
#
# COST, MEASURED RATHER THAN ESTIMATED. The catalog note sized this from the tool's own
# header — "~185 renders, tens of minutes" — and filed it under a weekly tier on that
# basis. Both halves were wrong. A full green sweep is **279 decks in 5m21-5m31** on a
# 4-vCPU box, and `--jobs 4` comes in at 5m22, so raising the worker count buys nothing.
#
# THE DEFAULT WORKER COUNT IS 2 HERE, NOT 3. `check-overflow-corpus.js:142` computes
# `min(4, max(1, cpus - 2))`, so 4 vCPUs give 2 workers and 2 vCPUs give 1. An earlier
# revision of this header said "the box saturates at 3", which was read off the TOOL'S OWN
# stale usage comment (`--jobs 6 # parallelism (default 3)`) rather than off the run — the
# same mistake as the estimate it was correcting. The timing conclusion survives the fix;
# the number did not. On a 2-vCPU runner the worker count halves and the wall clock will be
# longer than the figures above, which is part of why `timeout-minutes` is set below.
#
# BUDGET: ~5.5 min of sweep plus checkout / setup-node / apt / `npm ci`, so call it ~7
# runner-minutes a night — ~210 a month, not the ~165 an earlier revision quoted from the
# sweep alone. Against the ~1,900 runner-minutes A DAY the same note measured for per-PR CI
# that is still ~0.4%, which is why "weekly" stopped being the obvious answer once the
# number was real.
#
# WHY ITS OWN WORKFLOW, and not a step in `integration-nightly.yml`. That job already has
# Chromium, poppler and `npm ci` warm, so a step there would be strictly cheaper in setup —
# but two things make it the wrong home. It runs **~2h05m**, so a 6-minute check inherits a
# two-hour blast radius: a timeout, a cancelation or a dead runner and this never executes.
# And that job is **expected red** for now (its `regress` step says so in writing, until the
# golden corpus is re-blessed), so a new signal added there lands inside a color nobody
# reads — which is precisely the failure mode the catalog note records against
# `studio-e2e-nightly`, red six nights running while everyone learned to ignore it. A cheap,
# independent job with its own color is worth the ~90s of duplicated setup.
#
# REPORT-ONLY, deliberately. `2026-06-28-experience-gating-playwright.md` §3 is the standing
# rule: a browser-dependent check becomes blocking only after an observed green streak on a
# real cadence, never on hope. Nothing has ever observed this one on a GitHub runner. So the
# job concludes SUCCESS even when the ratchet is red, and the signal is carried by a single
# rolling tracking issue (found by a title marker, so it never spams), self-labeled at
# creation — a GITHUB_TOKEN-opened issue cannot trip the triage gate, GitHub's
# workflow-recursion guard. Promoting it to blocking is a separate, evidence-backed decision.

on:
  schedule:
    # daily 02:41 UTC — ahead of integration-nightly 03:11, preview-e2e 04:23,
    # studio-e2e 04:41, modulepreload 05:07, perf 05:37, backlog sync 06:17.
    # A non-round minute on purpose, like every other cron in this repo: GitHub
    # queues scheduled workflows heavily at the top of the hour, and a 6-minute
    # job is the kind that sits behind that queue for longer than it runs.
    - cron: '41 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write # open / append the rolling tracking issue

concurrency:
  group: overflow-nightly
  cancel-in-progress: false

jobs:
  overflow:
    runs-on: ubuntu-latest
    # ~7 min expected (see the budget note above). 30 leaves ~2x headroom for a 2-vCPU runner,
    # where the worker count halves: measured 332s at 2 workers on 4 vCPU, so ~11m of sweep at
    # 1 worker plus ~2.5-3.5m of setup is ~14m worst case, and that also absorbs a few decks
    # hitting the tool's own 300s per-deck cap. Without a ceiling this inherits GitHub's
    # 360-minute default while `check-overflow-corpus.js` bounds only a single deck, never the
    # sweep — so a hung run would burn six hours.
    #
    # On a JOB timeout the run is canceled; `if: always()` on the steps below DOES still run
    # under cancelation (that is why GitHub documents `success() || failure()` for the
    # opposite intent), so the issue is filed with an empty `kind` and reads "could not run",
    # which is the correct thing to say about a timed-out sweep. An earlier revision of this
    # comment asserted the reverse.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # THE BROWSER, and the thing that is easy to get wrong here. `lattice-emulator.js`
      # does NOT read `CHROME_PATH` — `detectChromeExecutable()` (lattice-emulator.js:1253)
      # resolves `PUPPETEER_EXECUTABLE_PATH`, then puppeteer's own cache under
      # `$HOME/.cache/puppeteer`, then `which google-chrome|chromium|...`. Only
      # `check-overflow-corpus.js:145` reads `CHROME_PATH`, and only to refuse to start
      # without it. So setting `CHROME_PATH` alone satisfies the guard while the RENDER
      # silently happens on whatever else resolves first — measured: with
      # `CHROME_PATH=/nonexistent/chrome` the emulator renders a deck fine.
      #
      # The browser is therefore pinned to puppeteer's own cached Chromium, the same one
      # `integration-nightly.yml` uses and the same one the ratchet's baseline was blessed
      # against, and BOTH variables are set from it: `PUPPETEER_EXECUTABLE_PATH` so the
      # emulator actually uses it, `CHROME_PATH` so the corpus tool starts. A
      # `browser-actions/setup-chrome` step was tried here and removed: it installs Chrome
      # *stable*, which is a different build from the baseline's Chromium, and its binary is
      # on PATH as `chrome`, a name the emulator's `which` list does not even look for.
      - name: Cache Puppeteer browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install color emoji font
        # An installed color emoji font so headless-Chromium renders emit emoji in
        # color. No poppler or ImageMagick here: this gate reads the emulator's own
        # overflow report, never the PDF bytes and never a pixel — which is most of
        # why it costs 5 minutes and the regression gate costs 72.
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-color-emoji
      - run: npm ci
      # `executablePath()` COMPUTES a path; it does not check the file is there. Measured: point
      # PUPPETEER_CACHE_DIR at an empty directory and it still returns a path and exits 0. That
      # matters because `detectChromeExecutable()` returns PUPPETEER_EXECUTABLE_PATH
      # unconditionally (lattice-emulator.js:1254) — setting it turns the cache scan and `which`
      # fallbacks into dead code. So a partial or stale cache restore would hand both variables a
      # path to nothing, sail past the `check-overflow-corpus.js:145` guard (which only asks that
      # CHROME_PATH is non-empty), and fail all 279 renders. This step therefore fails HERE, where
      # the message says "browser missing", rather than 279 decks later where it reads as a corpus
      # finding. No `-e` subtlety: this step WANTS to die on failure, which is `bash -e`'s default.
      - name: Resolve the puppeteer Chromium both tools must agree on
        id: chrome
        run: |
          CHROME="$(node -p "require('puppeteer').executablePath()")"
          if [ ! -x "$CHROME" ]; then
            echo "::error::puppeteer resolved $CHROME but nothing executable is there — the browser cache did not restore and npm ci did not download it."
            exit 1
          fi
          echo "path=$CHROME" >> "$GITHUB_OUTPUT"

      # Keep the JOB green whatever the ratchet says, so the summary and issue steps run and
      # the issue keys off an output rather than the step's own exit — the report-only
      # contract, same shape integration-nightly uses.
      #
      # `if …; then` — NOT a bare pipeline followed by `${PIPESTATUS[0]}`. GitHub runs every
      # step under `bash -e {0}`, and `set -uo pipefail` ADDS to that; it does not clear the
      # `-e` the shell was invoked with. A bare failing pipeline therefore kills the step
      # before the next line runs. This repo already paid for that lesson once and wrote it
      # down at `perf-nightly.yml:259-266`, where a real dispatch proved it — and the first
      # revision of THIS step walked into it anyway, because it was verified by running the
      # extracted script under a plain `bash` rather than under `bash -e`. Measured, on the
      # exact step body: `bash -e` → step exit 1, outputs EMPTY; plain `bash` → step exit 0,
      # outputs written. A command on the left of `if` is exempt from `-e`.
      #
      # What that cost, had it shipped: a genuine ratchet regression would turn the JOB red
      # (against the report-only contract this file states twice) AND file the finding under
      # "could not run (exit unknown)" — a real overflow finding titled as a setup error,
      # with the report text contradicting the title in the same issue body. The exact
      # mirror of the defect this discrimination exists to prevent.
      #
      # AND THE EXIT CODE ALONE CANNOT DISCRIMINATE. `check-overflow-corpus.js:186,206`
      # exits 1 for `regressions.length || errors.length` — so a browser that cannot launch
      # fails all 279 renders and exits 1, indistinguishable by code from a deck that
      # genuinely clipped. Exit 2 is only the guard refusing to start (`:145`), a `--bless`
      # misuse, or an uncaught throw. So the classification reads the REPORT, which prints
      # unambiguous markers for each: `failed to render` per deck, and `clip MORE slides
      # than the baseline` for the finding. Render errors win when both are present — a
      # ratchet verdict computed over decks that did not render is not a verdict.
      - name: Overflow corpus sweep (report-only)
        id: sweep
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.chrome.outputs.path }}
          CHROME_PATH: ${{ steps.chrome.outputs.path }}
        run: |
          set -uo pipefail
          REPORT="$GITHUB_WORKSPACE/overflow-nightly-report.txt"
          CODE=0
          if npm run --silent overflow:check 2>&1 | tee "$REPORT"; then CODE=0; else CODE=$?; fi
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          if [ "$CODE" -eq 0 ]; then
            echo "failed=false" >> "$GITHUB_OUTPUT"
            echo "kind=clean" >> "$GITHUB_OUTPUT"
          else
            echo "failed=true" >> "$GITHUB_OUTPUT"
            if grep -q 'failed to render' "$REPORT"; then
              echo "kind=broken" >> "$GITHUB_OUTPUT"
            elif grep -q 'clip MORE slides than the baseline' "$REPORT"; then
              echo "kind=finding" >> "$GITHUB_OUTPUT"
            else
              echo "kind=unknown" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Job summary
        if: always()
        run: |
          {
            echo '### Overflow nightly — corpus clip ratchet'
            echo '```'
            tail -n 60 "$GITHUB_WORKSPACE/overflow-nightly-report.txt" || echo '(no report)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: overflow-nightly-${{ github.run_id }}
          path: overflow-nightly-report.txt
          if-no-files-found: warn
          retention-days: 14

      # One rolling issue, found by a title marker so it never spams. Self-labeled at
      # creation with the four required axes (`area:`/`type:`/`priority:`/`status:`),
      # because a GITHUB_TOKEN-opened issue cannot trigger the triage gate.
      # `!= 'false'` rather than `== 'true'`, so a sweep step that DIED before writing its
      # output (an npm failure, an OOM, a canceled job) still files rather than passing in
      # silence. On a green run `failed=false` is written and this does not fire — verified.
      - name: Open / append overflow issue
        if: always() && steps.sweep.outputs.failed != 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          MARKER='[overflow-nightly]'
          BODY="$GITHUB_WORKSPACE/overflow-nightly-body.md"
          CODE='${{ steps.sweep.outputs.code }}'
          KIND='${{ steps.sweep.outputs.kind }}'
          case "$KIND" in
            finding) SUBJECT='corpus overflow ratchet above baseline on main' ;;
            broken)  SUBJECT='overflow-nightly cannot render the corpus' ;;
            *)       SUBJECT="overflow-nightly could not run (exit ${CODE:-unknown})" ;;
          esac
          {
            case "$KIND" in
              finding)
                echo "The corpus overflow ratchet is above its baseline on \`main@${{ github.sha }}\`."
                echo ""
                echo "A slide that clips is a slide that ships cut off. Either trim the deck, or —"
                echo "if the change is deliberate and the content is right — re-bless with"
                echo "\`node tools/check-overflow-corpus.js --bless\` and justify the new floor in the PR."
                ;;
              broken)
                echo "One or more decks FAILED TO RENDER on \`main@${{ github.sha }}\`, so the corpus"
                echo "was not scored. This is not an overflow finding."
                echo ""
                echo "The usual cause is the browser: the job pins PUPPETEER_EXECUTABLE_PATH and"
                echo "CHROME_PATH to puppeteer's cached Chromium, so a cache that restored without the"
                echo "binary lands here. Note the ratchet CANNOT be read on a run with render errors —"
                echo "a verdict computed over decks that did not render is not a verdict."
                ;;
              *)
                echo "The sweep did NOT run to a verdict on \`main@${{ github.sha }}\` — exit \`${CODE:-unknown}\`."
                echo ""
                echo "The corpus was never scored. An empty exit code means the step itself died or the"
                echo "job was canceled (it has a 30-minute ceiling). Nothing is known about the corpus"
                echo "until this is fixed — treat a quiet night as unmeasured, not clean."
                ;;
            esac
            echo ""
            echo '```'
            tail -n 60 "$GITHUB_WORKSPACE/overflow-nightly-report.txt" || echo '(no report)'
            echo '```'
            echo ""
            echo "_Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}._"
          } > "$BODY"
          # Find the rolling issue by its title MARKER, client-side. `--search "in:title $MARKER"`
          # looks right and is not: GitHub tokenizes the query on the brackets and the hyphen,
          # so it degrades to the bare words and matches human-authored issues — `.[0]` then
          # takes someone else's issue and appends to it nightly while the rolling issue is
          # never found and never updated. studio-e2e-nightly.yml fixed this for itself and its
          # comment recorded that every sibling still carried the bug; this is that fix.
          # `startswith` on the marker rather than full-title equality, because
          # overflow-nightly.yml deliberately RETITLES its rolling issue as the condition
          # changes — across this family only the marker is stable.
          # THE STAND-DOWN STEP BELOW MUST USE THE IDENTICAL LOOKUP. Two different searches
          # would let this step append to one thread while that one closes another.
          # --limit is far above the open-issue count; gh paginates to reach it, and a limit the
          # backlog could outgrow would silently miss the issue and file a fresh duplicate nightly.
          ISSUE=$(gh issue list --state open --limit 1000 --json number,title,author \
            --jq "[.[] | select(.title | startswith(\"$MARKER \")) | select(.author.login == \"github-actions\" or .author.login == \"github-actions[bot]\")][0].number" || true)
          if [ -n "${ISSUE:-}" ] && [ "$ISSUE" != "null" ]; then
            # Retitle on append. The rolling issue outlives the condition that opened it, so an
            # issue first opened by a broken browser would otherwise keep saying "cannot render"
            # for months after the night a real ratchet regression appeared. The body already
            # discriminates; without this the TITLE — the part anyone reads in a list — does not.
            gh issue edit "$ISSUE" --title "$MARKER $SUBJECT" >/dev/null
            gh issue comment "$ISSUE" --body-file "$BODY"
            echo "Appended to issue #$ISSUE (title set to: $SUBJECT)"
          else
            gh issue create \
              --title "$MARKER $SUBJECT" \
              --label "area:engine" --label "type:fix" \
              --label "priority:high" --label "status:backlog" \
              --body-file "$BODY"
          fi

      # STAND THE ALARM DOWN when the condition clears. A rolling issue that only ever
      # opens is a one-way ratchet: after its first firing it reads as "the flaky
      # nightly", and a real regression months later arrives as a comment on a thread
      # nobody reopens. Until an alarm can close itself, neither its run color nor its
      # issue is falsifiable — and this family is report-only by contract, so the issue is
      # the ONLY signal there is.
      #
      # THE CONDITION IS `outcome == 'success' && output == 'false'`, NEVER `!= 'true'`.
      # `!= 'true'` IS TRUE FOR THE EMPTY STRING, and the output is empty in every state
      # where nothing was measured — a canceled job, a step timeout, an earlier step that
      # died first. Each of those would close the issue and comment "measured green",
      # reporting NOT MEASURED as health, which is this family's cardinal sin
      # (perf-nightly.yml records four separate instances of it). `outcome` is the step's
      # own result, so a step that never ran to a clean exit cannot be read as evidence.
      #
      # AND IT COMMENTS RATHER THAN CLOSING, because this tier is NOT scored against the
      # commit in front of it. It is scored against a COMMITTED BASELINE — the per-deck clip counts in the overflow corpus baseline, which this tool calls a RATCHET in its own header —
      # and `npm run overflow:bless` rewrites that baseline to accept whatever is currently
      # failing. So a green night here means "the tree matches the baseline", which is a
      # different claim from "the finding is fixed", and the two are indistinguishable from
      # inside the run.
      #
      # THE RE-BLESS WOULD HAVE BEEN THE TRIGGER. That is not hypothetical: a first cut of
      # this step called the tier ABSOLUTE and closed on a measured green, which means the
      # very first time it fired would have been the night after somebody blessed the
      # baseline — posting "measured green, closing" about a bar that had just been lowered.
      # A lowered bar reported as a recovery is the same lie this change exists to remove,
      # wearing the opposite costume.
      #
      # Commenting is not a consolation prize. The ratchet was never really "it does not
      # close", it was "nothing ever argues the other side": a thread that only ever
      # accumulates failures reads as the flaky nightly. A comment naming the run and the
      # commit gives a human the counter-evidence and lets them make the call the run
      # cannot. Closing on a bless-aware condition — compare the baseline files' history
      # against the issue's own creation date — is the better answer and is deliberately
      # NOT attempted here: it needs full git history in a job that may be shallow, and a
      # `git log` that silently returns nothing would close on no evidence at all.
      #
      # `failed == 'false'` IS THE ONLY CLEAN VERDICT HERE, and the sweep step writes it on
      # exit 0 alone. That step deliberately swallows the tool's exit code into `code`/`kind`
      # so the job stays green under the report-only contract, which means its `outcome` is
      # `success` for a BROKEN BROWSER exactly as readily as for a clean corpus — `kind=broken`
      # and `kind=unknown` both carry `failed=true`, and both must keep the thread open. A
      # ratchet verdict computed over decks that never rendered is not a verdict, so it is not
      # grounds to close one either.
      - name: Report a clean corpus sweep on the rolling issue
        if: always() && steps.sweep.outcome == 'success' && steps.sweep.outputs.failed == 'false' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          MARKER='[overflow-nightly]'
          # The IDENTICAL lookup the filing step above uses — see its comment for why the
          # `in:title` search cannot be used and why this matches on the marker prefix.
          ISSUE=$(gh issue list --state open --limit 1000 --json number,title,author \
            --jq "[.[] | select(.title | startswith(\"$MARKER \")) | select(.author.login == \"github-actions\" or .author.login == \"github-actions[bot]\")][0].number" || true)
          [ -n "${ISSUE:-}" ] && [ "$ISSUE" != "null" ] || exit 0
          # Comment BEFORE closing, and name the run that proved it. A silent close leaves the
          # next reader unable to tell a recovered alarm from one somebody quietly triaged away.
          # Built with `--body-file`, not an inline multi-line `--body`: a continuation line has
          # to start at column 0 to avoid leading spaces in the issue text, and a column-0 line
          # ENDS the `run: |` block scalar — the workflow then parses as something else entirely.
          {
            echo "Measured green on \`main@${{ github.sha }}\`: the corpus rendered in full and no deck clips more slides than its baseline."
            echo ""
            echo "**Left open deliberately.** The ratchet is scored against a committed baseline, and \`npm run overflow:bless\` raises that floor to accept the current clips — the issue body above says so itself when it fires. A clean sweep therefore cannot distinguish a trimmed deck from a raised floor. Check which happened and close by hand; a recurrence appends here."
            echo ""
            echo "_Proved by run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}._"
          } > "$GITHUB_WORKSPACE/stand-down.md"
          gh issue comment "$ISSUE" --body-file "$GITHUB_WORKSPACE/stand-down.md" || true
