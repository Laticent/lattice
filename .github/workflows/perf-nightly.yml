name: Perf nightly (docs regression watch)

# NIGHTLY relative web-perf regression watch for the docs site. Replaces the old
# per-PR Lighthouse budget (absolute thresholds that rotted as the site grew and
# flapped on CI runner variance — issue #327). The perf gate is the ONLY gate
# whose verdict depends on the runner (CPU speed + whether the CDN web fonts
# loaded), not just the code, so per the repo gate-strategy
# (engineering/decisions/2026-06-13-gate-strategy-change-detection.md §C/§D) it
# moves OFF the PR critical path to a nightly on `main`. See
# engineering/decisions/2026-06-15-docs-perf-gating-policy.md for the full policy.
#
# Shape: B-injob relative budget. It builds + measures `main@HEAD` AND the
# `main` commit from ~24h ago, BACK-TO-BACK ON THE SAME RUNNER, and compares the
# medians (scripts/perf-regression.mjs). Measuring both on one runner cancels
# systematic hardware differences; only a real regression beyond tolerance trips
# it. Stateless — no committed baseline, no update ritual. Double-build cost is
# free at night. On a regression it opens / appends a rolling tracking issue.

on:
  schedule:
    - cron: '37 5 * * *' # daily 05:37 UTC (before the 06:17 backlog sync)
  workflow_dispatch:

permissions:
  contents: read
  issues: write # open / append the perf-regression tracking issue

concurrency:
  group: perf-nightly
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
      HEAD_OUT: ${{ github.workspace }}/.perf-out/head
      BASE_OUT: ${{ github.workspace }}/.perf-out/base
      BASE_TREE: ${{ github.workspace }}/../perf-base-src
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need history to resolve the ~24h-ago base commit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable

      - name: Resolve base commit (~24h ago on main)
        id: base
        run: |
          set -euo pipefail
          BASE=$(git rev-list -1 --before='24 hours ago' origin/main || true)
          HEAD_SHA=$(git rev-parse HEAD)
          if [ -z "$BASE" ] || [ "$BASE" = "$HEAD_SHA" ]; then
            BASE=$(git rev-parse HEAD~1)
          fi
          echo "sha=$BASE" >> "$GITHUB_OUTPUT"
          echo "Base commit: $BASE (head: $HEAD_SHA)"

      # ---- HEAD (current main) ----
      - name: Install docs deps (head)
        run: npm ci
        working-directory: docs
      - name: Collect — head
        run: node scripts/perf-collect.mjs --out "$HEAD_OUT"
        working-directory: docs
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}

      # ---- BASE (~24h ago), measured with HEAD's tooling ----
      # The base commit predates these perf scripts, so overlay HEAD's
      # collect/compare scripts into a worktree of the base SOURCE and measure
      # it there — identical tooling, base's site. We deliberately do NOT copy
      # HEAD's lighthouserc*.cjs: the base measures its OWN url list/settings, so
      # a page added/removed or a setting changed in the last 24h can't 404 the
      # base collect — the compare matches by URL and skips pages with no base.
      # continue-on-error: a broken historical commit must not fail the watch
      # (the compare then runs head-only).
      - name: Build + collect — base
        id: basecollect
        continue-on-error: true
        run: |
          set -euo pipefail
          git worktree add --detach "$BASE_TREE" "${{ steps.base.outputs.sha }}"
          cp docs/scripts/perf-collect.mjs docs/scripts/perf-regression.mjs "$BASE_TREE/docs/scripts/"
          cd "$BASE_TREE/docs"
          npm ci
          node scripts/perf-collect.mjs --out "$BASE_OUT"
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}

      # ---- Compare ----
      # The compare exits 1 on a regression. We must NOT let that fail the step
      # silently OR via the trailing command — capture the verdict into an
      # output and keep the job green, so the artifact + summary always upload
      # and the issue step keys off `regressed` (not the step's own exit).
      - name: Compare head vs base
        id: compare
        run: |
          set -uo pipefail
          if node scripts/perf-regression.mjs --base "$BASE_OUT" --head "$HEAD_OUT" --md "$GITHUB_WORKSPACE/perf-report.md"; then
            echo "regressed=false" >> "$GITHUB_OUTPUT"
          else
            echo "regressed=true" >> "$GITHUB_OUTPUT"
          fi
        working-directory: docs

      - name: Job summary
        if: always()
        run: cat "$GITHUB_WORKSPACE/perf-report.md" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-nightly-${{ github.run_id }}
          path: |
            .perf-out/**/lhr-*.json
            perf-report.md
          if-no-files-found: warn
          retention-days: 14

      # On a regression, open or append a single rolling tracking issue (found by
      # a title marker). It is SELF-LABELLED at creation: a GITHUB_TOKEN-opened
      # issue can't trigger the Issue triage gate (GitHub's workflow-recursion
      # guard), so a bot must carry the four-axis taxonomy itself — otherwise it
      # lands on the board unlabelled (this was issue #384). Skipped when green.
      - name: Open / append regression issue
        if: steps.compare.outputs.regressed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          MARKER='[perf-nightly]'
          BODY="$GITHUB_WORKSPACE/perf-report.md"
          {
            echo ""
            echo "_Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} · base \`${{ steps.base.outputs.sha }}\` → head \`${{ github.sha }}\`._"
          } >> "$BODY"
          ISSUE=$(gh issue list --state open --search "in:title $MARKER" --json number -q '.[0].number' || true)
          if [ -n "$ISSUE" ]; then
            gh issue comment "$ISSUE" --body-file "$BODY"
            echo "Appended to issue #$ISSUE"
          else
            gh issue create \
              --title "$MARKER docs perf regression detected" \
              --label "area:website" --label "type:fix" \
              --label "priority:high" --label "status:backlog" \
              --body-file "$BODY"
          fi

  # ── Engine + preview + export perf ────────────────────────────────────────────
  # A SECOND AXIS. The lighthouse job above measures docs-site PAGE LOAD (LCP/TBT,
  # desktop + mobile). It says nothing about the three surfaces that carry this
  # product's interactive feel: the Studio preview's per-keystroke render, the
  # engine's markdown->HTML cost, and the export/rasterize tier. Those had no
  # nightly at all — the @perf spec printed numbers and asserted nothing, and
  # `bench:check` is on-demand.
  #
  # WHAT THIS JOB DOES AND DOES NOT MEASURE. `--export` is the rasterize tier
  # (screenshot every slide of two decks, ~2 min per arm). The PRINT RE-PLACE tier
  # (`--print`) is ~11 min per arm and stays on-demand — two arms of it would put
  # this job near 40 minutes every night for one ratio. Those two tiers shared a
  # single flag until 2026-08-03, and the combined cost is precisely why the first
  # cut of this job passed NEITHER and still claimed export coverage.
  #
  # TWO DIFFERENT COMPARISON STRATEGIES, deliberately:
  #
  #  · The preview spec asserts CEILINGS (test/benchmark/preview-budget.json) —
  #    absolute budgets set against the WORST of three healthy runs. Machine-independent by
  #    construction, so no base checkout is needed and drift should not fire them.
  #
  #  · The engine bench compares HEAD vs BASE built on THIS SAME RUNNER, the way
  #    the lighthouse job does — never against the committed baseline.json. That
  #    baseline is machine-relative and a cold runner reads up to 2x high: in one
  #    session the same code measured 93.9ms and 43.1ms, and `bench:check`
  #    reported a phantom +124% regression on a healthy tree. Comparing two builds
  #    on one runner cancels that drift; comparing against a stored number does not.
  #    See engineering/decisions/2026-08-03-performance-guard.md.
  engine-perf:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci

      # The same two guards the lighthouse job above carries at :56-64, and the first cut of this
      # job carried neither. Without `|| true` an unresolvable ref fails the step; without the
      # HEAD~1 fallback a quiet day resolves BASE == HEAD and the job spends ~15 minutes
      # benchmarking one tree against itself, printing "no regression" it could not have detected.
      - name: Resolve base commit (~24h ago on main)
        id: base
        run: |
          set -euo pipefail
          BASE=$(git rev-list -1 --before='24 hours ago' origin/main || true)
          HEAD_SHA=$(git rev-parse HEAD)
          if [ -z "$BASE" ] || [ "$BASE" = "$HEAD_SHA" ]; then
            BASE=$(git rev-parse HEAD~1)
          fi
          echo "sha=$BASE" >> "$GITHUB_OUTPUT"
          echo "Base commit: $BASE (head: $HEAD_SHA)"

      - name: Bench — head
        run: node test/benchmark/engine-bench.mjs --json --export > head-bench.json

      # continue-on-error, matching the lighthouse job's `Build + collect — base`: a broken
      # historical commit, or a transient `npm ci`, must not silently disable the whole alarm. It
      # used to: every downstream step lacked `if: always()`, so a base failure skipped the compare,
      # the preview ceilings AND the issue step, and the only symptom was a red nightly nobody
      # watches. Now the compare runs regardless and reports "NOTHING WAS COMPARED" as an alarm.
      - name: Bench — base (same runner)
        continue-on-error: true
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/base "${{ steps.base.outputs.sha }}"
          cd /tmp/base && npm ci --silent
          node test/benchmark/engine-bench.mjs --json --export > "$GITHUB_WORKSPACE/base-bench.json"

      # EXIT 2 IS A WIRING BUG, NOT A REGRESSION — it means the tool was invoked wrong, and filing
      # that as a priority:high "perf regression" would be a confident, wrong, actionable issue.
      # An arm that DIED, by contrast, exits 1 as "NOTHING WAS COMPARED": a blind alarm is a real
      # finding, so it files, and the body says so rather than implying a slowdown.
      - name: Compare head vs base
        id: compare
        if: always()
        run: |
          set -uo pipefail
          node tools/perf-nightly-compare.mjs --base base-bench.json --head head-bench.json --md engine-perf.md
          case $? in
            0) echo "regressed=false" >> "$GITHUB_OUTPUT" ;;
            1) echo "regressed=true"  >> "$GITHUB_OUTPUT" ;;
            *) echo "regressed=false" >> "$GITHUB_OUTPUT"; echo "::warning::perf compare invoked wrong — not filed as a regression"; exit 1 ;;
          esac

      # Install and run are SEPARATE STEPS on purpose. Sharing one step with `set -uo pipefail`
      # (no `-e`) meant a failed `npm ci` or `playwright install` fell through to the test run,
      # which then failed, which was reported as "a per-keystroke render went past its budget" —
      # an infrastructure failure filed as a high-priority performance regression. Install failures
      # now fail the job loudly and file nothing.
      - name: Install docs deps + browser
        if: always()
        run: |
          set -euo pipefail
          cd docs
          npm ci --silent
          npx playwright install --with-deps chromium

      # A ceiling breach and a broken harness both exit non-zero, so the log is the discriminator:
      # the assertion messages in studio-preview-perf.spec.ts all contain the word "ceiling".
      - name: Preview interaction ceilings (@perf)
        id: preview
        if: always()
        run: |
          set -uo pipefail
          cd docs
          npx playwright test --project=desktop --grep @perf 2>&1 | tee "$GITHUB_WORKSPACE/perf-e2e.log"
          STATUS=${PIPESTATUS[0]}
          if [ "$STATUS" -eq 0 ]; then
            echo "breached=false" >> "$GITHUB_OUTPUT"
          elif grep -q 'ceiling' "$GITHUB_WORKSPACE/perf-e2e.log"; then
            echo "breached=true" >> "$GITHUB_OUTPUT"
            { echo ""; echo "## Preview interaction ceilings BREACHED"; echo ""; echo "A per-keystroke or per-navigation p50 went past its budget in \`test/benchmark/preview-budget.json\`. Those budgets sit 3-6x above the worst healthy reading, so this is an order-of-magnitude change, not drift. The per-sample table is in the job log and the \`perf-e2e.log\` artifact."; } >> "$GITHUB_WORKSPACE/engine-perf.md"
          else
            echo "breached=false" >> "$GITHUB_OUTPUT"
            echo "::warning::@perf suite failed without breaching a ceiling — harness failure, not filed as a regression"
            exit 1
          fi

      - name: Job summary
        if: always()
        run: cat "$GITHUB_WORKSPACE/engine-perf.md" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-perf-${{ github.run_id }}
          path: |
            head-bench.json
            base-bench.json
            engine-perf.md
          if-no-files-found: warn
          retention-days: 14

      # Same rolling-issue pattern as the lighthouse job above, own marker so the
      # two axes do not append to each other's thread. Self-labeled for the same
      # reason (a GITHUB_TOKEN-opened issue can't trigger the triage gate).
      - name: Open / append regression issue
        if: steps.compare.outputs.regressed == 'true' || steps.preview.outputs.breached == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          MARKER='[perf-nightly-engine]'
          BODY="$GITHUB_WORKSPACE/engine-perf.md"
          {
            echo ""
            echo "_Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} · base \`${{ steps.base.outputs.sha }}\` → head \`${{ github.sha }}\`._"
          } >> "$BODY"
          ISSUE=$(gh issue list --state open --search "in:title $MARKER" --json number -q '.[0].number' || true)
          if [ -n "$ISSUE" ]; then
            gh issue comment "$ISSUE" --body-file "$BODY"
          else
            gh issue create \
              --title "$MARKER engine / preview / export perf regression" \
              --label "area:engine" --label "type:fix" \
              --label "priority:high" --label "status:backlog" \
              --body-file "$BODY"
          fi
