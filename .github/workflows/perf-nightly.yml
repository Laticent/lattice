name: Perf nightly (docs regression watch)

# NIGHTLY relative web-perf regression watch for the docs site. Replaces the old
# per-PR Lighthouse budget (absolute thresholds that rotted as the site grew and
# flapped on CI runner variance — issue #327). The perf gate is the ONLY gate
# whose verdict depends on the runner (CPU speed + whether the CDN web fonts
# loaded), not just the code, so per the repo gate-strategy
# (engineering/decisions/2026-06-13-gate-strategy-change-detection.md §C/§D) it
# moves OFF the PR critical path to a nightly on `main`. See
# engineering/decisions/2026-06-15-docs-perf-gating-policy.md for the full policy.
#
# Shape: B-injob relative budget. It builds + measures `main@HEAD` AND the
# `main` commit from ~24h ago, BACK-TO-BACK ON THE SAME RUNNER, and compares the
# medians (scripts/perf-regression.mjs). Measuring both on one runner cancels
# systematic hardware differences; only a real regression beyond tolerance trips
# it. Stateless — no committed baseline, no update ritual. Double-build cost is
# free at night. On a regression it opens / appends a rolling tracking issue.

on:
  schedule:
    - cron: '37 5 * * *' # daily 05:37 UTC (before the 06:17 backlog sync)
  workflow_dispatch:

permissions:
  contents: read
  issues: write # open / append the perf-regression tracking issue

concurrency:
  group: perf-nightly
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
      HEAD_OUT: ${{ github.workspace }}/.perf-out/head
      BASE_OUT: ${{ github.workspace }}/.perf-out/base
      BASE_TREE: ${{ github.workspace }}/../perf-base-src
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need history to resolve the ~24h-ago base commit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            docs/package-lock.json
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable

      - name: Resolve base commit (~24h ago on main)
        id: base
        run: |
          set -euo pipefail
          BASE=$(git rev-list -1 --before='24 hours ago' origin/main || true)
          HEAD_SHA=$(git rev-parse HEAD)
          if [ -z "$BASE" ] || [ "$BASE" = "$HEAD_SHA" ]; then
            BASE=$(git rev-parse HEAD~1)
          fi
          echo "sha=$BASE" >> "$GITHUB_OUTPUT"
          echo "Base commit: $BASE (head: $HEAD_SHA)"

      # ---- HEAD (current main) ----
      # The docs build loads the owned engine from ROOT `lib/**`, whose boundary
      # kernel imports `markdown-it` by bare specifier (#1271) — resolved upward from
      # lib/core, so it needs ROOT node_modules, not docs/. Mirrors ci.yml's
      # docs-build and docs.yml; without it the build dies with ERR_MODULE_NOT_FOUND.
      - name: Install root deps (engine deps the docs build loads)
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'
      - name: Install docs deps (head)
        run: npm ci
        working-directory: docs
      - name: Collect — head
        run: node scripts/perf-collect.mjs --out "$HEAD_OUT"
        working-directory: docs
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}

      # ---- BASE (~24h ago), measured with HEAD's tooling ----
      # The base commit predates these perf scripts, so overlay HEAD's
      # collect/compare scripts into a worktree of the base SOURCE and measure
      # it there — identical tooling, base's site. We deliberately do NOT copy
      # HEAD's lighthouserc*.cjs: the base measures its OWN url list/settings, so
      # a page added/removed or a setting changed in the last 24h can't 404 the
      # base collect — the compare matches by URL and skips pages with no base.
      # continue-on-error: a broken historical commit must not fail the watch
      # (the compare then runs head-only).
      - name: Build + collect — base
        id: basecollect
        continue-on-error: true
        run: |
          set -euo pipefail
          git worktree add --detach "$BASE_TREE" "${{ steps.base.outputs.sha }}"
          cp docs/scripts/perf-collect.mjs docs/scripts/perf-regression.mjs "$BASE_TREE/docs/scripts/"
          # Root deps in the worktree too — the docs build loads root `lib/**`, whose
          # boundary kernel imports `markdown-it` by bare specifier and resolves it
          # upward from lib/core (#1271). Same reason as the head install above.
          cd "$BASE_TREE"
          npm ci
          cd "$BASE_TREE/docs"
          npm ci
          node scripts/perf-collect.mjs --out "$BASE_OUT"
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}

      # ---- Compare ----
      # The compare exits 1 on a regression. We must NOT let that fail the step
      # silently OR via the trailing command — capture the verdict into an
      # output and keep the job green, so the artifact + summary always upload
      # and the issue step keys off `regressed` (not the step's own exit).
      - name: Compare head vs base
        id: compare
        run: |
          set -uo pipefail
          if node scripts/perf-regression.mjs --base "$BASE_OUT" --head "$HEAD_OUT" --md "$GITHUB_WORKSPACE/perf-report.md"; then
            echo "regressed=false" >> "$GITHUB_OUTPUT"
          else
            echo "regressed=true" >> "$GITHUB_OUTPUT"
          fi
        working-directory: docs

      - name: Job summary
        if: always()
        run: cat "$GITHUB_WORKSPACE/perf-report.md" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-nightly-${{ github.run_id }}
          path: |
            .perf-out/**/lhr-*.json
            perf-report.md
          if-no-files-found: warn
          retention-days: 14

      # On a regression, open or append a single rolling tracking issue (found by
      # a title marker). It is SELF-LABELED at creation: a GITHUB_TOKEN-opened
      # issue can't trigger the Issue triage gate (GitHub's workflow-recursion
      # guard), so a bot must carry the four-axis taxonomy itself — otherwise it
      # lands on the board unlabelled (this was issue #384). Skipped when green.
      - name: Open / append regression issue
        if: steps.compare.outputs.regressed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          MARKER='[perf-nightly]'
          BODY="$GITHUB_WORKSPACE/perf-report.md"
          {
            echo ""
            echo "_Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} · base \`${{ steps.base.outputs.sha }}\` → head \`${{ github.sha }}\`._"
          } >> "$BODY"
          # Find the rolling issue by its title MARKER, client-side. `--search "in:title $MARKER"`
          # looks right and is not: GitHub tokenizes the query on the brackets and the hyphen,
          # so it degrades to the bare words and matches human-authored issues — `.[0]` then
          # takes someone else's issue and appends to it nightly while the rolling issue is
          # never found and never updated. studio-e2e-nightly.yml fixed this for itself and its
          # comment recorded that every sibling still carried the bug; this is that fix.
          # `startswith` on the marker rather than full-title equality, because
          # overflow-nightly.yml deliberately RETITLES its rolling issue as the condition
          # changes — across this family only the marker is stable.
          # THE STAND-DOWN STEP BELOW MUST USE THE IDENTICAL LOOKUP. Two different searches
          # would let this step append to one thread while that one closes another.
          # --limit is far above the open-issue count; gh paginates to reach it, and a limit the
          # backlog could outgrow would silently miss the issue and file a fresh duplicate nightly.
          ISSUE=$(gh issue list --state open --limit 1000 --json number,title,author \
            --jq "[.[] | select(.title | startswith(\"$MARKER \")) | select(.author.login == \"github-actions\" or .author.login == \"github-actions[bot]\")][0].number" || true)
          if [ -n "${ISSUE:-}" ] && [ "$ISSUE" != "null" ]; then
            gh issue comment "$ISSUE" --body-file "$BODY"
            echo "Appended to issue #$ISSUE"
          else
            gh issue create \
              --title "$MARKER docs perf regression detected" \
              --label "area:website" --label "type:fix" \
              --label "priority:high" --label "status:backlog" \
              --body-file "$BODY"
          fi

      # STAND THE ALARM DOWN — and for THIS job that means COMMENT, NEVER CLOSE.
      #
      # Every other nightly alarm in this repo closes its rolling issue on a measured green,
      # because every other one is ABSOLUTE: it is scored against the commit in front of it.
      # This job is DIFFERENTIAL — head against a base ~24h old — and that makes a green
      # night unreadable as a fix. A regression lands on day 0; night 1 the base predates it,
      # the alarm fires; night 2 the base INCLUDES it, both arms carry it, the diff is clean.
      # Closing there would be literally true and completely misleading, on a still-broken
      # site. The sibling `engine-perf` job hit exactly this and solved it by closing only a
      # thread whose body says the previous firing was a HARNESS failure. This job emits no
      # such marker, so a close condition here would be one I could not ground — and a step
      # that closes on the wrong evidence is worse than the ratchet it replaces.
      #
      # So it comments. That is not a consolation prize: it turns a thread that has been
      # accumulating failures with no counter-evidence into one that says which nights
      # measured clean and on which commit, which is what a human needs to decide whether to
      # close it. The one-way ratchet was never really "it does not close" — it was "nothing
      # ever argues the other side".
      #
      # BOTH ARMS MUST HAVE SUCCEEDED, and the base arm is the one that matters.
      # `Build + collect — base` is `continue-on-error`, and perf-regression.mjs skips any
      # metric with no base reading (`evaluate()`: `base == null → regressed: false, reason:
      # 'missing'`). So a base arm that died entirely yields ZERO comparisons and a cheerful
      # `regressed=false` — not a green site, a green nothing. Commenting "measured green" on
      # that is the not-measured-as-health sin this whole change exists to remove. `outcome`
      # rather than the output alone, for the empty-string reason the sibling job documents.
      - name: Report a measured-green night on the rolling issue
        if: >-
          always() && github.ref == 'refs/heads/main'
          && steps.compare.outcome == 'success' && steps.compare.outputs.regressed == 'false'
          && steps.basecollect.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          MARKER='[perf-nightly]'
          # The IDENTICAL lookup the filing step above uses — see its comment. Two different
          # searches is how one step appends to a thread while another acts on a different one.
          ISSUE=$(gh issue list --state open --limit 1000 --json number,title,author \
            --jq "[.[] | select(.title | startswith(\"$MARKER \")) | select(.author.login == \"github-actions\" or .author.login == \"github-actions[bot]\")][0].number" || true)
          [ -n "${ISSUE:-}" ] && [ "$ISSUE" != "null" ] || exit 0
          {
            echo "Measured green on \`main@${{ github.sha }}\` against base \`${{ steps.base.outputs.sha }}\` — no page past its budget, and both arms collected."
            echo ""
            echo "**Left open deliberately.** This watch compares head against a base ~24h old, so a clean night cannot tell \"fixed\" from \"the base now carries the regression too\". Close it by hand once you have confirmed the fix; a recurrence appends here."
            echo ""
            echo "_Proved by run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}._"
          } > "$GITHUB_WORKSPACE/stand-down.md"
          gh issue comment "$ISSUE" --body-file "$GITHUB_WORKSPACE/stand-down.md" || true

  # ── Engine + preview + export perf ────────────────────────────────────────────
  # A SECOND AXIS. The lighthouse job above measures docs-site PAGE LOAD (LCP/TBT,
  # desktop + mobile). It says nothing about the three surfaces that carry this
  # product's interactive feel: the Studio preview's per-keystroke render, the
  # engine's markdown->HTML cost, and the export/rasterize tier. Those had no
  # nightly at all — the @perf spec printed numbers and asserted nothing, and
  # `bench:check` is on-demand.
  #
  # WHAT THIS JOB DOES AND DOES NOT MEASURE. `--export` is the rasterize tier
  # (screenshot every slide of two decks, ~2 min per arm). The PRINT RE-PLACE tier
  # (`--print`) is ~11 min per arm and stays on-demand — two arms of it would put
  # this job near 40 minutes every night for one ratio. Those two tiers shared a
  # single flag until 2026-08-03, and the combined cost is precisely why the first
  # cut of this job passed NEITHER and still claimed export coverage.
  #
  # TWO DIFFERENT COMPARISON STRATEGIES, deliberately:
  #
  #  · The preview spec asserts CEILINGS (test/benchmark/preview-budget.json) —
  #    absolute budgets set against the WORST of three healthy runs. Machine-independent by
  #    construction, so no base checkout is needed and drift should not fire them.
  #
  #  · The engine bench compares HEAD vs BASE built on THIS SAME RUNNER, the way
  #    the lighthouse job does — never against the committed baseline.json. That
  #    baseline is machine-relative and a cold runner reads up to 2x high: in one
  #    session the same code measured 93.9ms and 43.1ms, and `bench:check`
  #    reported a phantom +124% regression on a healthy tree. Comparing two builds
  #    on one runner cancels that drift; comparing against a stored number does not.
  #    See engineering/decisions/2026-08-03-performance-guard.md.
  engine-perf:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci

      # The same two guards the lighthouse job above carries at :56-64, and the first cut of this
      # job carried neither. Without `|| true` an unresolvable ref fails the step; without the
      # HEAD~1 fallback a quiet day resolves BASE == HEAD and the job spends ~15 minutes
      # benchmarking one tree against itself, printing "no regression" it could not have detected.
      - name: Resolve base commit (~24h ago on main)
        id: base
        run: |
          set -euo pipefail
          BASE=$(git rev-list -1 --before='24 hours ago' origin/main || true)
          HEAD_SHA=$(git rev-parse HEAD)
          if [ -z "$BASE" ] || [ "$BASE" = "$HEAD_SHA" ]; then
            BASE=$(git rev-parse HEAD~1)
          fi
          echo "sha=$BASE" >> "$GITHUB_OUTPUT"
          echo "Base commit: $BASE (head: $HEAD_SHA)"

      - name: Bench — head
        run: node test/benchmark/engine-bench.mjs --json --export > head-bench.json

      # continue-on-error, matching the lighthouse job's `Build + collect — base`: a broken
      # historical commit, or a transient `npm ci`, must not silently disable the whole alarm. It
      # used to: every downstream step lacked `if: always()`, so a base failure skipped the compare,
      # the preview ceilings AND the issue step, and the only symptom was a red nightly nobody
      # watches. Now the compare runs regardless and reports "NOTHING WAS COMPARED" as an alarm.
      # HEAD'S HARNESS, BASE'S SOURCE — the overlay the lighthouse job does at :91 and this job
      # originally omitted. Without it the base arm runs the BASE COMMIT'S bench script, so any
      # change to what a flag MEANS makes the two arms measure different things. The first real
      # dispatch proved it: the base predated the --export/--print split, ran the print tier under
      # --export, needed jspdf from docs/node_modules that a root `npm ci` never installs, and died
      # with `Cannot find module 'jspdf'`. Copy the harness in and both arms measure base's `lib/`
      # with identical tooling — which is the only thing that makes the comparison mean anything.
      - name: Bench — base (same runner)
        continue-on-error: true
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/base "${{ steps.base.outputs.sha }}"
          cp test/benchmark/engine-bench.mjs /tmp/base/test/benchmark/engine-bench.mjs
          cd /tmp/base && npm ci --silent
          node test/benchmark/engine-bench.mjs --json --export > "$GITHUB_WORKSPACE/base-bench.json"

      # EXIT 2 IS A WIRING BUG, NOT A REGRESSION — it means the tool was invoked wrong, and filing
      # that as a priority:high "perf regression" would be a confident, wrong, actionable issue.
      # An arm that DIED, by contrast, exits 1 as "NOTHING WAS COMPARED": a blind alarm is a real
      # finding, so it files, and the body says so rather than implying a slowdown.
      - name: Compare head vs base
        id: compare
        if: always()
        run: |
          set -uo pipefail
          # `|| rc=$?`, NOT a bare command followed by `case $?`. GitHub runs every step under
          # `bash -e`, and `set -uo pipefail` does not clear the `-e` the shell was INVOKED with —
          # so a bare failing command kills the step before the next line executes. The first real
          # dispatch proved it: the comparator correctly exited 1, the step died on the spot,
          # `regressed` was never set, and the issue step's condition read empty. The alarm was
          # mute in exactly the way this PR exists to prevent. A command on the left of `||` is
          # exempt from `-e`, which is why the sibling job's `if node …; then` form works.
          rc=0
          node tools/perf-nightly-compare.mjs --base base-bench.json --head head-bench.json --md engine-perf.md || rc=$?
          case "$rc" in
            0) echo "regressed=false" >> "$GITHUB_OUTPUT" ;;
            1) echo "regressed=true"  >> "$GITHUB_OUTPUT" ;;
            *) echo "regressed=false" >> "$GITHUB_OUTPUT"; echo "::warning::perf compare invoked wrong — not filed as a regression"; exit 1 ;;
          esac

      # Install and run are SEPARATE STEPS on purpose. Sharing one step meant a failed `npm ci` or
      # `playwright install` was reported as "a per-keystroke render went past its budget" — an
      # infrastructure failure filed as a high-priority performance regression. Install failures
      # now fail the job loudly and file nothing.
      - name: Install docs deps + browser
        if: always()
        run: |
          set -euo pipefail
          cd docs
          npm ci --silent
          npx playwright install --with-deps chromium

      # A ceiling breach and a broken harness both exit non-zero, so the log is the discriminator —
      # but it must be a MACHINE token, not English. Grepping for "ceiling" also matched the
      # no-patch-renders assertion and the spec's own comment block, so a broken harness filed as
      # "a p50 went past its budget" about a p50 nothing measured. Only the three ceiling
      # assertions emit the breach token (see the spec's header for its exact spelling — it is
      # deliberately not written out here, so this comment can never match its own grep).
      - name: Preview interaction ceilings (@perf)
        id: preview
        if: always()
        run: |
          set -uo pipefail
          cd docs
          # `|| STATUS=$?` for the same reason as the compare step: the step runs under `bash -e`,
          # so a failing pipeline would kill it before `STATUS=` ever ran — and this one passed its
          # first real dispatch only because the tests PASSED. A genuine ceiling breach would have
          # killed the step, left `breached` unset, and filed nothing: the alarm mute precisely when
          # it had something to say.
          # REDIRECT then `cat`, not `| tee`: a pipe would run the assignment in a SUBSHELL and
          # STATUS would never reach the branch below. The log still lands in the job output.
          STATUS=0
          npx playwright test --project=desktop --grep @perf > "$GITHUB_WORKSPACE/perf-e2e.log" 2>&1 || STATUS=$?
          cat "$GITHUB_WORKSPACE/perf-e2e.log"
          if [ "$STATUS" -eq 0 ]; then
            echo "breached=false" >> "$GITHUB_OUTPUT"
          elif grep -q '::perf-ceiling-breach::' "$GITHUB_WORKSPACE/perf-e2e.log"; then
            echo "breached=true" >> "$GITHUB_OUTPUT"
            { echo ""; echo "## Preview interaction ceilings BREACHED"; echo ""; echo "A per-keystroke or per-navigation p50 went past its budget in \`test/benchmark/preview-budget.json\`. Those budgets sit 3-6x above the worst healthy reading, so this is an order-of-magnitude change, not drift. The per-sample table is in the job log and the \`perf-e2e.log\` artifact."; } >> "$GITHUB_WORKSPACE/engine-perf.md"
          else
            echo "breached=false" >> "$GITHUB_OUTPUT"
            echo "::warning::@perf suite failed without breaching a ceiling — harness failure, not filed as a regression"
            exit 1
          fi

      # STAND THE ALARM DOWN — but only on evidence, and only for the case that earns it.
      #
      # A rolling issue that never closes is a one-way ratchet: after its first firing (likelier a
      # harness failure than a regression) it is triaged as "the flaky nightly", and a real
      # regression months later arrives as a comment on a dismissed thread. That was worth fixing.
      # The first cut fixed it in two ways that were WORSE than the ratchet, and both are corrected
      # here:
      #
      # 1. `!= 'true'` IS TRUE FOR THE EMPTY STRING. Two paths in this job deliberately set their
      #    output to `false` and then `exit 1` BECAUSE NOTHING WAS MEASURED — the comparator's
      #    exit-2 wiring-bug branch, and the @perf harness-failure branch. A canceled or timed-out
      #    job leaves both empty. In every one of those states the old condition held, so the step
      #    commented "Green — no tier past its band" and closed the thread. "Not measured" was
      #    being reported as health, which is this workflow's cardinal sin and the fifth instance
      #    of the exit-code class in this file. So the condition now requires BOTH that each step
      #    SUCCEEDED and that its output is an explicit 'false'. The output alone is not enough and
      #    a first pass at this fix got that wrong: the exit-2 wiring branch and the @perf
      #    harness-failure branch each write `false` and THEN `exit 1`, so an output-only condition
      #    is satisfied by precisely the failures it was meant to exclude. `outcome` is the step's
      #    own result, so a step that exited non-zero can never be read as "measured green".
      # 2. A GREEN NIGHT DOES NOT MEAN THE REGRESSION IS GONE. The comparison is head vs a base
      #    ~24h old. A regression lands on day 0; night 1 the base predates it, so the alarm fires
      #    and the issue opens; night 2 the base INCLUDES it, both arms carry it, the diff is clean
      #    — and the old step closed the issue on a still-broken tree, with a comment that was
      #    literally true and completely misleading. So a green night now only closes a thread
      #    whose body says the previous firing was a HARNESS failure (`NOTHING WAS COMPARED`), which
      #    is the false-alarm case the ratchet fix was actually for. A real regression's thread gets
      #    a green-night comment and stays open for a human, because a differ with a 24-hour memory
      #    cannot tell "fixed" from "now on both sides".
      - name: Stand down the rolling issue when measured green
        if: always() && steps.compare.outcome == 'success' && steps.preview.outcome == 'success' && steps.compare.outputs.regressed == 'false' && steps.preview.outputs.breached == 'false' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          MARKER='[perf-nightly-engine]'
          # The IDENTICAL lookup the filing step uses — see its comment. These two searching
          # differently is how a stand-down closes a thread nobody was appending to.
          ISSUE=$(gh issue list --state open --limit 1000 --json number,title,author \
            --jq "[.[] | select(.title | startswith(\"$MARKER \")) | select(.author.login == \"github-actions\" or .author.login == \"github-actions[bot]\")][0].number" || true)
          [ -n "${ISSUE:-}" ] && [ "$ISSUE" != "null" ] || exit 0
          BODY=$(gh issue view "$ISSUE" --json body -q .body || true)
          gh issue comment "$ISSUE" --body "Measured green on \`${{ github.sha }}\` — no tier past its band, no ceiling breached. _Proved by run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}._" || true
          # Close ONLY a harness-failure thread. A real regression stays open: head-vs-base-24h
          # cannot distinguish "fixed" from "the base now carries it too".
          case "$BODY" in
            *"NOTHING WAS COMPARED"*)
              gh issue comment "$ISSUE" --body "The previous firing was a harness failure, not a measured regression, and this run measured cleanly — closing. A real regression opens a fresh thread. _Proved by run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}._" || true
              gh issue close "$ISSUE" --reason completed || true
              ;;
          esac

      - name: Job summary
        if: always()
        run: cat "$GITHUB_WORKSPACE/engine-perf.md" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-perf-${{ github.run_id }}
          path: |
            head-bench.json
            base-bench.json
            engine-perf.md
            perf-e2e.log
          if-no-files-found: warn
          retention-days: 14

      # Same rolling-issue pattern as the lighthouse job above, own marker so the
      # two axes do not append to each other's thread. Self-labeled for the same
      # reason (a GITHUB_TOKEN-opened issue can't trigger the triage gate).
      # `always() &&` is LOAD-BEARING, and its absence was the third instance of this alarm going
      # mute. GitHub applies an implicit `success()` to any `if:` containing no status function, so
      # the bare condition read `success() && (regressed || breached)` — and this job DELIBERATELY
      # lets steps fail: `Bench — head` has no continue-on-error, the install step runs `set -e`,
      # and both the compare and preview steps `exit 1` on a harness failure. So a flaky
      # `playwright install` after the compare had already recorded a genuine 3x regression would
      # skip this step entirely and file nothing — the red-nightly-nobody-watches outcome the
      # comment at the base-bench step says was fixed. `always()` was added to five steps and not
      # to the one that raises the alarm.
      - name: Open / append regression issue
        if: always() && (steps.compare.outputs.regressed == 'true' || steps.preview.outputs.breached == 'true')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          MARKER='[perf-nightly-engine]'
          BODY="$GITHUB_WORKSPACE/engine-perf.md"
          {
            echo ""
            echo "_Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} · base \`${{ steps.base.outputs.sha }}\` → head \`${{ github.sha }}\`._"
          } >> "$BODY"
          ISSUE=$(gh issue list --state open --limit 1000 --json number,title,author \
            --jq "[.[] | select(.title | startswith(\"$MARKER \")) | select(.author.login == \"github-actions\" or .author.login == \"github-actions[bot]\")][0].number" || true)
          if [ -n "${ISSUE:-}" ] && [ "$ISSUE" != "null" ]; then
            gh issue comment "$ISSUE" --body-file "$BODY"
          else
            gh issue create \
              --title "$MARKER engine / preview / export perf regression" \
              --label "area:engine" --label "type:fix" \
              --label "priority:high" --label "status:backlog" \
              --body-file "$BODY"
          fi
