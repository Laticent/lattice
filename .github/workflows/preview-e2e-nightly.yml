name: Preview e2e nightly (playground gallery render)

# NIGHTLY real-browser e2e for the docs Playground. The jsdom unit/fuzz tests
# mock the render engine, so they prove the pane STATE stays coherent but can't
# prove the deck actually PAINTS — only a browser can. This loads a gallery from
# Edit view (the reported "tab flips to Preview but the deck never shows" flow)
# at mobile + desktop and asserts the deck reveals on screen.
#
# Per the repo gate strategy, a browser-dependent visual check belongs OFF the PR
# critical path (it's slow and needs a built site + Chrome) — so it runs nightly
# on `main`, like perf-nightly. On failure it ALWAYS captures screenshots + a
# detailed, reproducible report and files them into a single rolling tracking
# issue (found by a title marker, so it never spams), with the screenshots
# embedded inline via a dedicated artifacts branch.

on:
  schedule:
    - cron: '23 4 * * *' # daily 04:23 UTC (before perf-nightly 05:37 + backlog 06:17)
  workflow_dispatch:

permissions:
  contents: write # push screenshots to the artifacts branch for inline embedding
  issues: write # open / append the rolling tracking issue

concurrency:
  group: preview-e2e-nightly
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
      PREVIEW_E2E_OUT: ${{ github.workspace }}/.preview-e2e-out
      SHOT_BRANCH: ci/preview-e2e-screenshots
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the orphan screenshots branch is fetched/worktree'd below
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            docs/package-lock.json
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable

      # The docs build loads the owned engine from ROOT `lib/**`, whose boundary
      # kernel imports `markdown-it` by bare specifier (#1271) — resolved upward from
      # lib/core, so it needs ROOT node_modules, not docs/. Mirrors ci.yml's
      # docs-build and docs.yml; without it the build dies with ERR_MODULE_NOT_FOUND.
      - name: Install root deps (engine deps the docs build loads)
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'
      - name: Install docs deps
        run: npm ci
        working-directory: docs
      - name: Build docs site
        run: npm run build
        working-directory: docs
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}

      # The check exits 1 on a render failure. Capture the verdict into an output
      # and keep the job green so the artifact upload + issue steps always run and
      # key off `failed` (not the step's own exit), mirroring perf-nightly.
      - name: Run preview e2e
        id: e2e
        run: |
          set -uo pipefail
          LOG="$GITHUB_WORKSPACE/preview-check.log"
          if npm run check:preview 2>&1 | tee "$LOG"; then
            echo "failed=false" >> "$GITHUB_OUTPUT"
          else
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi
          # HOW MANY CASES RAN — see the note in check-preview-render.mjs. This job
          # CLOSES its rolling issue, and `failed=false` is also what a run that
          # tried nothing produces. `|| true` and `:-0` are deliberate: a parse that
          # finds nothing must report ZERO so the stand-down declines, never an
          # empty string, and must not abort the step under `-e`.
          CASES=$(grep -oE '^cases=[0-9]+' "$LOG" | tail -n 1 | cut -d= -f2 || true)
          echo "cases=${CASES:-0}" >> "$GITHUB_OUTPUT"
        working-directory: docs
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}

      - name: Upload screenshots + report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-e2e-${{ github.run_id }}
          path: .preview-e2e-out/**
          if-no-files-found: warn
          retention-days: 14

      # Publish the failure screenshots to a dedicated artifacts branch so they
      # can be embedded inline in the issue (GitHub has no issue-image upload API).
      # Reuses the checkout's authenticated origin via a worktree.
      # continue-on-error: a screenshot-publish failure must NOT abort the job —
      # the issue MUST still be filed (text + artifact link). When this step fails,
      # `base` stays empty and the issue step degrades to a no-inline-image report.
      - name: Publish screenshots to artifacts branch
        if: steps.e2e.outputs.failed == 'true'
        id: shots
        continue-on-error: true
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          DEST="${{ github.run_id }}"
          TMP="$(mktemp -d)"
          git fetch origin "$SHOT_BRANCH" || true
          if git show-ref --verify --quiet "refs/remotes/origin/$SHOT_BRANCH"; then
            git worktree add "$TMP" "origin/$SHOT_BRANCH"
            git -C "$TMP" checkout -B "$SHOT_BRANCH"
          else
            git worktree add --detach "$TMP"
            git -C "$TMP" checkout --orphan "$SHOT_BRANCH"
            git -C "$TMP" rm -rf . >/dev/null 2>&1 || true
          fi
          # Prune to the most recent 10 run dirs so the branch can't grow unbounded
          # while the playground stays broken.
          ls -1dt "$TMP"/*/ 2>/dev/null | tail -n +10 | xargs -r rm -rf
          mkdir -p "$TMP/$DEST"
          cp "$PREVIEW_E2E_OUT"/*.png "$TMP/$DEST/" 2>/dev/null || true
          git -C "$TMP" add -A
          git -C "$TMP" commit -m "preview-e2e screenshots for run $DEST" || true
          # Survive a branch that moved since the fetch (serialized by concurrency,
          # but belt-and-braces): rebase onto the remote tip, then push.
          git -C "$TMP" pull --rebase origin "$SHOT_BRANCH" 2>/dev/null || true
          git -C "$TMP" push origin "HEAD:$SHOT_BRANCH"
          echo "base=https://raw.githubusercontent.com/${{ github.repository }}/$SHOT_BRANCH/$DEST" >> "$GITHUB_OUTPUT"

      # Open or append a single rolling tracking issue (found by a title marker),
      # SELF-LABELED at creation (a GITHUB_TOKEN-opened issue can't trigger the
      # triage gate — GitHub's recursion guard — so the bot carries the taxonomy
      # itself), with the screenshots embedded inline. Skipped when green.
      - name: Open / append regression issue
        # `always() &&` restores what the comment at `Publish screenshots` above already
        # claims: *"the issue MUST still be filed (text + artifact link)"* when publishing
        # fails. It did not. GitHub applies an implicit `success()` to an `if:` with no
        # status function, so a failed publish step SKIPPED this one outright — no degraded
        # report, no issue at all, on a night the e2e run had genuinely failed. Seventh
        # instance in the family; caught by the filing-step arm in
        # test/unit/tools/nightly-alarm-contract.test.js, added 2026-09-05.
        if: always() && steps.e2e.outputs.failed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE: ${{ steps.shots.outputs.base }}
        run: |
          set -euo pipefail
          MARKER='[preview-e2e]'
          BODY="$PREVIEW_E2E_OUT/report.md"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          {
            echo ""
            echo "### Screenshots"
            if [ -n "${BASE:-}" ]; then
              for png in "$PREVIEW_E2E_OUT"/*.png; do
                [ -e "$png" ] || continue
                name="$(basename "$png")"
                echo ""
                echo "**${name%.png}**"
                echo ""
                echo "![${name}](${BASE}/${name})"
              done
            else
              echo ""
              echo "_(inline screenshots unavailable — see the run artifacts: ${RUN_URL})_"
            fi
            echo ""
            echo "_Run: ${RUN_URL} · commit \`${{ github.sha }}\`._"
          } >> "$BODY"
          # Find the rolling issue by its title MARKER, client-side. `--search "in:title $MARKER"`
          # looks right and is not: GitHub tokenizes the query on the brackets and the hyphen,
          # so it degrades to the bare words and matches human-authored issues — `.[0]` then
          # takes someone else's issue and appends to it nightly while the rolling issue is
          # never found and never updated. studio-e2e-nightly.yml fixed this for itself and its
          # comment recorded that every sibling still carried the bug; this is that fix.
          # `startswith` on the marker rather than full-title equality, because
          # overflow-nightly.yml deliberately RETITLES its rolling issue as the condition
          # changes — across this family only the marker is stable.
          # THE STAND-DOWN STEP BELOW MUST USE THE IDENTICAL LOOKUP. Two different searches
          # would let this step append to one thread while that one closes another.
          # --limit is far above the open-issue count; gh paginates to reach it, and a limit the
          # backlog could outgrow would silently miss the issue and file a fresh duplicate nightly.
          ISSUE=$(gh issue list --state open --limit 1000 --json number,title,author \
            --jq "[.[] | select(.title | startswith(\"$MARKER \")) | select(.author.is_bot == true and (.author.login == \"app/github-actions\" or .author.login == \"github-actions\" or .author.login == \"github-actions[bot]\"))][0].number" || true)
          if [ -n "${ISSUE:-}" ] && [ "$ISSUE" != "null" ]; then
            gh issue comment "$ISSUE" --body-file "$BODY"
            echo "Appended to issue #$ISSUE"
          else
            gh issue create \
              --title "$MARKER playground gallery preview fails to render" \
              --label "area:website" --label "type:fix" \
              --label "priority:high" --label "status:backlog" \
              --body-file "$BODY"
          fi

      # STAND THE ALARM DOWN when the condition clears. A rolling issue that only ever
      # opens is a one-way ratchet: after its first firing it reads as "the flaky
      # nightly", and a real regression months later arrives as a comment on a thread
      # nobody reopens. Until an alarm can close itself, neither its run color nor its
      # issue is falsifiable — and this family is report-only by contract, so the issue is
      # the ONLY signal there is.
      #
      # THE CONDITION IS `outcome == 'success' && output == 'false'`, NEVER `!= 'true'`.
      # `!= 'true'` IS TRUE FOR THE EMPTY STRING, and the output is empty in every state
      # where nothing was measured — a canceled job, a step timeout, an earlier step that
      # died first. Each of those would close the issue and comment "measured green",
      # reporting NOT MEASURED as health, which is this family's cardinal sin
      # (perf-nightly.yml records four separate instances of it). `outcome` is the step's
      # own result, so a step that never ran to a clean exit cannot be read as evidence.
      #
      # AND UNLIKE perf-nightly, THIS ALARM MAY CLOSE OUTRIGHT. perf compares head against
      # a base ~24h old, so a green night there cannot tell "fixed" from "the base now
      # carries the regression too", and it may only close a harness-failure thread. This
      # check is ABSOLUTE — scored against this commit alone, with no historical arm — so
      # a measured green IS the evidence that the condition is gone. The thread closes; a
      # recurrence opens a fresh one.
      - name: Stand down the rolling issue when the gallery renders
        if: always() && steps.e2e.outcome == 'success' && steps.e2e.outputs.failed == 'false' && steps.e2e.outputs.cases != '0' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          MARKER='[preview-e2e]'
          # The IDENTICAL lookup the filing step above uses — see its comment for why the
          # `in:title` search cannot be used and why this matches on the marker prefix.
          ISSUE=$(gh issue list --state open --limit 1000 --json number,title,author \
            --jq "[.[] | select(.title | startswith(\"$MARKER \")) | select(.author.is_bot == true and (.author.login == \"app/github-actions\" or .author.login == \"github-actions\" or .author.login == \"github-actions[bot]\"))][0].number" || true)
          [ -n "${ISSUE:-}" ] && [ "$ISSUE" != "null" ] || exit 0
          # Comment BEFORE closing, and name the run that proved it. A silent close leaves the
          # next reader unable to tell a recovered alarm from one somebody quietly triaged away.
          # Built with `--body-file`, not an inline multi-line `--body`: a continuation line has
          # to start at column 0 to avoid leading spaces in the issue text, and a column-0 line
          # ENDS the `run: |` block scalar — the workflow then parses as something else entirely.
          {
            echo "Recovered: the playground gallery rendered at both mobile and desktop widths on \`main@${{ github.sha }}\`. Closing — a recurrence opens a fresh thread."
            echo ""
            echo "_Proved by run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}._"
          } > "$GITHUB_WORKSPACE/stand-down.md"
          gh issue comment "$ISSUE" --body-file "$GITHUB_WORKSPACE/stand-down.md" || true
          gh issue close "$ISSUE" --reason completed || true
