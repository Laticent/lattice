name: Publish marp-kit

# Mirrors dist/marp-kit/ onto the orphan `dist-marp-kit` branch after every
# relevant push to main, so there is a stable, browsable/raw-fetchable place
# to grab copy-and-go Marp files without cloning or running `npm install`.
#
# WHY THIS EXISTS. dist/ is built, not committed
# (engineering/decisions/2026-08-17-generated-bundles-uncommitted.md) — the
# merge queue was ejecting PRs on conflicts in the committed minified bundles.
# npm install and the GitHub Release zip both still carry dist/marp-kit (see
# that doc §2 and tools/build-release-zip.js), but browsing/grabbing it
# straight from the repo tree stopped working. This restores that surface
# without undoing the fix that removed dist/ from main.
#
# ORPHAN BRANCH, NOT A PR THROUGH MAIN. `dist-marp-kit` is unrelated history,
# rebuilt from scratch and force-pushed as ONE commit every run:
#   - never enters the Main Merge Queue, never conflicts with an open PR —
#     engineering/workflow.md § Automation vs. the main ruleset names exactly
#     this shape ("an orphan artifact branch... costs nothing at all and
#     needs no ruleset change either");
#   - its own history never grows either, unlike a branch that accumulates a
#     commit per push — re-orphaning and force-pushing lets the old tip go
#     unreachable (and eventually GC'd) instead of piling up, which is the
#     exact per-line-conflict/churn problem the uncommit fixed in the first
#     place. This is deliberately UNLIKE `ci-drift-images` (same idiom, same
#     workflow.md precedent), which keeps one commit per PR because it wants
#     a history of past snapshots; this branch wants only the current one.
#
# GITHUB_TOKEN, NOT AUTOMATION_PAT. The main ruleset — the reason the other
# automation workflows need the PAT — targets only `refs/heads/main`, and
# nothing downstream needs to see this push as a triggering event, so the
# built-in token (which raises no event other workflows can react to) is
# sufficient. See engineering/workflow.md § Automation vs. the main ruleset.

on:
  push:
    branches: [main]
    paths:
      # Anything that can change dist/marp-kit's output. A superset is cheap
      # (a no-op rebuild + a no-op force-push of identical content costs one
      # short job); the expensive direction is a stale kit nobody rebuilt.
      - 'lib/**'
      - 'themes/**'
      - 'assets/fonts/**'
      - 'assets/licenses/**'
      - 'kit/**'
      - 'mermaid-v11.min.js'
      - 'package.json'
      - 'tools/build-marp-kit.js'
      - 'tools/build-css.js'
      - 'tools/minify-css.js'
      - 'tools/build.js'
      - 'LICENSE'
      - 'LICENSE-EXCEPTIONS'
      - '.github/workflows/publish-marp-kit.yml'
  workflow_dispatch:

permissions:
  contents: write

# Only the latest push matters — a run superseded by a newer one on main
# would just force-push the same branch again a moment later. Safe to cancel
# because nothing is pushed until the very last step; a killed run simply
# leaves the branch at its previous snapshot.
concurrency:
  group: publish-marp-kit
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build dist/marp-kit
        run: npm run build
      - name: Publish to the orphan dist-marp-kit branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH=dist-marp-kit
          SHA="${GITHUB_SHA:0:7}"
          work="$(mktemp -d)"
          cd "$work"
          git init -q
          git checkout -q --orphan "$BRANCH"
          cp -r "$GITHUB_WORKSPACE"/dist/marp-kit/. .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "chore(marp-kit): publish from main @ ${SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -q --force origin "HEAD:${BRANCH}"
          echo "published $(git ls-files | wc -l) files to ${BRANCH}"
