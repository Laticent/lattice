name: Release (prepare)

# Phase 1 of 2. Cuts the release COMMIT on a branch and offers it as a PR.
#
# Why not straight to main: the "Main Merge Queue" ruleset requires a pull
# request, the merge queue, and a green `ci` — nobody pushes main directly,
# bot or human (issue #1439). So a release lands like every other change:
# reviewed, queued, and re-tested on the exact tree that merges. The tag is
# cut afterwards by release-publish.yml, on the squashed commit main actually
# got — tagging here would name a commit the queue is about to rewrite.
#
# The bump level is derived deterministically from the CHANGELOG `## Unreleased`
# section (tools/changelog.js) unless overridden. See RELEASE.md.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump (auto = read from CHANGELOG ## Unreleased)'
        type: choice
        default: auto
        options: [auto, patch, minor, major]

# A release mutates shared state (version bump, changelog roll, dist rebuild).
# Never run two concurrently — a racing dispatch or retry could double-cut.
# cancel-in-progress: false so an in-flight release finishes rather than being
# torn down mid-commit.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write       # push the release branch
  pull-requests: write  # open the release PR

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history + tags for archive + versioning
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fast gate, so an obviously broken release never becomes a PR. The full
      # tier runs on the PR itself, and again in the merge queue.
      - name: Lint + unit + build gate
        run: |
          npm run lint
          npm test
          npm run build:check

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Cut the release commit
        id: cut
        run: node tools/release.js --prepare --bump=${{ inputs.bump }} --skip-checks

      - name: Push the release branch
        env:
          V: ${{ steps.cut.outputs.version }}
        run: |
          set -euo pipefail
          git switch -c "release/v$V"
          git push -u origin "release/v$V"

      # Opening the PR needs a token that is NOT GITHUB_TOKEN: GitHub's
      # recursion guard suppresses workflow runs for events raised by the
      # repo token, so a GITHUB_TOKEN-opened PR would never get the required
      # `ci` check and could never merge. With RELEASE_PAT set the PR opens
      # itself; without it the branch is up and a human opens the PR in one
      # click — which is a normal user event, so CI runs.
      - name: Open the release PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          V: ${{ steps.cut.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          URL="https://github.com/$REPO/compare/main...release/v$V?expand=1"
          if [ -z "${GH_TOKEN:-}" ]; then
            # A notice alone is easy to miss on a run that otherwise reads
            # green, and the release stalls until someone opens the PR.
            echo "::notice::RELEASE_PAT is not set — open the PR yourself to start CI: $URL"
            {
              echo "### v$V is cut, but the PR is not open"
              echo
              echo "\`RELEASE_PAT\` is not set, so this run pushed the branch only —"
              echo "a PR opened with \`GITHUB_TOKEN\` would never receive the required \`ci\` check."
              echo
              echo "**[Open the release PR]($URL)** to start CI, then approve + enable auto-merge."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cat > /tmp/release-pr-body.md <<EOF
          Cuts v$V. Generated by the **Release (prepare)** workflow — review the version, the rolled changelog section, and the \`dist/\` rebuild, then approve and enable auto-merge (squash).

          ## Problem / Why

          Time to ship v$V. The bump is derived from \`CHANGELOG.md\` \`## Unreleased\` by \`tools/changelog.js\`.

          ## What changed

          - \`package.json\` + \`package-lock.json\` — version bumped to $V.
          - \`CHANGELOG.md\` — \`## Unreleased\` rolled into a dated \`## $V\` section, fresh empty Unreleased seeded above it.
          - \`dist/\` — rebuilt (the emulator bundle inlines \`package.json\`, so the bump restales it).

          ## Tests

          \`npm run lint\`, \`npm test\` and \`npm run build:check\` ran before the commit was cut; the full CI tier runs on this PR and again in the merge queue.

          ## Caveats / not verified

          The tag, release zip, GitHub Release and npm publish are **not** part of this PR — \`release-publish.yml\` does all four once this merges, against the squashed commit on main.
          EOF
          gh pr create --base main --head "release/v$V" \
            --title "release: v$V" --body-file /tmp/release-pr-body.md
