name: Release (prepare)

# Phase 1 of 2. Cuts the release COMMIT on a branch, opens it as a PR, and
# turns auto-merge on so the queue lands it unattended.
#
# Why not straight to main: the "Main Merge Queue" ruleset requires a pull
# request, the merge queue, and a green `ci` — nobody pushes main directly,
# bot or human (issue #1439). So a release lands like every other change:
# queued, and re-tested on the exact tree that merges. The tag is cut
# afterwards by release-publish.yml, on the squashed commit main actually
# got — tagging here would name a commit the queue is about to rewrite.
#
# THE HUMAN GATE IS THE DISPATCH, not a PR approval. Dispatching this workflow
# IS the authorization to ship; from there the release is unattended. Nothing
# else in the repo merges without a human — see CLAUDE.md rule 7.
#
# Changesets picks the versions: each pending `.changeset/*.md` names its packages
# and their bumps, and `changeset version` applies them (tools/release.js
# --prepare). A pending `changelog.d/` fragment is converted into an engine
# changeset first, so a PR that wrote one needs no change. The first release
# (1.0.0) bumps nothing: it ships the engine at 1.0.0 and each library at 0.1.0.
# See RELEASE.md and engineering/decisions/2026-10-07-first-npm-release.md §11.
on:
  workflow_dispatch:

# A release mutates shared state (version bump, changelog roll, dist rebuild).
# Never run two concurrently — a racing dispatch or retry could double-cut.
# cancel-in-progress: false so an in-flight release finishes rather than being
# torn down mid-commit.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write       # push the release branch
  pull-requests: write  # open the release PR

jobs:
  prepare:
    runs-on: ubuntu-24.04
    # AUTOMATION_PAT lives here rather than in the repo secrets, and the
    # environment only admits `main` — so a PR branch can't read it. Dispatching
    # this workflow from any other ref fails on the environment rule, which is
    # correct: a release is cut from main. See
    # engineering/workflow.md § Automation vs. the main ruleset.
    environment: automation
    steps:
      # `persist-credentials: false` for the same reason sync-backlog.yml carries it,
      # and this one is LATENT rather than active — which is why it is worth fixing
      # before it fires. `actions/checkout` otherwise writes the job's GITHUB_TOKEN into
      # git config as an Authorization extraheader, and that header OVERRIDES the
      # `x-access-token:${AUTOMATION_PAT}` credentials in the push URL below. The PAT is
      # used deliberately: a `push` or `pull_request` event raised by the repo token
      # starts no workflow run, so the required `ci` check would never report and the
      # release PR could never merge.
      #
      # Today it works anyway, for a reason that is pure luck: a release always cuts a
      # FRESH `release/<name>` branch, so the PR's first event is the `opened` raised by
      # `gh pr create` — which goes over REST with the PAT and is correctly attributed.
      # The moment a release PR needs an UPDATE push to an existing branch, the
      # `synchronize` would be bot-attributed and the release would freeze exactly as
      # the backlog mirror did for three weeks.
      #
      # Safe here: the only git operations after checkout are `git config`, a local
      # `git switch -c`, and the explicit-credential push. Nothing needs ambient auth.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0          # full history + tags for archive + versioning
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # zsh for test/unit/cli/completion.test.js, which drives a real interactive zsh and, in CI, fails
      # rather than skips without one; `npm test` below runs it. Same step as ci.yml's unit job.
      - name: Install zsh (the completion tests drive a real zsh)
        uses: ./.github/actions/apt-cached
        with:
          packages: zsh

      # Fast gate, so an obviously broken release never becomes a PR. The full
      # tier runs on the PR itself, and again in the merge queue.
      - name: Lint + unit + build gate
        run: |
          npm run lint
          npm test
          npm run build:check

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Asks npm whether the engine's version is published (that is how it tells the first
      # release from a later one), so it needs the network; tags come from the checkout above.
      - name: Cut the release commit
        id: cut
        run: node tools/release.js --prepare --skip-checks

      # Everything below runs as the PAT, not GITHUB_TOKEN: GitHub suppresses
      # workflow runs for events raised by the repo token, so a branch pushed
      # or a PR opened with it would never start `ci`. The required check would
      # never appear and the release would sit unmergeable forever.
      - name: Open the release PR, and let the queue land it
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT }}
          V: ${{ steps.cut.outputs.version }}
          NAME: ${{ steps.cut.outputs.name }}
          BRANCH: ${{ steps.cut.outputs.branch }}
          NEEDS_REVIEW: ${{ steps.cut.outputs.needs_review }}
          MAJORS: ${{ steps.cut.outputs.majors }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::release: the AUTOMATION_PAT secret is not set. The release reaches main by PR, and a PR opened with the built-in GITHUB_TOKEN never starts CI — so it could never merge. See RELEASE.md § Prerequisites."
            exit 1
          fi
          git switch -c "$BRANCH"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" \
            "HEAD:refs/heads/$BRANCH"
          cat > /tmp/release-pr-body.md <<EOF
          Cuts $NAME (engine $V). Generated by the **Release (prepare)** workflow, which someone dispatched deliberately — that dispatch was the authorization, so this **auto-merges** once \`ci\` is green, unless a package crosses a major version (a comment on this PR then says so, and a human merges). To stop it, disable auto-merge or close this PR before the queue takes it.

          ## Problem / Why

          Time to ship $NAME. Each pending changeset named its packages and bumps; \`tools/release.js --prepare\` converted any pending \`changelog.d/\` fragment into an engine changeset, then ran \`changeset version\`. For the first release (1.0.0) nothing is bumped and the pending entries are archived instead.

          ## What changed

          - Each released package's \`package.json\` and \`CHANGELOG.md\`, plus \`package-lock.json\`: versions bumped, one changelog section each.
          - \`.changeset/\` and \`changelog.d/\`: the entries this release consumed, deleted (archived into \`changelog/pre-release-archive.md\` on the first release).

          ## Tests

          \`npm run lint\`, \`npm test\` and \`npm run build:check\` ran before the commit was cut; the full CI tier runs on this PR and again in the merge queue.

          ## Caveats / not verified

          The npm publish, the tags, the release zip and the GitHub Release are **not** part of this PR. \`release-publish.yml\` does all four once this merges, against the squashed commit on main.
          EOF
          gh pr create --base main --head "$BRANCH" \
            --title "release: $NAME" --body-file /tmp/release-pr-body.md
          # With a merge queue, --auto queues the PR the moment `ci` is green.
          # release-publish.yml takes over from the resulting push to main.
          # A major bump (or a 0.x library reaching 1.0.0) is a promise to every user, so that PR waits for a
          # human merge instead of auto-merging. tools/release.js sets needs_review when the versions it wrote
          # cross one; the comment names each crossing.
          if [ "${NEEDS_REVIEW:-false}" = "true" ]; then
            gh pr comment "$BRANCH" --body "Auto-merge is OFF: this release crosses a major version (${MAJORS}). A human merges it after checking each one is meant."
          else
            gh pr merge "$BRANCH" --auto --squash
          fi
