name: Studio E2E nightly (playwright)

# NIGHTLY real-browser E2E for the Studio (`/studio/`) + the consolidated
# playground paint check. Per the gate-strategy framework
# (engineering/decisions/2026-06-13-gate-strategy-change-detection.md) and the
# experience-gating doc (2026-06-28), a browser-dependent suite that needs a
# built site + Chromium belongs OFF the PR critical path — it runs nightly on
# `main`, like perf-nightly.yml and preview-e2e-nightly.yml. Promote a stable,
# fast subset to PR-blocking only after an observed green streak.
#
# Browser provisioning: `@playwright/test`'s pinned version IS the browser pin
# (1.56.1 ↔ Chromium build 1194). `playwright install` fetches exactly that, so
# `toHaveScreenshot`-style comparisons would be reproducible. The Studio reads the
# committed `dist/docs/components.json` at build time, so no root BUILD is needed —
# but the root DEPENDENCIES are, because the site imports engine modules from lib/
# that resolve their own imports out of <root>/node_modules (#1498). Those are two
# different things, and reading the first as covering the second is what left this
# suite running zero tests for four nights.

on:
  schedule:
    - cron: '41 4 * * *' # daily 04:41 UTC — between preview-e2e (04:23) and perf (05:37)
  workflow_dispatch:

permissions:
  contents: read
  issues: write # open / append the rolling tracking issue

concurrency:
  group: studio-e2e-nightly
  cancel-in-progress: false

jobs:
  e2e:
    # RESTORED. `runs-on` was dropped by #1500 (5e9deb3), whose diff replaced the
    # `runs-on: ubuntu-latest` + `timeout-minutes: 30` pair with the comment below and
    # `timeout-minutes: 60` — and did not put `runs-on` back. A job without it fails
    # workflow VALIDATION, so since that merge this file has not been loadable: every
    # run is a startup failure with ZERO jobs, and the run is named after the file path
    # rather than the workflow. The cron cannot fire, and neither job below has run.
    # Nothing catches this, because no workflow lints workflows and this one has no
    # pull_request trigger.
    runs-on: ubuntu-latest
    # 60, not 30. This ceiling is OURS, not GitHub's (a hosted job may run 360
    # minutes), and 30 was set when the suite fit it: the last run that actually
    # executed before the blackout took 20m02s of test time (2026-08-03). The
    # suite has grown a week of specs since, and the first restored run came back
    # up against the old ceiling with little room left — a suite killed mid-flight
    # reports as an ordinary red and tells you nothing, which is the exact failure
    # mode #1498 was about. Headroom is cheap on a nightly; a truncated signal is
    # not. Note the webServer also builds the site inside this budget (up to the
    # 300s webServer.timeout in playwright.config.ts) before a single test runs.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            docs/package-lock.json

      # Install ROOT deps too, not just docs/. playwright.config.ts's webServer
      # builds the real site, and the site imports engine code from lib/ — today
      # lib/core/boundary-parser.mjs, which imports `markdown-it`. Node resolves
      # that from the IMPORTER's directory upward (lib/core/ → lib/node_modules →
      # <root>/node_modules) and never looks in docs/node_modules, so having
      # markdown-it in docs/package.json does not satisfy it. Without this step the
      # webServer exits 1 with ERR_MODULE_NOT_FOUND and the suite runs ZERO tests
      # while still reporting as a normal red — see #1498. Mirrors docs.yml.
      - name: Install root deps (engine deps the docs build imports)
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'

      - name: Install docs deps
        run: npm ci
        working-directory: docs

      # WebKit is REQUIRED, not optional: the `webkit-phone` (#1226) and `webkit-tablet`
      # (#1227) projects in playwright.config.ts both need it, and without it here they
      # error out instead of guarding anything. Both cover behavior Chromium cannot express
      # — history-traversal timing, and a stretched flex item's cross size — which is
      # exactly how each defect passed a Chromium-only suite and still shipped broken to a
      # device. Both are grep-scoped to their own tag, so this buys a second engine for a
      # handful of oracles, not a second full suite.
      - name: Install Playwright browsers (pinned to @playwright/test)
        run: npx playwright install --with-deps chromium webkit firefox
        working-directory: docs

      # playwright.config.ts's webServer builds (without the slow showcase:check)
      # then previews the production site, and the suite drives it across the
      # desktop / tablet / mobile projects. trace + video are on, so the artifacts
      # below are a full RPA-style record of every run.
      # @perf IS EXCLUDED, and it was not before. The `desktop` project only greps out
      # @mobile|@webkit, so studio-preview-perf.spec.ts has always run here — harmless while it
      # merely printed numbers, but it now carries wall-clock ceiling assertions. Leaving it in
      # would run the throttled suite (plus a full site build) twice a night on two runners, and a
      # breach would red THIS workflow — which files no issue — an hour before perf-nightly.yml,
      # which does. The perf axis belongs to the job that can raise the alarm.
      # The suite exits non-zero on a failure. Capture the verdict into an output and keep
      # the STEP green so the artifact upload + issue steps below always run and key off
      # `failed` — the shape perf-nightly, preview-e2e-nightly and integration-nightly all
      # use. `pipefail` is load-bearing: without it `tee` would swallow a non-zero exit and
      # every run would report success.
      #
      # The STEP timeout is deliberately BELOW the job's 60. A job-level timeout kills the
      # job outright and no later step runs — not even one guarded by always() — so the
      # "suite killed mid-flight" case (#1498's failure mode) would file nothing at all.
      # Failing the STEP instead leaves the job alive to raise the alarm.
      - name: Run Studio E2E
        id: e2e
        timeout-minutes: 45
        run: |
          set -uo pipefail
          if npm run test:e2e -- --grep-invert @perf 2>&1 | tee "$GITHUB_WORKSPACE/studio-e2e-report.txt"; then
            echo "failed=false" >> "$GITHUB_OUTPUT"
          else
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi
        working-directory: docs
        env:
          CI: 'true'

      - name: Upload Playwright report + trace/video artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-e2e-${{ github.run_id }}
          path: |
            docs/playwright-report/**
            docs/test-results/**
          if-no-files-found: warn
          retention-days: 14

      # Open or append ONE rolling tracking issue. This is the half of #1498 that was never
      # built: the root-deps fix (#1500) made the suite able to run, but a nightly that
      # cannot raise an alarm still communicates only through a red X on a scheduled run
      # nobody is paged for. perf, preview-e2e, integration and modulepreload-coverage all
      # file; this one was the outlier.
      #
      # `always()` plus an outcome check, not just the output: the run step exits 0 by
      # design when specs fail, so `failed` catches that — but a STEP timeout leaves the
      # output unwritten, and that is the case most worth hearing about.
      - name: Open / append regression issue
        if: always() && (steps.e2e.outputs.failed == 'true' || steps.e2e.outcome != 'success')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TITLE='[studio-e2e] Studio E2E suite failing on main'
          REPORT="$GITHUB_WORKSPACE/studio-e2e-report.txt"
          BODY="$GITHUB_WORKSPACE/studio-e2e-body.md"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          [ -f "$REPORT" ] || echo '(the run step produced no report — it was killed before writing one)' > "$REPORT"
          {
            echo "The nightly Studio E2E suite failed on \`main@${{ github.sha }}\` (step outcome: ${{ steps.e2e.outcome }})."
            echo ""
            echo "What failed (full report + trace/video in the run's artifact):"
            echo ""
            echo '```'
            # Matches the never-started case explicitly, not just spec-failure lines: a grep
            # tuned only to failures produces an EMPTY report for a webServer that never
            # booted, which is the most severe outcome available.
            #
            # CLAMPED. A broken shared selector across the 240-spec matrix yields hundreds of
            # matched lines at ~350 bytes each; GitHub rejects a body over 65,536 chars with a
            # 422, `set -e` fails the step, and the alarm is lost in exactly the loudest case.
            grep -E '^\s+[0-9]+\) |✘|webServer was not able to start|ERR_MODULE_NOT_FOUND|[0-9]+ failed|[0-9]+ passed' \
              "$REPORT" 2>/dev/null | head -c 20000 || echo '(no test markers — the suite likely never started; see the tail below)'
            echo '```'
            echo ""
            echo "<details><summary>Last 120 lines</summary>"
            echo ""
            echo '```'
            tail -n 120 "$REPORT" 2>/dev/null | head -c 20000 || true
            echo '```'
            echo "</details>"
            echo ""
            echo "_Run: ${RUN_URL}._"
          } > "$BODY"
          # Find the rolling issue by EXACT title, client-side. `--search "in:title [studio-e2e]"`
          # looks right and is not: GitHub tokenizes on the brackets and the hyphen, so the query
          # degrades to `studio` + `e2e` and matches human-authored issues (#1507, #1514 both
          # qualify today). `.[0]` would then take someone else's issue and append to it nightly,
          # and the rolling issue would never be created. The siblings all carry this latent bug;
          # their markers just do not collide yet.
          # --limit is deliberately far above the open-issue count (161 at time of writing).
          # gh paginates to reach it; a limit that the backlog can outgrow would make the
          # lookup silently miss the rolling issue and file a fresh duplicate every night —
          # the same shape of quiet failure this whole workflow change is about.
          ISSUE=$(gh issue list --state open --limit 1000 --json number,title,author \
            --jq "[.[] | select(.title == \"$TITLE\") | select(.author.is_bot == true and (.author.login == \"app/github-actions\" or .author.login == \"github-actions\" or .author.login == \"github-actions[bot]\"))][0].number" || true)
          if [ -n "${ISSUE:-}" ] && [ "$ISSUE" != "null" ]; then
            gh issue comment "$ISSUE" --body-file "$BODY"
            echo "Appended to issue #$ISSUE"
          else
            gh issue create --title "$TITLE" \
              --label "area:infra" --label "type:fix" \
              --label "priority:high" --label "status:backlog" \
              --body-file "$BODY"
          fi

      # STAND THE ALARM DOWN when the suite passes again. A rolling issue that only ever
      # opens is a one-way ratchet: after its first firing it reads as "the flaky nightly",
      # and a real regression months later arrives as a comment on a thread nobody reopens.
      # Until an alarm can close itself, neither its run color nor its issue is
      # falsifiable.
      #
      # THREE conditions, and every one of them is load-bearing:
      #
      # 1. `outcome == 'success'`, not the output alone. A bare output test — and `!= 'true'`
      #    especially — IS TRUE FOR THE EMPTY STRING, and the output is empty in every state
      #    where nothing was measured: the step timeout this job deliberately sets below the
      #    job's, a cancellation, an install that died first. Closing there would comment
      #    "recovered" about a suite that never ran — NOT MEASURED reported as health, this
      #    family's cardinal sin (perf-nightly.yml records four instances of it).
      # 2. `failed == 'false'`, the run step's own verdict.
      # 3. THE REPORT MUST SHOW TESTS THAT ACTUALLY PASSED. This is the condition the first
      #    two cannot supply, and it is the whole reason a keyless night must not close
      #    anything: `ai-architect.spec.ts` opens with `test.skip(!LIVE_KEY, …)`, so with the
      #    secret unset Playwright skips every test, prints "N skipped", and EXITS 0 — steps
      #    1 and 2 both hold while nothing whatsoever was tested. The deterministic `e2e` job
      #    carries the identical guard: it is one bad `--grep`, one renamed project or one
      #    empty spec glob away from the same vacuous green, and a suite that ran zero tests
      #    is not evidence that a regression is fixed. `[1-9][0-9]*` rather than `[0-9]+`, so
      #    a literal "0 passed" cannot satisfy it.
      #
      # AND IT COMMENTS RATHER THAN CLOSING. The suite is not scored against this commit
      # alone: `docs/e2e/visual.spec.ts` asserts `toHaveScreenshot` against the committed
      # baselines in `docs/e2e/visual.spec.ts-snapshots`, and blessing those turns the specs
      # green without fixing anything. So a green night means "the suite matches its
      # baselines", which is a different claim from "the regression is fixed", and the two
      # are indistinguishable from inside the run. `retries: 1` in CI adds a second reason:
      # a spec that fails and passes on retry reports `1 flaky` alongside the pass count and
      # still exits 0 — and an intermittent failure is exactly what a rolling issue is most
      # likely to be tracking, so it would open and close on alternate nights.
      #
      # A first cut of this step called the suite ABSOLUTE and closed. Commenting is not a
      # consolation prize: the ratchet was never really "it does not close", it was "nothing
      # ever argues the other side". A comment naming the run and the pass count is the
      # counter-evidence a human needs to make the call the run cannot.
      - name: Report a passing suite on the rolling issue
        if: always() && steps.e2e.outcome == 'success' && steps.e2e.outputs.failed == 'false' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          TITLE='[studio-e2e] Studio E2E suite failing on main'
          REPORT="$GITHUB_WORKSPACE/studio-e2e-report.txt"
          # Condition 3, guarded on the file existing as well — a missing report is the
          # killed-before-writing case the filing step above calls out, and an absent file
          # must never read as a pass.
          if [ ! -f "$REPORT" ] || ! grep -qE '[1-9][0-9]* passed' "$REPORT"; then
            echo "No passing tests in the report — nothing was proved; leaving any open thread alone."
            exit 0
          fi
          # The IDENTICAL exact-title lookup the filing step above uses, for the reason
          # documented there. Two different searches is how a stand-down closes a thread
          # nobody was appending to while the live one stays open.
          ISSUE=$(gh issue list --state open --limit 1000 --json number,title,author \
            --jq "[.[] | select(.title == \"$TITLE\") | select(.author.is_bot == true and (.author.login == \"app/github-actions\" or .author.login == \"github-actions\" or .author.login == \"github-actions[bot]\"))][0].number" || true)
          [ -n "${ISSUE:-}" ] && [ "$ISSUE" != "null" ] || exit 0
          PASSED=$(grep -oE '[1-9][0-9]* passed' "$REPORT" | tail -n 1)
          # Comment BEFORE closing, naming the run AND the pass count that proved it. A silent
          # close leaves the next reader unable to tell a recovered alarm from a triaged-away
          # one, and the count is what says the green was measured rather than vacuous.
          # `--body-file`, not an inline multi-line `--body`: a continuation line would have to
          # start at column 0 to avoid leading spaces in the issue text, and a column-0 line
          # ENDS the `run: |` block scalar — the workflow then parses as something else.
          {
            echo "Measured green on \`main@${{ github.sha }}\`: the deterministic Studio E2E suite passed (${PASSED})."
            echo ""
            echo "**Left open deliberately.** Part of this suite asserts screenshots against committed baselines, and CI retries a failing spec once — so a green night cannot distinguish a fix from a blessed baseline or a flaky spec that passed on its second try. Check which happened and close by hand; a recurrence appends here."
            echo ""
            echo "_Proved by run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}._"
          } > "$GITHUB_WORKSPACE/stand-down.md"
          gh issue comment "$ISSUE" --body-file "$GITHUB_WORKSPACE/stand-down.md" || true

  # The AI-assisted scenario tier (docs/e2e/scenarios/ai-architect.spec.ts):
  # drives the Architect against a LIVE OpenRouter model and asserts a real
  # productivity outcome (source changed + checkpoint saved). A separate job so
  # a paid-API flake can never redden the deterministic suite above. Gated on
  # the OPEN_ROUTER_KEY secret — when it is unset the spec self-skips with a
  # reason and this job stays green. Cost: three Haiku-tier completions over a
  # two-slide deck (~a cent a night); the Studio's own hard-stop budget cap is
  # armed by the spec as the runaway guard. The spec disables trace + video so
  # the key never reaches an uploaded artifact.
  e2e-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            docs/package-lock.json

      # Same reason as the e2e job above — the webServer needs the root deps (#1498).
      - name: Install root deps (engine deps the docs build imports)
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'

      - name: Install docs deps
        run: npm ci
        working-directory: docs

      - name: Install Playwright browser (pinned to @playwright/test)
        run: npx playwright install --with-deps chromium
        working-directory: docs

      # Same shape as the `e2e` job's run step: `tee` the output to a report file, keep the
      # STEP green on a spec failure so the alarm below always gets to run, and carry the
      # verdict in an output. `pipefail` is load-bearing — without it `tee` swallows the
      # non-zero exit and every run reports success.
      #
      # The STEP timeout is deliberately BELOW the job's 30. A job-level timeout kills the job
      # outright and no later step runs, not even one guarded by always(), so a suite killed
      # mid-flight would file nothing — the exact case #1743 is about.
      - name: Run AI-assisted Studio scenarios (live OpenRouter)
        id: ai
        timeout-minutes: 25
        run: |
          set -uo pipefail
          if npm run test:e2e -- e2e/scenarios/ai-architect.spec.ts --project=desktop 2>&1 \
            | tee "$GITHUB_WORKSPACE/studio-e2e-ai-report.txt"; then
            echo "failed=false" >> "$GITHUB_OUTPUT"
          else
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi
        working-directory: docs
        env:
          CI: 'true'
          OPEN_ROUTER_KEY: ${{ secrets.OPEN_ROUTER_KEY }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-e2e-ai-${{ github.run_id }}
          path: docs/playwright-report/**
          if-no-files-found: warn
          retention-days: 14

      # Open / append ONE rolling tracking issue — the half of #1743 that was missing. This
      # job was the only member of the nightly family (perf, preview-e2e, integration,
      # modulepreload-coverage, and its own `e2e` sibling all file) with no alarm, so when it
      # failed eight nights running the workflow's red X was the only signal and nobody was
      # paged for it.
      #
      # A SEPARATE rolling title from the `e2e` sibling, on purpose: this tier fails for its
      # own reasons (a live model, a paid key, a priced-branch label) and folding it into the
      # deterministic suite's issue would bury a real spec regression under API weather.
      #
      # `always()` plus an outcome check, not just the output: the run step exits 0 by design
      # when specs fail, so `failed` catches that — but a STEP timeout leaves the output
      # unwritten, and that is the case most worth hearing about.
      - name: Open / append regression issue
        if: always() && (steps.ai.outputs.failed == 'true' || steps.ai.outcome != 'success')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPEN_ROUTER_KEY: ${{ secrets.OPEN_ROUTER_KEY }}
        run: |
          set -euo pipefail
          TITLE='[studio-e2e-ai] Live AI Studio scenarios failing on main'
          REPORT="$GITHUB_WORKSPACE/studio-e2e-ai-report.txt"
          BODY="$GITHUB_WORKSPACE/studio-e2e-ai-body.md"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          [ -f "$REPORT" ] || echo '(the run step produced no report — it was killed before writing one)' > "$REPORT"

          # REDACT THE KEY BEFORE ANY OF THIS REACHES AN ISSUE BODY. Actions masks secrets in
          # the LOG, but `tee` wrote the report to disk unmasked and `gh issue create` posts
          # that text verbatim — so a single echoed Authorization header would publish our
          # OpenRouter key (HARD RULE #24). Literal string replacement via python, not `sed`:
          # the key never appears in argv (visible to `ps`), and no character in it is treated
          # as a regex metacharacter. A no-op when the secret is unset — which is also why the
          # empty-key guard matters, since replacing '' would rewrite every position.
          python3 - "$REPORT" <<'PY'
          import os, sys
          key = os.environ.get('OPEN_ROUTER_KEY', '')
          path = sys.argv[1]
          text = open(path, encoding='utf-8', errors='replace').read()
          if key:
              text = text.replace(key, '***')
          open(path, 'w', encoding='utf-8').write(text)
          PY

          {
            echo "The nightly live-AI Studio scenarios failed on \`main@${{ github.sha }}\` (step outcome: ${{ steps.ai.outcome }})."
            echo ""
            echo "This tier drives a REAL OpenRouter model on our key, so triage it in this order:"
            echo "1. Is it a spec/product regression? The failing locator and its call log are below."
            echo "2. Is it the model or the API? A timeout waiting for a diff card, or a 4xx/5xx, points here."
            echo "3. Is the key unset or out of budget? Then the run reports **skipped**, not failed — the tally below says which."
            echo ""
            echo "What failed (full report in the run's artifact):"
            echo ""
            echo '```'
            # `skipped` is in the pattern deliberately: a keyless run self-skips and stays
            # green, so if this alarm ever fires on a run whose tally is all-skipped, the
            # cause is the harness, not a spec.
            grep -E '^\s+[0-9]+\) |✘|webServer was not able to start|ERR_MODULE_NOT_FOUND|[0-9]+ (failed|passed|skipped)' \
              "$REPORT" 2>/dev/null | head -c 20000 || echo '(no test markers — the suite likely never started; see the tail below)'
            echo '```'
            echo ""
            echo "<details><summary>Last 120 lines</summary>"
            echo ""
            echo '```'
            tail -n 120 "$REPORT" 2>/dev/null | head -c 20000 || true
            echo '```'
            echo "</details>"
            echo ""
            echo "_Run: ${RUN_URL}._"
          } > "$BODY"
          # Find the rolling issue by EXACT title, client-side — `--search "in:title [studio-e2e-ai]"`
          # looks right and is not: GitHub tokenizes on the brackets and the hyphens, so the query
          # degrades to `studio` + `e2e` + `ai` and matches human-authored issues. `.[0]` would then
          # append to someone else's issue nightly and the rolling issue would never be created.
          # --limit is deliberately far above the open-issue count; gh paginates to reach it, and a
          # limit the backlog can outgrow would file a fresh duplicate every night.
          ISSUE=$(gh issue list --state open --limit 1000 --json number,title,author \
            --jq "[.[] | select(.title == \"$TITLE\") | select(.author.is_bot == true and (.author.login == \"app/github-actions\" or .author.login == \"github-actions\" or .author.login == \"github-actions[bot]\"))][0].number" || true)
          if [ -n "${ISSUE:-}" ] && [ "$ISSUE" != "null" ]; then
            gh issue comment "$ISSUE" --body-file "$BODY"
            echo "Appended to issue #$ISSUE"
          else
            gh issue create --title "$TITLE" \
              --label "area:infra" --label "type:fix" \
              --label "priority:high" --label "status:backlog" \
              --body-file "$BODY"
          fi

      # STAND THE ALARM DOWN when the suite passes again. A rolling issue that only ever
      # opens is a one-way ratchet: after its first firing it reads as "the flaky nightly",
      # and a real regression months later arrives as a comment on a thread nobody reopens.
      # Until an alarm can close itself, neither its run color nor its issue is
      # falsifiable.
      #
      # THREE conditions, and every one of them is load-bearing:
      #
      # 1. `outcome == 'success'`, not the output alone. A bare output test — and `!= 'true'`
      #    especially — IS TRUE FOR THE EMPTY STRING, and the output is empty in every state
      #    where nothing was measured: the step timeout this job deliberately sets below the
      #    job's, a cancellation, an install that died first. Closing there would comment
      #    "recovered" about a suite that never ran — NOT MEASURED reported as health, this
      #    family's cardinal sin (perf-nightly.yml records four instances of it).
      # 2. `failed == 'false'`, the run step's own verdict.
      # 3. THE REPORT MUST SHOW TESTS THAT ACTUALLY PASSED. This is the condition the first
      #    two cannot supply, and it is the whole reason a keyless night must not close
      #    anything: `ai-architect.spec.ts` opens with `test.skip(!LIVE_KEY, …)`, so with the
      #    secret unset Playwright skips every test, prints "N skipped", and EXITS 0 — steps
      #    1 and 2 both hold while nothing whatsoever was tested. The deterministic `e2e` job
      #    carries the identical guard: it is one bad `--grep`, one renamed project or one
      #    empty spec glob away from the same vacuous green, and a suite that ran zero tests
      #    is not evidence that a regression is fixed. `[1-9][0-9]*` rather than `[0-9]+`, so
      #    a literal "0 passed" cannot satisfy it.
      #
      # AND IT COMMENTS RATHER THAN CLOSING. The suite is not scored against this commit
      # alone: `docs/e2e/visual.spec.ts` asserts `toHaveScreenshot` against the committed
      # baselines in `docs/e2e/visual.spec.ts-snapshots`, and blessing those turns the specs
      # green without fixing anything. So a green night means "the suite matches its
      # baselines", which is a different claim from "the regression is fixed", and the two
      # are indistinguishable from inside the run. `retries: 1` in CI adds a second reason:
      # a spec that fails and passes on retry reports `1 flaky` alongside the pass count and
      # still exits 0 — and an intermittent failure is exactly what a rolling issue is most
      # likely to be tracking, so it would open and close on alternate nights.
      #
      # A first cut of this step called the suite ABSOLUTE and closed. Commenting is not a
      # consolation prize: the ratchet was never really "it does not close", it was "nothing
      # ever argues the other side". A comment naming the run and the pass count is the
      # counter-evidence a human needs to make the call the run cannot.
      - name: Report passing live scenarios on the rolling issue
        if: always() && steps.ai.outcome == 'success' && steps.ai.outputs.failed == 'false' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          TITLE='[studio-e2e-ai] Live AI Studio scenarios failing on main'
          REPORT="$GITHUB_WORKSPACE/studio-e2e-ai-report.txt"
          # Condition 3, guarded on the file existing as well — a missing report is the
          # killed-before-writing case the filing step above calls out, and an absent file
          # must never read as a pass.
          if [ ! -f "$REPORT" ] || ! grep -qE '[1-9][0-9]* passed' "$REPORT"; then
            echo "No passing tests in the report — nothing was proved; leaving any open thread alone."
            exit 0
          fi
          # The IDENTICAL exact-title lookup the filing step above uses, for the reason
          # documented there. Two different searches is how a stand-down closes a thread
          # nobody was appending to while the live one stays open.
          ISSUE=$(gh issue list --state open --limit 1000 --json number,title,author \
            --jq "[.[] | select(.title == \"$TITLE\") | select(.author.is_bot == true and (.author.login == \"app/github-actions\" or .author.login == \"github-actions\" or .author.login == \"github-actions[bot]\"))][0].number" || true)
          [ -n "${ISSUE:-}" ] && [ "$ISSUE" != "null" ] || exit 0
          PASSED=$(grep -oE '[1-9][0-9]* passed' "$REPORT" | tail -n 1)
          # Comment BEFORE closing, naming the run AND the pass count that proved it. A silent
          # close leaves the next reader unable to tell a recovered alarm from a triaged-away
          # one, and the count is what says the green was measured rather than vacuous.
          # `--body-file`, not an inline multi-line `--body`: a continuation line would have to
          # start at column 0 to avoid leading spaces in the issue text, and a column-0 line
          # ENDS the `run: |` block scalar — the workflow then parses as something else.
          {
            echo "Measured green on \`main@${{ github.sha }}\`: the live AI Studio scenarios passed against a real model (${PASSED}), so the key was present and the specs really ran."
            echo ""
            echo "**Left open deliberately.** This tier drives a live model, so one passing night is weaker evidence than it looks — the same prompt can pass and fail on consecutive runs, and CI retries once. Close by hand once a couple of nights agree; a recurrence appends here."
            echo ""
            echo "_Proved by run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}._"
          } > "$GITHUB_WORKSPACE/stand-down.md"
          gh issue comment "$ISSUE" --body-file "$GITHUB_WORKSPACE/stand-down.md" || true
