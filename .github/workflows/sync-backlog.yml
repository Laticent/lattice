name: Sync backlog mirror

# Regenerate the committed BACKLOG.md mirror whenever the open issue queue
# changes (and daily, as a safety net). One-way: issues → BACKLOG.md, never
# back. The render is pure (no timestamps), so this only commits on a real
# queue change.
#
# NOTE: this pushes BACKLOG.md straight to main, which the "Main Merge Queue"
# ruleset otherwise forbids (PR + merge queue + the `ci` check). That is
# deliberate: routing a generated mirror through the queue would spend a full
# CI run per issue event. It works ONLY because GitHub Actions is a bypass
# actor on that ruleset — a one-time repo setting, not something this file can
# grant itself. Without it every run dies on GH013 (issue #1439). The exact
# setting, and why the release does the opposite, are in
# engineering/workflow.md § Automation vs. the main ruleset.
on:
  issues:
    # State-change events only. Label/assignee churn is deliberately EXCLUDED:
    # the triage/apply-label workflows add labels themselves, so a single new
    # issue used to fan out several near-no-op backlog syncs all contending to
    # push main. BACKLOG.md mirrors title/state/labels/assignees, so the daily
    # cron picks up any label/assignee drift within 24h. See
    # engineering/decisions/2026-06-17-workflow-efficiency-review.md §D.
    types: [opened, edited, deleted, closed, reopened, transferred]
  schedule:
    - cron: '17 6 * * *' # daily 06:17 UTC safety net — also reconciles label/assignee drift
  workflow_dispatch:

permissions:
  contents: write # commit BACKLOG.md
  issues: read

concurrency:
  group: sync-backlog
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Capture open issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue list --state open --limit 1000 \
            --json number,title,labels,assignees,url,state > .scratch-issues.json
      - name: Regenerate BACKLOG.md
        run: node tools/sync-backlog.js --input .scratch-issues.json && rm -f .scratch-issues.json
      - name: Commit if changed
        run: |
          set -euo pipefail
          if git diff --quiet -- BACKLOG.md; then
            echo "BACKLOG.md unchanged — nothing to commit."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BACKLOG.md
          git commit -m 'chore(backlog): sync BACKLOG.md to open issues'
          # A rejected push has two causes that need OPPOSITE responses:
          #
          #   * a RACE — a human or another workflow pushed to main between
          #     checkout and push (the concurrency group only serializes this
          #     workflow against itself). Rebase the single backlog commit and
          #     retry, like the golden-diff job in ci.yml.
          #   * a RULE VIOLATION (GH013) — the ruleset refused the push. No
          #     amount of rebasing changes that verdict, so retrying just burns
          #     30s and buries the real cause under three identical rejections
          #     (issue #1439). Fail fast, and name the fix.
          log="$(mktemp)"
          for i in 1 2 3; do
            if git push 2>&1 | tee "$log"; then exit 0; fi
            if grep -q 'GH013\|repository rule violations' "$log"; then
              echo "::error::sync-backlog: main's ruleset rejected the push (GH013). This is a settings gap, not a race — retrying cannot fix it. Grant GitHub Actions (integration id 15368) bypass on the 'Main Merge Queue' ruleset; see engineering/workflow.md § Automation vs. the main ruleset."
              exit 1
            fi
            echo "push rejected — rebasing on origin/main and retrying ($i)"
            git fetch -q origin main && git rebase origin/main || { git rebase --abort || true; }
            sleep $((i * 3))
          done
          echo "::error::sync-backlog: push to main failed after 3 rebase-and-retry rounds — main is moving faster than the sync can land."
          exit 1
