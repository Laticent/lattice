name: Sync backlog mirror

# Regenerate the committed BACKLOG.md mirror whenever the open issue queue
# changes (and daily, as a safety net). One-way: issues → BACKLOG.md, never
# back. The render is pure (no timestamps), so this only acts on a real queue
# change.
#
# It reaches `main` the same way everything else does: a pull request through
# the merge queue. Nothing here pushes `main`, and the "Main Merge Queue"
# ruleset needs no bypass for it (issue #1439). The only thing that makes it
# feel automatic is that the workflow ALSO turns auto-merge on, so the queue
# lands it with no human in the loop — the PR is a generated view of issues a
# human already curated, not a proposal anyone needs to read.
#
# ONE branch, ONE open PR, ever: the branch below is force-pushed to
# `main` + 1 commit each time, so a burst of issue activity updates the PR in
# flight instead of opening a second one. See
# engineering/workflow.md § Automation vs. the main ruleset.
on:
  issues:
    # State-change events only. Label/assignee churn is deliberately EXCLUDED:
    # the triage/apply-label workflows add labels themselves, so a single new
    # issue used to fan out several near-no-op backlog syncs. BACKLOG.md
    # mirrors title/state/labels/assignees, so the daily cron picks up any
    # label/assignee drift within 24h. See
    # engineering/decisions/2026-06-17-workflow-efficiency-review.md §D.
    types: [opened, edited, deleted, closed, reopened, transferred]
  schedule:
    - cron: '17 6 * * *' # daily 06:17 UTC safety net — also reconciles label/assignee drift
  workflow_dispatch:

permissions:
  contents: write # push the sync branch
  issues: read
  pull-requests: write # open the sync PR + enable auto-merge

# Serialize against itself, and never cancel: a run killed between "PR opened"
# and "auto-merge enabled" would leave a PR parked forever with nothing to
# land it.
concurrency:
  group: sync-backlog
  cancel-in-progress: false

env:
  SYNC_BRANCH: chore/backlog-sync

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Capture open issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue list --state open --limit 1000 \
            --json number,title,labels,assignees,url,state > .scratch-issues.json
      - name: Regenerate BACKLOG.md
        run: node tools/sync-backlog.js --input .scratch-issues.json && rm -f .scratch-issues.json

      - name: Open (or update) the sync PR, and let the queue land it
        env:
          # NOT secrets.GITHUB_TOKEN, and this is the whole reason the secret
          # exists: GitHub suppresses workflow runs for events raised by the
          # repo token, so a PR opened — or a branch pushed — with it would
          # never start `ci`. The required check would never appear and the PR
          # would sit unmergeable forever.
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if git diff --quiet -- BACKLOG.md; then
            echo "BACKLOG.md unchanged — nothing to sync."
            exit 0
          fi

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::sync-backlog: the AUTOMATION_PAT secret is not set. The mirror reaches main by PR, and a PR opened with the built-in GITHUB_TOKEN never starts CI — so it could never merge. See engineering/workflow.md § Automation vs. the main ruleset."
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BACKLOG.md
          git commit -m 'chore(backlog): sync BACKLOG.md to open issues'

          # Push as the PAT, not the repo token — a `synchronize` raised by
          # GITHUB_TOKEN is suppressed too, so an UPDATE to an already-open PR
          # would silently skip CI and strand it.
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" \
            "HEAD:refs/heads/${SYNC_BRANCH}"

          # Force-pushing an open PR's head updates it in place, so this only
          # creates one when none is open.
          if [ -z "$(gh pr list --head "$SYNC_BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base main --head "$SYNC_BRANCH" \
              --title 'chore(backlog): sync BACKLOG.md to open issues' \
              --body 'Generated by the **Sync backlog mirror** workflow — the one-way mirror of the open issue queue (`tools/sync-backlog.js`). Issues are the source of truth; this file is the committed snapshot. Auto-merges through the queue; no review needed. See `engineering/workflow.md` § Work queue.'
          else
            echo "sync PR already open — the force-push updated it in place."
          fi

          # With a merge queue, --auto queues the PR the moment `ci` is green.
          # Idempotent: re-enabling on an already-auto-merging PR is a no-op.
          gh pr merge "$SYNC_BRANCH" --auto --squash
