name: Sync backlog mirror

# Regenerate the committed BACKLOG.md mirror whenever the open issue queue
# changes (and daily, as a safety net). One-way: issues → BACKLOG.md, never
# back. The render is pure (no timestamps), so this only commits on a real
# queue change.
#
# NOTE: this pushes BACKLOG.md to main, and `main` NOW HAS A RULESET that forbids
# direct pushes (PR + merge queue required), so the push step currently fails on
# every run — the mirror has not updated since 2026-07-29. The bypass this needs is
# a repository SETTING, not something a workflow edit can grant itself; the commit
# step classifies the rejection and prints the three available fixes rather than
# retrying a push that cannot succeed. Tracked in #1439. See
# engineering/workflow.md § BACKLOG.md — the one-way mirror.
on:
  issues:
    # State-change events only. Label/assignee churn is deliberately EXCLUDED:
    # the triage/apply-label workflows add labels themselves, so a single new
    # issue used to fan out several near-no-op backlog syncs all contending to
    # push main. BACKLOG.md mirrors title/state/labels/assignees, so the daily
    # cron picks up any label/assignee drift within 24h. See
    # engineering/decisions/2026-06-17-workflow-efficiency-review.md §D.
    types: [opened, edited, deleted, closed, reopened, transferred]
  schedule:
    - cron: '17 6 * * *' # daily 06:17 UTC safety net — also reconciles label/assignee drift
  workflow_dispatch:

permissions:
  contents: write # commit BACKLOG.md
  issues: read

concurrency:
  group: sync-backlog
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Capture open issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue list --state open --limit 1000 \
            --json number,title,labels,assignees,url,state > .scratch-issues.json
      - name: Regenerate BACKLOG.md
        run: node tools/sync-backlog.js --input .scratch-issues.json && rm -f .scratch-issues.json
      - name: Commit if changed
        run: |
          set -euo pipefail
          if git diff --quiet -- BACKLOG.md; then
            echo "BACKLOG.md unchanged — nothing to commit."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BACKLOG.md
          git commit -m 'chore(backlog): sync BACKLOG.md to open issues'
          # TWO failure modes, and they need opposite handling — which is the whole
          # point of this block (#1439).
          #
          #   RACE  — a human or another workflow pushed to main between our checkout
          #           and our push. Transient. Rebase the single backlog commit and
          #           retry, like the golden-diff job in ci.yml.
          #   RULE  — a repository ruleset forbids the push outright (GH013: "Changes
          #           must be made through a pull request / the merge queue"). This is
          #           a REPO CONFIGURATION fact, identical on every attempt. Retrying
          #           it is pure waste: three rejections, ~25s of runner time, three
          #           identical log walls, on every single issue event. It is also
          #           what has actually been happening — this workflow has not landed
          #           a commit since 2026-07-29, so BACKLOG.md has been silently wrong
          #           by ~100 issues while the run went red on each one.
          #
          # So: classify, and only retry the one that retrying can fix.
          for i in 1 2 3; do
            if git push 2>/tmp/push-err; then exit 0; fi
            cat /tmp/push-err
            if grep -q 'GH013\|protected branch\|merge queue\|must be made through' /tmp/push-err; then
              {
                echo "### Backlog mirror not updated"
                echo
                echo "\`main\` rejected the push because a repository ruleset requires changes to go"
                echo "through a pull request and the merge queue. That is configuration, not a"
                echo "transient failure, so this job did not retry."
                echo
                echo "**BACKLOG.md is stale until one of these is done** (see \`engineering/workflow.md\`"
                echo "§ BACKLOG.md — the one-way mirror):"
                echo
                echo "1. Add \`github-actions[bot]\` to the ruleset's bypass list — the one-time setting"
                echo "   the board-setup checklist already calls for, and the smallest change."
                echo "2. Give the job a PAT and have it open a PR. Note the catch: a PR opened with the"
                echo "   default \`GITHUB_TOKEN\` does **not** trigger \`pull_request\` workflows, so the"
                echo "   required \`ci\` check never runs and the queue never admits it. This route needs"
                echo "   a real token, not just a rewrite."
                echo "3. Retire the committed mirror and read the queue from GitHub directly."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::error::sync-backlog: main's ruleset forbids a direct push (GH013). Not retryable — see the job summary for the three ways to fix it. Tracked in #1439."
              exit 1
            fi
            echo "push rejected by a RACE — rebasing on origin/main and retrying ($i)"
            git fetch -q origin main && git rebase origin/main || { git rebase --abort || true; }
            sleep $((i * 3))
          done
          echo "::error::sync-backlog: push to main lost the race three times — main is moving unusually fast."
          exit 1
