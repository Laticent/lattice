# Trial publish: publish the engine and its libraries to a throwaway local registry, install
# @laticent/lattice into an empty folder from it, and render a deck with the install
# (tools/trial-publish.js has the steps and why). Every other job runs the engine from the
# repository, where every package is linked; this is the one that sees what a user installs.
#
# When it runs (the owner's choice, 2026-11-23, "targeted + nightly + release"):
#   - on a PR that touches a manifest or the release tooling, the paths below. The release desk
#     measured about 1.3 such PRs a day (38 of 469 commits in the 30 days to 2026-11-23);
#   - nightly on main, so a change that slips past the paths filter is caught within a day;
#   - from release.yml, as a gate before the release PR opens (workflow_call).
# A red run is the signal. It files no issue, so the nightly alarm contract
# (test/unit/tools/nightly-alarm-contract.test.js) does not apply.
#
# Cost, measured locally on 2026-11-23: about 47 s for the trial itself (registry 2.8 s,
# 18 libraries 19.9 s, engine 7.2 s, install 9.4 s, render 6.6 s), after `npm ci` and an
# 87 s build.
name: trial-publish

on:
  pull_request:
    paths:
      - 'package.json'
      - 'packages/**'
      - 'docs/src/lib/*/package.json'
      - 'tools/release.js'
      - 'tools/stage-engine-package.js'
      - 'tools/library-prepack.js'
      - 'tools/build-*-lib.js' # each library's prepack runs its builder
      - '.github/actions/puppeteer-chrome/**'
      - 'tools/trial-publish.js'
      - '.github/workflows/release.yml'
      - '.github/workflows/release-publish.yml'
      - '.github/workflows/trial-publish.yml'
  schedule:
    - cron: '41 5 * * *' # 05:41 UTC, nightly
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# Only a PR's runs cancel each other. Called from release.yml, github.ref is the caller's (main),
# the same as the nightly's, so cancel-in-progress there would let the nightly cancel a release.
concurrency:
  group: trial-publish-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  trial-publish:
    # Pinned like the other jobs that install Chrome: ubuntu-latest moved to 26.04
    # (engineering/gotchas/ci.md).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cache Puppeteer browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      # puppeteer's postinstall swallows a failed download and exits 0; this step fails by name instead.
      - uses: ./.github/actions/puppeteer-chrome
        timeout-minutes: 5
      - run: npm run build
      # The publish step is swappable: set TRIAL_PUBLISH_COMMAND (a shell command run from the repo root,
      # with NPM_CONFIG_USERCONFIG naming the local registry and its token) to prove a release tool's own
      # publish path; the install and render checks stay the same (tools/trial-publish.js header).
      - name: Publish to a local registry, install, render
        run: node tools/trial-publish.js
