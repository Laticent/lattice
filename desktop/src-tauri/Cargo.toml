[package]
name = "lattice-studio"
version = "0.1.0"
description = "Lattice Studio — Markdown decks, boardroom finish"
authors = ["Laticent"]
license = "AGPL-3.0-only"
edition = "2021"
rust-version = "1.77"

[lib]
name = "lattice_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
percent-encoding = "2"
